<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14272b">
<title>Bible Answers — Study Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Serif+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eee8;--panel:#f6f8f4;--ink:#14272b;--dim:#53666a;--line:#cfd9d3;--teal:#1d6a73;--teal-d:#124a52;--mark:#f2c14e;--rose:#a73a52;--fs:17px;
--serif:'Noto Serif Telugu',Georgia,serif;--sans:'Noto Sans Telugu',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-theme=dark]{--bg:#0d181b;--panel:#142226;--ink:#e6eee9;--dim:#9db0b0;--line:#26393d;--teal:#5cc0c9;--teal-d:#8fd6dc;--mark:#8a6a14;--rose:#e58397}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d181b;--panel:#142226;--ink:#e6eee9;--dim:#9db0b0;--line:#26393d;--teal:#5cc0c9;--teal-d:#8fd6dc;--mark:#8a6a14;--rose:#e58397}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.shell{display:grid;grid-template-columns:1fr;height:100%;grid-template-rows:1fr auto}
.rail{grid-row:2;display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom))}
.rail .brand{display:none}
.nav{flex:1;padding:.5rem .2rem;font-size:.72rem;font-weight:600;color:var(--dim);border-radius:10px;text-align:center}
.nav[aria-current=page]{color:var(--teal-d);background:color-mix(in srgb,var(--teal) 14%,transparent)}
.stage{overflow:auto;min-height:0}
.page{max-width:980px;margin:0 auto;padding:1.2rem 1rem 2rem}
h1,h2,h3{font-family:var(--serif);line-height:1.35}
h2{font-size:1.25rem;margin:1.6rem 0 .7rem}
.sub{color:var(--dim);font-size:.9rem}
.hero{background:var(--teal-d);color:#fff;border-radius:18px;padding:1.4rem 1.3rem;position:relative;overflow:hidden}
:root[data-theme=dark] .hero,:root:not([data-theme=light]) .hero{--x:0}
.hero small{opacity:.8;font-size:.78rem}
.hero h1{font-size:1.35rem;margin:.4rem 0 .9rem;font-weight:600}
.hero .btn{background:var(--mark);color:#1b1500}
.ring{position:absolute;right:1rem;top:1rem;width:74px;height:74px}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:.85rem;background:var(--panel)}
.btn.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
:root[data-theme=dark] .btn.pri{color:#06191c}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.7rem}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem .9rem}
.tile b{display:block;font-family:var(--serif);font-size:.98rem}
.bar{height:5px;border-radius:9px;background:var(--line);margin-top:.6rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.qv{display:grid;grid-template-columns:1fr;height:100%;position:relative}
.list{overflow:auto;padding:.8rem;background:var(--bg)}
.tools{position:sticky;top:-.8rem;background:var(--bg);padding-bottom:.5rem;z-index:2}
.search{width:100%;padding:.7rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.chips{display:flex;gap:.35rem;overflow-x:auto;padding:.5rem 0;scrollbar-width:none}
.chip{flex:none;padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line);font-size:.78rem;background:var(--panel);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#06191c}
.item{display:block;width:100%;text-align:left;padding:.75rem .85rem;border-radius:12px;border:1px solid transparent;border-bottom-color:var(--line);font-family:var(--serif);font-size:.95rem}
.item:hover{background:var(--panel)}
.item[aria-current=true]{background:var(--panel);border-color:var(--teal)}
.item .m{display:flex;gap:.5rem;font-family:var(--sans);font-size:.72rem;color:var(--dim);margin-top:.25rem}
.item .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.done{color:var(--teal)}
.reader{display:none;overflow:auto;background:var(--panel);padding:1.1rem 1.1rem 3rem}
.qv.open .reader{display:block;position:absolute;inset:0;z-index:5}
.qv.open .list{display:none}
.back{margin-bottom:.8rem}
.reader h1{font-size:calc(var(--fs) * 1.3);font-weight:600}
.badge{display:inline-block;font-size:.74rem;padding:.15rem .6rem;border-radius:999px;background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal-d);font-weight:600}
.series{font-size:.82rem;color:var(--dim);margin-top:.5rem;border-left:3px solid var(--mark);padding-left:.6rem}
.ans{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:1rem 0;white-space:pre-wrap;max-width:62ch}
.refs{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.ref{padding:.25rem .7rem;border-radius:8px;background:color-mix(in srgb,var(--mark) 55%,transparent);font-weight:600;font-size:.85rem}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.acts .btn[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
textarea,input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;width:100%}
textarea{min-height:90px;resize:vertical}
.related button{display:block;text-align:left;padding:.4rem 0;color:var(--teal-d);font-family:var(--serif);font-size:.9rem}
.empty{padding:3rem 1rem;text-align:center;color:var(--dim)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.8rem}
.res{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.35rem;text-decoration:none;color:inherit}
.res:hover{border-color:var(--teal)}
.res b{font-family:var(--serif)}
.tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:auto;padding-top:.3rem}
.tag{font-size:.7rem;padding:.1rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.te{background:var(--mark);color:#1b1500;border-color:var(--mark)}
.scrim{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:50}
.scrim.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;padding:1.2rem 1.2rem calc(1.5rem + env(safe-area-inset-bottom))}
.sheet label{display:block;font-size:.8rem;font-weight:600;color:var(--dim);margin:.8rem 0 .25rem}
.vtext{font-family:var(--serif);font-size:1.02rem;line-height:1.9;margin:.7rem 0}
.vtext sup{color:var(--teal);font-family:var(--sans);margin-right:.25rem;font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem 1rem;border-radius:999px;font-size:.82rem;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(min-width:900px){
 .shell{grid-template-columns:210px 1fr;grid-template-rows:1fr}
 .rail{grid-row:1;flex-direction:column;justify-content:flex-start;gap:.2rem;border-top:0;border-right:1px solid var(--line);padding:1.2rem .8rem}
 .rail .brand{display:block;font-family:var(--serif);font-weight:700;font-size:1.1rem;margin:0 .4rem 1rem;line-height:1.3}
 .rail .brand span{display:block;font-family:var(--sans);font-weight:400;font-size:.72rem;color:var(--dim)}
 .nav{flex:none;text-align:left;font-size:.9rem;padding:.6rem .8rem}
 .qv{grid-template-columns:minmax(300px,380px) 1fr}
 .reader,.qv.open .reader{display:block;position:static}
 .qv.open .list{display:block}
 .back{display:none}
 .reader{border-left:1px solid var(--line);padding:1.8rem 2.2rem 4rem}
 .toast{bottom:1.5rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---- v4: groups, filters, install ---- */
.nav .ni{display:block;font-size:1rem;line-height:1.1;margin-bottom:.1rem;opacity:.9}
.installbar{display:flex;align-items:center;gap:.6rem;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:14px;padding:.6rem .7rem;margin-bottom:.9rem}
.installbar .ii{font-size:1.3rem}
.installbar .it{flex:1;min-width:0}
.installbar .it b{display:block;font-size:.9rem}
.installbar .it small{color:var(--dim);font-size:.75rem}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--dim);padding:.45rem .6rem}
.searchrow{margin:1rem 0 .4rem}
.searchbtn{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;padding:.85rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:.9rem}
.searchbtn:hover{border-color:var(--teal)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.6rem}
.gcard{display:flex;align-items:center;gap:.7rem;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.75rem .85rem}
.gcard:hover{border-color:var(--teal)}
.gcard .gi{font-size:1.5rem;line-height:1}
.gcard .gt{flex:1;min-width:0}
.gcard .gt b{display:block;font-family:var(--serif);font-size:.98rem;line-height:1.35}
.gcard .gt small{display:block;color:var(--dim);font-size:.74rem;margin-top:.1rem}
.gbar{display:block;height:4px;border-radius:9px;background:var(--line);margin-top:.45rem;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--teal)}
.gcard .gcount{font-size:.72rem;font-weight:700;color:var(--teal-d);min-width:2.4rem;text-align:right}
.searchbox{position:relative;display:flex;align-items:center;gap:.4rem;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.15rem .35rem .15rem .6rem}
.searchbox:focus-within{border-color:var(--teal)}
.searchbox .si{font-size:.9rem;opacity:.7}
.searchbox .search{border:0;background:transparent;padding:.6rem .1rem;flex:1;min-width:0}
.searchbox .search:focus{outline:none}
.sx{border:0;background:transparent;color:var(--dim);font-size:1rem;padding:.3rem .4rem}
.sf{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.42rem .6rem;font-size:.76rem;font-weight:700;color:var(--teal-d);white-space:nowrap}
.fcount{display:inline-block;background:var(--teal);color:#fff;border-radius:999px;padding:0 .35rem;font-size:.68rem;margin-left:.15rem}
:root[data-theme=dark] .fcount{color:#06191c}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.7rem .8rem;margin-top:.5rem}
.prow{display:flex;align-items:center;gap:.6rem;margin:.35rem 0}
.prow.wrap{flex-wrap:wrap}
.pl{font-size:.74rem;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;min-width:5.6rem}
.panel select,.panel input{padding:.45rem .6rem;border-radius:10px;font-size:.85rem}
.panel select{flex:1;min-width:0}
.toggles{display:flex;gap:.3rem;flex-wrap:wrap;flex:1}
.chips.small .chip{font-size:.72rem;padding:.25rem .6rem}
.resbar{display:flex;align-items:center;gap:.5rem;padding:.35rem .3rem .5rem;font-size:.82rem;color:var(--dim);flex-wrap:wrap}
.resbar b{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--teal-d);font-size:.78rem;font-weight:700;text-decoration:underline;padding:0}
.item .sn{font-family:var(--sans);font-size:.78rem;color:var(--dim);margin-top:.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tagnew{color:var(--rose);font-weight:700}
.badges{display:flex;gap:.35rem;flex-wrap:wrap}
.badge.alt{background:color-mix(in srgb,var(--mark) 40%,transparent);color:var(--ink)}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.8rem 0 1rem}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.6rem;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.25rem}
.stat small{color:var(--dim);font-size:.7rem}
.h3{font-size:1rem;margin-top:1.2rem}
.steps{margin:.4rem 0 .4rem 1.1rem;font-size:.88rem;line-height:1.75}
.steps li{margin-bottom:.3rem}
.empty{text-align:center;padding:2rem 1rem;color:var(--dim)}
.empty b{color:var(--ink);display:block;margin-bottom:.3rem}
.empty .btn{margin-top:.8rem}
</style>

l", "icon": "📖", "grp": "more"}, {"id": "other", "name": "ఇతరములు", "name_en": "Other", "icon": "📌", "grp": "more"}], "entries": [{"id": 1, "q": "క్రైస్తవ ప్రచారకులు బైబిల్ లోని విషయాలు దాచి పెడుతున్నారా?", "a": "లేదు. బైబిల్ పూర్తిగా అందుబాటులో ఉంది. యోహాను 18:20 — యేసు రహస్యంగా ఏమీ మాట్లాడలేదు. అపొ.కా. 20:27 — పౌలు దేవుని సంకల్పమంతా తెలియజేశాడు.", "refs": "యోహాను 18:20; అపొ.కా. 20:27", "cat": "general"}, {"id": 2, "q": "వాక్యమే దేవుడు ఎలా? బైబిల్ మరియు హైందవ గ్రంథాల నుండి", "a": "యోహాను 1:1 — \"వాక్యము దేవుడై యుండెను.\" వాక్యం = యేసుక్రీస్తు (1:14). దేవుని స్వభావం ఆయనలో పూర్తిగా వ్యక్తమైంది.", "refs": "యోహాను 1:1, 14", "cat": "general"}, {"id": 3, "q": "దేవుడు ఉన్నాడా? లేదా? చెప్పలేమా? బైబిల్ దేవునికి ఈ లక్షణాలు ఉన్నట్లు వాక్యాలు ఉన్నాయా? - 1. సృష్టి, స్థితి లయాలకు అంతటికీ కారకుడై ఉన్నాడా? - 2. ఆద్యంతాలు (చావు పుట్టుకలు) లేని వాడా? - 3. సర్వజ్ఞుడు అయినవాడా? - 4. సర్వవ్యాపకుడా? - 5. సర్వశక్తిమంతుడా? - 6. రాగద్వేషాలు, పక్షపాతం లేని వాడా? - 7. బైబిల్ దేవుడికి ఈ ఆరు లక్షణాల కంటే ఇంకా ముఖ్యమైన పరిశుద్ధత అనే లక్షణం కూడా ఉంది.", "a": "ఉన్నాడు (కీర్తన 19:1; రోమా 1:19–20). 1. సృష్టికర్త — ఆది 1:1; కొలస్సి 1:16–17 2. ఆద్యంతాలు లేనివాడు — కీర్తన 90:2 3. సర్వజ్ఞుడు — కీర్తన 139 4. సర్వవ్యాపకుడు — కీర్తన 139:7–10 5. సర్వశక్తిమంతుడు — యిర్మీయా 32:17 6. పక్షపాతం లేనివాడు — రోమా 2:11 7. పరిశుద్ధుడు — యెషయా 6:3", "refs": "కీర్తన 19:1; రోమా 1:19-20", "cat": "general"}, {"id": 4, "q": "యెషయాలో యెహోవా నా తరువాత ఏ దేవుడు లేదు అంటున్నాడు మరి యేసుక్రీస్తు దేవుడు కాదా?", "a": "యెషయా 43:10; 44:6 — బహుదేవతారాధనను ఖండించడం. త్రిత్వం = ముగ్గురు దేవుళ్ళు కాదు; ఒకే దేవుడు — మూడు వ్యక్తులు. యోహాను 10:30 — \"నేను తండ్రియు ఏకము.\"", "refs": "యెషయా 43:10; యోహాను 10:30", "cat": "god"}, {"id": 6, "q": "యేసుక్రీస్తు దేవుడు కాదు గనుకనే అంతా తండ్రి చిత్తం అన్నాడా?", "a": "లేదు. ఫిలిప్పీ 2:6–8 — దేవుని స్వరూపం ఉండి మనిషిగా విధేయుడయ్యాడు. మానవత్వంలో విధేయత; దైవత్వంలో సమానత్వం.", "refs": "ఫిలిప్పీ 2:6-8", "cat": "jesus"}, {"id": 7, "q": "యేసుక్రీస్తు దేవుడు అనడానికి బైబిల్ లో వాక్య ఆధారాలు ఉన్నాయా?", "a": "ఉన్నాయి: యోహాను 1:1, 14; 8:58; 20:28; తీతు 2:13; హెబ్రీ 1:8; కొలస్సి 2:9; ఫిలిప్పీ 2:6.", "refs": "యోహాను 1:1; 20:28; తీతు 2:13", "cat": "jesus"}, {"id": 8, "q": "విగ్రహారాధనను బైబుల్ దేవుడు ఎందుకు వద్దు అన్నాడు? హైందవులు విగ్రహారాధన చెయ్యవచ్చా? **యెహోవా సాకారుడా? నిరాకారుడా?**", "a": "నిర్గమ 20:3–5; యెషయా 44:9–20. దేవుడు ఆత్మ (యోహాను 4:24). విగ్రహం సృష్టిని సృష్టికర్త స్థానంలో పెడుతుంది. హిందువులు స్వేచ్ఛగా పాటించవచ్చు; బైబిల్ దృష్టిలో నిజ దేవుడు దాన్ని అంగీకరించడు.", "refs": "నిర్గమ 20:3-5; యోహాను 4:24", "cat": "god"}, {"id": 9, "q": "యెహోవా చూడగలిగిన ఆకారం గల వాడా? ఆకారం లేనివాడా?", "a": "ఆత్మ — యోహాను 4:24; 1 తిమోతి 1:17; 6:16. అదృశ్యుడు. అయితే ప్రత్యక్షతలో రూపం తీసుకున్న సందర్భాలు ఉన్నాయి.", "refs": "యోహాను 4:24; 1 తిమోతి 6:16", "cat": "god"}, {"id": 10, "q": "బైబిల్ లో యెహోవా పంపిన యెహోవానా? ఆయన ఎవరు? యెహోవాను ఎప్పుడూ ఎవరూ చూడలేదని యేసుక్రీస్తు చెప్పాడు అయితే బైబిల్ పాతనిబంధనలో భక్తులు చూసింది ఎవరిని?", "a": "యెహోవా దూత / కుమారుని ప్రత్యక్షత. యోహాను 1:18 — తండ్రిని ఎవరూ చూడలేదు; కుమారుడు బయలుపరచాడు.", "refs": "యోహాను 1:18", "cat": "theophany"}, {"id": 11, "q": "అబ్రాహాము, హగరు చూసింది ఎవరిని?", "a": "ఆది 18 — యెహోవా (దైవ సందర్శన). ఆది 16:7–13 — యెహోవా దూత; హాగరు \"దేవుని చూశాను\" అంది.", "refs": "ఆది 16:7-13; 18", "cat": "theophany"}, {"id": 12, "q": "యాకోబు చూసింది ఎవరిని?", "a": "ఆది 32:24–30 — దేవునితో పోరాడి \"దేవుని ముఖం చూశాను\" అన్నాడు.", "refs": "ఆది 32:24-30", "cat": "theophany"}, {"id": 13, "q": "గిద్యోను చూసినది ఎవరిని?", "a": "న్యాయాధిపతులు 6 — యెహోవా దూత = యెహోవా.", "refs": "న్యాయాధిపతులు 6", "cat": "theophany"}, {"id": 14, "q": "సంసోను తల్లి తండ్రులకు కనిపించినది ఎవరు?", "a": "న్యాయాధిపతులు 13 — యెహోవా దూత.", "refs": "న్యాయాధిపతులు 13", "cat": "theophany"}, {"id": 15, "q": "యెహోషువా, దావీదు చూసినది ఎవరిని?", "a": "యెహోషువ 5:13–15 — యెహోవా సైన్యాధిపతి. దావీదు — దైవ ప్రత్యక్షత సందర్భాలు.", "refs": "యెహోషువ 5:13-15", "cat": "theophany"}, {"id": 16, "q": "ఇశ్రాయేలు ప్రజలు మోషే కాలంలో తండ్రియైన యెహోవాను చూసారా?", "a": "లేదు. నిర్గమ 19–20 — మేఘం, అగ్ని, శబ్దం. నిర్గమ 33:20 — \"నా ముఖం చూచి బ్రతికేవాడు లేడు.\"", "refs": "నిర్గమ 33:20", "cat": "theophany"}, {"id": 17, "q": "ఇంతకు మోషే అయినా తండ్రియైన యెహోవాను చూశాడా?", "a": "నిర్గమ 33:18–23 — మహిమ వెనుక భాగం; ముఖం కాదు.", "refs": "నిర్గమ 33:18-23", "cat": "theophany"}, {"id": 18, "q": "యెషయా దేవుణ్ణి చూశాడా? దేవుని మహిమనా? దేవుని మహిమ ఎవరు? **జంతు బలులు - పాపక్షమాపణ - యేసుక్రీస్తు**", "a": "యెషయా 6 — ప్రభువు మహిమ. యోహాను 12:41 — ఇది క్రీస్తు మహిమ.", "refs": "యెషయా 6; యోహాను 12:41", "cat": "theophany"}, {"id": 19, "q": "బైబిల్ లో జంతుబలులు ఎందుకు ఉన్నాయి? అవి ఎన్ని రకాలు?", "a": "పాపం = మరణం (రోమా 6:23). బలి = ప్రతినిధి మరణం (లేవీయకాండం 17:11). రకాలు: దహనబలి, పాపబలి, అపరాధబలి, సమాధానబలి, నైవేద్యం.", "refs": "లేవీయకాండము 17:11; రోమా 6:23", "cat": "sacrifice"}, {"id": 20, "q": "బలులు యెహోవాకు ఆహారం కొనుమా?", "a": "లేదు. కీర్తన 50:12–13 — \"ఏళ్ల మాంసం తింటానా?\"", "refs": "కీర్తన 50:12-13", "cat": "sacrifice"}, {"id": 21, "q": "ఉదయం ఒక గొర్రె సాయంత్రం ఒక గొర్రె బలిగా ఇవ్వమన్నాడు మధ్యాహ్నం యెహోవా మరేది పోయ్యాడా?", "a": "లేదు. నిత్య బలి = నిబంధన స్మరణ, సమర్పణ (నిర్గమ 29:38–42). ఆహారం కాదు.", "refs": "నిర్గమ 29:38-42", "cat": "sacrifice"}, {"id": 22, "q": "యెహోవా బలుల ఆహారంగా తినక పోతే మరి ఎవరు తినేవారు?", "a": "యాజకులు, అర్పించినవారు (లేవీయకాండం 6–7).", "refs": "లేవీయకాండము 6-7", "cat": "sacrifice"}, {"id": 23, "q": "యెహోవా కొవ్వును తన కొరకు ఎందుకు దహించమని చెప్పాడు? కొవ్వు అంటే యెహోవాకు బాగా ఇష్టమా?", "a": "లేవీయకాండం 3:16 — కొవ్వు యెహోవాది. ఉత్తమ భాగం సమర్పణ.", "refs": "లేవీయకాండము 3:16", "cat": "sacrifice"}, {"id": 24, "q": "యెహోవా కొవ్వును దహించినప్పుడు వచ్చే సువాసన ఇంపైనది అని ఎందుకు అన్నాడు?", "a": "విధేయత, సమర్పణ స్వీకారం (ఆది 8:21). ఆధ్యాత్మిక అర్థం.", "refs": "ఆది 8:21", "cat": "sacrifice"}, {"id": 25, "q": "బలులు వద్దు అని యెహోవా ఎందుకు అన్నాడు?", "a": "కీర్తన 51:16–17; యెషయా 1:11–17 — హృదయం లేని బలులు వద్దు. వ్యవస్థను రద్దు కాదు; కపటాన్ని ఖండించడం.", "refs": "కీర్తన 51:16-17; యెషయా 1:11-17", "cat": "sacrifice"}, {"id": 26, "q": "బలులు అంటే యెహోవాకు విసుగొచ్చి వద్దు అన్నాడా?", "a": "లేదు. హృదయ రహిత ఆచారాన్ని ఖండించాడు, బలి వ్యవస్థను కాదు.", "refs": "యెషయా 1:11-17", "cat": "sacrifice"}, {"id": 27, "q": "జంతు బలులు యెహోవా తరతరాలు చెయ్యమంటే క్రైస్తవులు ఎందుకు ఆపారు?", "a": "హెబ్రీ 10:1–14 — యేసు ఒక్కసారి అర్పించి పరిపూర్ణం చేశాడు. నీడ నెరవేరింది.", "refs": "హెబ్రీ 10:1-14", "cat": "sacrifice"}, {"id": 28, "q": "జంతుబలులను యెహోవా యేసుక్రీస్తుకు ఛాయారూపంగానే పెట్టాడా?", "a": "అవును. హెబ్రీ 9–10; 1 కొరింథీ 5:7 — పస్కా గొర్రె = క్రీస్తు.", "refs": "హెబ్రీ 9-10; 1 కొరింథీ 5:7", "cat": "sacrifice"}, {"id": 29, "q": "యేసుక్రీస్తు చెప్పుకున్నాడా పాత నిబంధనలో యెహోవా తన గురించి చెప్పినట్లే బలియాగం తాను చేస్తున్నట్లు?", "a": "లూకా 22:19–20; మత్తయి 26:28 — \"ఇది నా రక్తం… పాపక్షమాపణ కోసం.\" యెషయా 53 నెరవేర్పు.", "refs": "లూకా 22:19-20; యెషయా 53", "cat": "sacrifice"}, {"id": 30, "q": "మన పాపాలకు యేసుక్రీస్తు శిక్ష అనుభవించడం ఏమిటి? **అరిషడ్వర్గాలు (కామ, క్రోధ, లోభ, మోహ, మద, మాత్సర్యాలు)కు బైబిల్ దేవుడు బందీ అయ్యాడా?**", "a": "యెషయా 53:4–6; 1 పేతురు 2:24; 2 కొరింథీ 5:21 — ఆయన మన పాపాలను మోసి, మనకు నీతి ఇచ్చాడు.", "refs": "యెషయా 53:4-6; 1 పేతురు 2:24", "cat": "jesus"}, {"id": 31, "q": "యెహోవాకు మాత్సర్యము (అసూయ) ఉందా?", "a": "నిర్గమ 34:14; రోమా 1:18 — నీతియుత స్పందన (మాత్సర్యం/కోపం). మానవ అరిషడ్వర్గాలు కాదు. మోషే సేవకుడు, దేవుడు మూలం (హెబ్రీ 3:3–5).", "refs": "నిర్గమ 34:14; రోమా 1:18; హెబ్రీ 3:3-5", "cat": "attributes"}, {"id": 34, "q": "యెహోవా ఇశ్రాయేలు వాళ్ళకు మాత్రమే దేవుడా? వారినే ప్రేమించాడా?", "a": "ఆది 12:3 — అన్ని జాతులు ఆశీర్వదించబడతాయి. మొదట ఇశ్రాయేలు; తర్వాత అన్ని జాతులు (మత్తయి 28:19; యోహాను 3:16). యోనా, నయమాను ఉదాహరణలు.", "refs": "ఆది 12:3; మత్తయి 28:19", "cat": "attributes"}, {"id": 39, "q": "యెహోవా ఆదాము, హవ్వలకు జ్ఞానఫలం లోభి గనుక తినవద్దు అని అన్నాడా?", "a": "రూపకాలు / నిబంధన భంగం వర్ణన. దేవునికి లైంగిక కామం లేదు. జ్ఞానఫలం = విధేయత పరీక్ష (ఆది 2:16–17). \"నన్ను మాత్రమే పూజించు\" = సత్యం, అహంకారం కాదు.", "refs": "ఆది 2:16-17; నిర్గమ 20:3", "cat": "attributes"}, {"id": 46, "q": "బైబిల్ ప్రకారం భూమి వయస్సు వేలా? లక్షలా?", "a": "బైబిల్ ఖచ్చిత శాస్త్రీయ వయస్సు ఇవ్వదు; సృష్టికర్తను చూపుతుంది (ఆది 1:1). నోదు స్థానం తెలియదు; కయీను భార్య = ఆదాము కుమార్తెలలో ఒకరు (ఆది 5:4). యెహోవా నామం మోషేకు వివరించబడింది (నిర్గమ 6:2–3).", "refs": "ఆది 1:1; 5:4; నిర్గమ 6:2-3", "cat": "general"}, {"id": 53, "q": "ఫరో అంటే భయపడి యెహోవా మోషేతో అబద్ధం చెప్పించాడా?", "a": "ఫరో తానే కఠినపరచుకున్నాడు; ఐగుప్తు బానిసత్వం/శిశు హత్య చేసింది (నిర్గమ 1). రక్త గుర్తు = విశ్వాస నిబంధన. అరణ్య శిక్ష = అపనమ్మకం, సణుగు (సంఖ్యా 13–14).", "refs": "నిర్గమ 1; 12; సంఖ్యా 13-14", "cat": "exodus"}, {"id": 60, "q": "విగ్రహాలను పడగొట్టడం, విగ్రహారాధకులను చంపడం బైబిల్ లో ఎందుకు ఉంది?", "a": "కనాను సంస్కృతిలో శిశు బలి, లైంగిక ఆచారాలు (లేవీయకాండం 18; ద్వితీయోపదేశకాండం 12:31). పరిశుద్ధ జాతి నియమాలు. నేడు క్రైస్తవులు హింసతో కాదు — సువార్తతో (2 కొరింథీ 10:4). కఠిన ప్రవచనాలు = యుద్ధ/తీర్పు వర్ణన.", "refs": "లేవీయకాండము 18; 2 కొరింథీ 10:4", "cat": "law"}, {"id": 76, "q": "పంచకాండాలు, ధర్మశాస్త్రం, యెహోవా యుద్ధములు అనే గ్రంథాలు మోషేనే రాశాడా? మోషే తన మరణం గూర్చి తన ఎలా ద్వితీయోపదేశకాండములో వ్రాసుకున్నాడు?", "a": "ధర్మశాస్త్రం పాపం తెలియజేస్తుంది; రక్షణ విశ్వాసం వలన (రోమా 3:20–28; గలతీ 3:24). సున్నతి అన్యులకు అవసరం లేదు (అపొ.కా. 15). కొత్త నిబంధన క్రీస్తు రక్తంలో (యిర్మీయా 31:31; హెబ్రీ 8).", "refs": "రోమా 3:20-28; అపొ.కా. 15; హెబ్రీ 8", "cat": "other"}, {"id": 78, "q": "ఏలి కుమారుల పాపమును బట్టి ఇశ్రాయేలీయులందరినీ యెహోవా అన్యాయంగా శిక్షించాడా? **ఇంత చిన్న లాజిక్ ఎలా మిస్ అయ్యారు? అంటూ యెహోవాను పరిశుద్ధాత్మను విమర్శిస్తూ విమర్శకులు వ్రాసిన అంశకి జవాబు**", "a": "ఒకరే పరిశుద్ధాత్మ (యోహాను 14:16, 26). యేసు వెళ్లిన తర్వాత ఆత్మ సంఘంలో నివసించడానికి వచ్చాడు (యోహాను 16:7). త్రిత్వం = ఒకే దేవుడు, మూడు వ్యక్తులు.", "refs": "యోహాను 14:16; 16:7; మత్తయి 28:19", "cat": "spirit"}, {"id": 116, "q": "యూదా వారు పాపములో పడి ఘోరమైన హింసాత్మక చేష్టలు చేస్తారని యెహోవాకు ఎందుకు తోచలేదు?", "a": "మానవ బలహీనత. పునరుత్థానం తర్వాత వారు మారి మరణం వరకు సాక్ష్యం చెప్పారు — మోసం అయితే ఇలా చనిపోరు.", "refs": "లూకా 22; యోహాను 21; అపొ.కా. 2", "cat": "other"}, {"id": 136, "q": "యేసుక్రీస్తును బలవంతంగా శిలువ వేసారా? స్వయంగా యేసుక్రీస్తు శిలువ మరణానికి తనని తాను అప్పగించుకున్నాడా?", "a": "యేసు శిలువ = పాపక్షమాపణ కోసం ప్రాణత్యాగం (యెషయా 53; 1 పేతురు 2:24). ధర్మశాస్త్ర శాపాన్ని ఆయన మోశాడు (గలతీ 3:13).", "refs": "యెషయా 53; గలతీ 3:13; 1 పేతురు 2:24", "cat": "other"}, {"id": 196, "q": "యేసుక్రీస్తు వాక్యం బోధించడమే దేవుడు తనకు అప్పగించిన సంపూర్ణమైన పని గానీ పాపక్షమాపణ కొరకు మరణోపధం కాదా?", "a": "యోహాను 1:1, 14; 8:58; 20:28; తీతు 2:13; హెబ్రీ 1:8; కొలస్సి 2:9 — యేసు దేవుడు, ఆరాధనకు అర్హుడు.", "refs": "యోహాను 1:1; 20:28; తీతు 2:13", "cat": "jesus"}, {"id": 216, "q": "మెల్కీసెదెకును పోలిన యాజకుడు యేసుక్రీస్తు ఎలా?", "a": "హెబ్రీ 7 — యేసు నిత్య యాజకుడు; లేవీయ యాజకత్వం కంటే శ్రేష్ఠం.", "refs": "హెబ్రీ 7", "cat": "paul"}, {"id": 225, "q": "యెహోవాకు నిత్యజీవం అంటే తెలుసా లేదా?", "a": "యోహాను 14:6 — \"నేనే మార్గం, సత్యం, జీవం.\" ఇతర ప్రవక్తలు నిత్యజీవం ఇవ్వలేరు. యోహాను 20:29 — చూడక నమ్మినవారు ధన్యులు.", "refs": "యోహాను 14:6; 20:29", "cat": "other"}, {"id": 228, "q": "యేసుక్రీస్తును నమ్మిన విశ్వాసులు సూచకక్రియలు ఎవరినో మెప్పించడం కొరకు వారు అడిగారు కదా అని చెయ్యవచ్చా? **అదిగో దెయ్యం నాకేం భయం పేరుతో విమర్శకుల వక్రీకరణలకు జవాబు**", "a": "పాత నిబంధనలోనూ ఉన్నాయి (1 సమూయేలు 16:14; యోబు 1). సాతాను = పతన దూత (యెషయా 14; ప్రకటన 12). దయ్యాలు = దురాత్మలు. రోగాలు అన్నీ దయ్యాల వలన కావు (యోహాను 9:1–3).", "refs": "యోబు 1; ప్రకటన 12; యోహాను 9:1-3", "cat": "demons"}, {"id": 238, "q": "బైబిల్ లో స్త్రీలపై వివక్ష ఉందా? ఉపదేశించకూడదు, మౌనంగా ఉండాలి మాట్లాడటానికి అనుమతి లేదా?", "a": "క్రీస్తులో సమానత్వం (గలతీ 3:28). ప్రవక్తినులు, సాక్షులు ఉన్నారు. 1 కొరింథీ 14 / 1 తిమోతి 2 సందర్భబద్ధ నియమాలు.", "refs": "గలతీ 3:28; రోమా 16", "cat": "ethics"}, {"id": 240, "q": "ద్రాక్షారసము త్రాగవద్దు అని బైబిల్ లో ఉంటే మరి ద్రాక్షారసము త్రాగిన యేసుక్రీస్తు పరిశుద్ధుడు ఎలా అవుతాడు? బైబిల్ లో ద్రాక్షారసమును ఎన్ని రకాలుగా వాడేవారు? యేసుక్రీస్తు ఏ ద్రాక్షారసము త్రాగేవాడు?", "a": "మద్యపానం నిషేధం (ఎఫెసీ 5:18; సామెతలు 20:1). యేసు మితం/విందు సందర్భం. కానా = అద్భుతం, మత్తు ప్రోత్సాహం కాదు.", "refs": "ఎఫెసీ 5:18; యోహాను 2", "cat": "ethics"}, {"id": 245, "q": "సర్వ సృష్టికి పెళ్ళి సువార్త చెప్పమని బైబిల్ లో ఉన్న వాక్యానికి మూల ఆధారాలు లేవా? మార్కు 16:9-20 వాక్యాలకు ఆధారాలు ఉన్నాయా? కల్పించారా?", "a": "మార్కు 16:9–20 కొన్ని ప్రతులలో లేవు; మత్తయి 28:19; లూకా 24:47; అపొ.కా. 1:8 అన్యులకు సువార్త స్పష్టం.", "refs": "మత్తయి 28:19; అపొ.కా. 1:8", "cat": "other"}, {"id": 246, "q": "అన్యులకు సువార్త చెప్పాలని యేసుక్రీస్తు ఎక్కడా చెప్పలేదా? క్రైస్తవ విస్తారణ కొరకు శిష్యులు కుట్రతో తరువాత బైబిల్ సువార్తలలో కలిపారా? **క్రీస్తు కన్యకకు పుట్టలేదు అంటూ విమర్శకులు వక్రీకరించిన వాటికి జవాబు**", "a": "యెషయా 7:14 — అల్మా/పార్థెనోస్ = కన్యక. మత్తయి 1:22–23 అన్వయం. ఇమ్మానుయేలు = స్వభావం; యేసు = రక్షణ నామం.", "refs": "యెషయా 7:14; మత్తయి 1:22-23", "cat": "other"}, {"id": 254, "q": "పాపులను రక్షించడంలో యోనా సఫలం యేసుక్రీస్తు విఫలం అయ్యాడా? యోనా కంటే యేసుక్రీస్తు గొప్పవాడు ఎలా?", "a": "మత్తయి 12:41 — యేసు యోనా కంటే గొప్పవాడు. యోనా = నీడ; యేసు = నిజం.", "refs": "మత్తయి 12:41", "cat": "prophecy"}, {"id": 257, "q": "యేసుక్రీస్తు గలిలయలో ఉన్న అన్యజనులకు తన బోధలు బోధించలేదా? గలిలయలో ఉన్న యూదులకే బోధించాడా?", "a": "గలిలయలో యూదులు + అన్యులు ఉన్నారు. మత్తయి 4:15–16; 8:5–13 (శతాధిపతి); 15:21–28 (కనానీయురాలు).", "refs": "మత్తయి 4:15-16; 8:5-13", "cat": "other"}, {"id": 258, "q": "బైబిల్ ను ఎవరు రాశారు? ఎన్ని సంవత్సరాలలో రాశారు?", "a": "సుమారు 40 మంది రచయితలు సుమారు 1,500 సంవత్సరాల కాలంలో రాశారు. అయినా అంతటా ఒకే సందేశం — దేవుని రక్షణ ప్రణాళిక — కనిపిస్తుంది. 2 తిమోతి 3:16 — లేఖనమంతయు దైవప్రేరితము. 2 పేతురు 1:21 — పరిశుద్ధాత్మ ప్రేరణతో మనుష్యులు దేవుని మాటలు పలికారు.", "refs": "2 తిమోతి 3:16; 2 పేతురు 1:21", "cat": "general", "new": true}, {"id": 259, "q": "బైబిల్ ప్రతులు కాలక్రమేణా మారిపోయాయా?", "a": "లేదు. అనేక ప్రాచీన చేతివ్రాత ప్రతులు ఉన్నాయి. మృత సముద్ర గ్రంథపుచుట్టలలోని యెషయా గ్రంథం సుమారు క్రీ.పూ. 2వ శతాబ్దానిది; దానిని తరువాతి ప్రతులతో పోల్చినప్పుడు ముఖ్య బోధలలో మార్పు లేదు. యెషయా 40:8 — మన దేవుని వాక్యము నిత్యము నిలుచును.", "refs": "యెషయా 40:8; మత్తయి 24:35", "cat": "general", "new": true}, {"id": 260, "q": "ప్రార్థన ఎలా చేయాలి? యేసు నేర్పిన పద్ధతి ఏమిటి?", "a": "శిష్యులు అడిగినప్పుడు యేసు ప్రభువు ప్రార్థన నేర్పాడు (మత్తయి 6:9–13): దేవుని మహిమ, ఆయన రాజ్యం, రోజువారీ ఆహారం, క్షమాపణ, శోధన నుండి రక్షణ. ఫిలిప్పీ 4:6–7 — దేనిని గూర్చియు చింతపడక ప్రార్థనలో మీ విన్నపములు తెలియజేయండి. 1 యోహాను 5:14 — ఆయన చిత్తానుసారంగా అడిగితే ఆలకిస్తాడు.", "refs": "మత్తయి 6:9-13; ఫిలిప్పీ 4:6-7; 1 యోహాను 5:14", "cat": "general", "new": true}, {"id": 261, "q": "పాపక్షమాపణ ఎలా పొందాలి?", "a": "యేసుక్రీస్తు రక్తం ద్వారా (ఎఫెసీ 1:7). మారుమనస్సు పొంది ఒప్పుకుంటే ఆయన క్షమిస్తాడు (1 యోహాను 1:9; అపొ.కా. 3:19). యేసు ప్రభువని నోటితో ఒప్పుకొని, ఆయనను దేవుడు మృతులలోనుండి లేపాడని హృదయంలో నమ్మితే రక్షణ (రోమా 10:9–10).", "refs": "ఎఫెసీ 1:7; 1 యోహాను 1:9; రోమా 10:9-10", "cat": "sacrifice", "new": true}, {"id": 262, "q": "యేసుక్రీస్తు నిజంగా చరిత్రలో జీవించాడా?", "a": "అవును. యూదు చరిత్రకారుడు జోసిఫస్, రోమా చరిత్రకారుడు టాసిటస్ వంటి క్రైస్తవేతరులు కూడా ఆయన గురించి రాశారు. సువార్తలు ప్రత్యక్ష సాక్షుల సాక్ష్యం ఆధారంగా రాయబడ్డాయి: లూకా 1:1–4; 1 యోహాను 1:1–3.", "refs": "లూకా 1:1-4; 1 యోహాను 1:1-3", "cat": "jesus", "new": true}, {"id": 265, "q": "యేసు పాపులను చేరదీయడం, పాపం చెప్పడం — ఆయన అందరినీ అంగీకరించాడా?", "a": "ఆయన పాపులను ప్రేమించాడు, పాపాన్ని కాదు. జక్కయ్య (లూకా 19:1–10), సమరయ స్త్రీ (యోహాను 4) — వారిని కలుసుకొని మార్పుకు నడిపించాడు. వ్యభిచారంలో పట్టబడిన స్త్రీతో \"ఇకమీదట పాపము చేయకుము\" అన్నాడు (యోహాను 8:11).", "refs": "లూకా 19:1-10; యోహాను 8:11", "cat": "jesus", "new": true}, {"id": 266, "q": "త్రిత్వం అనే పదం బైబిల్ లో ఉందా?", "a": "పదం లేదు, కానీ బోధ ఉంది. తండ్రి, కుమారుడు, పరిశుద్ధాత్మ \"నామమున\" (ఒకే నామము) బాప్తిస్మం ఇవ్వాలి (మత్తయి 28:19). యేసు బాప్తిస్మం సమయంలో ముగ్గురూ ఒకేసారి కనిపించారు (మత్తయి 3:16–17). దేవుడు ఒక్కడే (ద్వితీయోపదేశకాండం 6:4); ఆయనలో ముగ్గురు వ్యక్తులు.", "refs": "మత్తయి 28:19; మత్తయి 3:16-17; 2 కొరింథీ 13:14", "cat": "trinity", "new": true}, {"id": 268, "q": "పరిశుద్ధాత్మ ఒక శక్తియా, లేక వ్యక్తియా?", "a": "వ్యక్తి. ఆయన బోధిస్తాడు (యోహాను 14:26), దుఃఖపడతాడు (ఎఫెసీ 4:30), ఆలోచన కలవాడు (రోమా 8:27). అననీయ పరిశుద్ధాత్మను మోసం చేస్తే \"దేవునితో అబద్ధమాడితివి\" అన్నాడు పేతురు (అపొ.కా. 5:3–4).", "refs": "యోహాను 14:26; ఎఫెసీ 4:30; అపొ.కా. 5:3-4", "cat": "spirit", "new": true}, {"id": 269, "q": "పరిశుద్ధాత్మ ఫలం అంటే ఏమిటి?", "a": "గలతీ 5:22–23 — ప్రేమ, సంతోషం, సమాధానం, దీర్ఘశాంతం, దయాళుత్వం, మంచితనం, విశ్వాసం, సాత్వికం, ఆశానిగ్రహం. ఇవి పరిశుద్ధాత్ముడు విశ్వాసి జీవితంలో పెంచే గుణాలు.", "refs": "గలతీ 5:22-23", "cat": "spirit", "new": true}, {"id": 270, "q": "విశ్వాసం వల్లనే రక్షణ అయితే క్రియలు అవసరం లేదా?", "a": "రక్షణ కృపవలన, విశ్వాసం ద్వారా — క్రియల వలన కాదు (ఎఫెసీ 2:8–9). కానీ రక్షింపబడినవారు సత్క్రియల కోసం సృష్టింపబడ్డారు (ఎఫెసీ 2:10). క్రియలు లేని విశ్వాసం మృతము (యాకోబు 2:17) — క్రియలు రక్షణకు కారణం కాదు, నిజమైన విశ్వాసానికి ఫలం.", "refs": "ఎఫెసీ 2:8-10; యాకోబు 2:17", "cat": "paul", "new": true}, {"id": 271, "q": "పౌలు యేసును చూశాడా? ఆయన అపొస్తలుడు ఎలా అయ్యాడు?", "a": "దమస్కు మార్గంలో పునరుత్థాన క్రీస్తు పౌలుకు ప్రత్యక్షమయ్యాడు (అపొ.కా. 9:1–19; 1 కొరింథీ 15:8). తన సువార్త మనుష్యుల నుండి కాక యేసుక్రీస్తు బయలుపాటు వలన వచ్చిందని చెప్పాడు (గలతీ 1:11–12). పేతురు పౌలు పత్రికలను లేఖనాలతో సమానంగా పేర్కొన్నాడు (2 పేతురు 3:15–16).", "refs": "అపొ.కా. 9:1-19; గలతీ 1:11-12; 2 పేతురు 3:15-16", "cat": "paul", "new": true}, {"id": 272, "q": "పది ఆజ్ఞలు క్రైస్తవులకు వర్తిస్తాయా?", "a": "యేసు ధర్మశాస్త్రాన్ని కొట్టివేయడానికి కాదు, నెరవేర్చడానికి వచ్చాడు (మత్తయి 5:17). రక్షణ కోసం మనం ధర్మశాస్త్రం కింద లేము, కృప కింద ఉన్నాం (రోమా 6:14). అయినా దేవుణ్ణి, పొరుగువానిని ప్రేమించడమనే సారాంశం కొత్త నిబంధనలో కొనసాగుతుంది (మత్తయి 22:37–40; రోమా 13:8–10).", "refs": "మత్తయి 5:17; రోమా 6:14; రోమా 13:8-10", "cat": "law", "new": true}, {"id": 273, "q": "క్రైస్తవులు ఆదివారం ఎందుకు ఆరాధిస్తారు?", "a": "యేసు వారంలో మొదటి దినాన లేచాడు (యోహాను 20:1, 19). తొలి విశ్వాసులు ఆ దినాన కూడుకొని రొట్టె విరిచారు (అపొ.కా. 20:7), కానుకలు వేసేవారు (1 కొరింథీ 16:2). దినాలను గూర్చి ఇతరులు తీర్పు తీర్చకూడదు (కొలస్సి 2:16–17; రోమా 14:5).", "refs": "అపొ.కా. 20:7; 1 కొరింథీ 16:2; కొలస్సి 2:16-17", "cat": "law", "new": true}, {"id": 274, "q": "దేవుడు ప్రేమామయుడైతే నరకం ఎందుకు ఉంది?", "a": "దేవుడు ఎవడును నశింపవలెనని కోరడు, అందరూ మారుమనస్సు పొందాలని కోరుతున్నాడు (2 పేతురు 3:9). ఆయన తన కుమారుని ఇచ్చాడు (యోహాను 3:16–18). ఆ రక్షణను తిరస్కరించినవారికి న్యాయమైన తీర్పు ఉంటుంది (రోమా 2:5–8; మత్తయి 25:46).", "refs": "యోహాను 3:16-18; 2 పేతురు 3:9; రోమా 2:5-8", "cat": "god", "new": true}, {"id": 275, "q": "మంచి దేవుడు ఉంటే లోకంలో బాధ, చెడు ఎందుకు ఉన్నాయి?", "a": "పాపం ద్వారా లోకంలోకి మరణం, బాధ వచ్చాయి (ఆది 3; రోమా 5:12). దేవుడు బాధలో మనతో ఉంటాడు (యోహాను 16:33; రోమా 8:28). యేసు స్వయంగా బాధపడ్డాడు (యెషయా 53:3). చివరకు ఆయన కన్నీరంతా తుడిచివేస్తాడు (ప్రకటన 21:4).", "refs": "ఆది 3; రోమా 5:12; యెషయా 53:3; ప్రకటన 21:4", "cat": "god", "new": true}, {"id": 276, "q": "ఆదాము పాపం చేస్తే మనం ఎందుకు దాని ఫలితం అనుభవించాలి?", "a": "ఒక్క మనుష్యుని ద్వారా పాపం, మరణం లోకంలోకి వచ్చాయి; ఒక్కని (క్రీస్తు) విధేయత ద్వారా అనేకులు నీతిమంతులుగా తీర్చబడతారు (రోమా 5:12–19). మనమూ స్వయంగా పాపం చేశాము (రోమా 3:23); అందుకే క్రీస్తులో కృప అందరికీ అవసరం.", "refs": "రోమా 5:12-19; రోమా 3:23", "cat": "general", "new": true}, {"id": 277, "q": "యేసుక్రీస్తు గురించి పాతనిబంధన ప్రవచనాలు ఎలా నెరవేరాయి?", "a": "బెత్లెహేములో జననం (మీకా 5:2; మత్తయి 2:1), గాడిదపై యెరూషలేము ప్రవేశం (జెకర్యా 9:9; మత్తయి 21:4–5), ముప్పై వెండి నాణేలకు అమ్మబడడం (జెకర్యా 11:12–13; మత్తయి 26:15), చేతులు కాళ్లు గుచ్చబడడం (కీర్తన 22:16), గుచ్చబడిన వానిని చూడడం (జెకర్యా 12:10; యోహాను 19:34–37).", "refs": "మీకా 5:2; జెకర్యా 9:9; కీర్తన 22:16; జెకర్యా 12:10", "cat": "prophecy", "new": true}, {"id": 278, "q": "క్రైస్తవులు ఇతర మతాల వారితో ఎలా వ్యవహరించాలి?", "a": "ప్రేమతో, గౌరవంతో. \"నిన్ను వలె నీ పొరుగువానిని ప్రేమించు\" (మత్తయి 22:39). సాధ్యమైనంతవరకు అందరితో సమాధానంగా ఉండాలి (రోమా 12:18). మన నిరీక్షణను గూర్చి అడిగిన ప్రతివారికి సాత్వికముతో, భయభక్తులతో జవాబు చెప్పాలి (1 పేతురు 3:15–16).", "refs": "మత్తయి 22:39; రోమా 12:18; 1 పేతురు 3:15-16", "cat": "ethics", "new": true}, {"id": 279, "q": "పేదల గురించి యేసు ఏమి బోధించాడు?", "a": "పేదలకు చేసినది తనకే చేసినట్లని చెప్పాడు (మత్తయి 25:35–40). పేదలను కరుణించువాడు యెహోవాకు అప్పిచ్చును (సామెతలు 19:17). మాటలతో ఊరుకోక చేతల ద్వారా సహాయం చేయాలి (యాకోబు 2:15–16).", "refs": "మత్తయి 25:35-40; సామెతలు 19:17; యాకోబు 2:15-16", "cat": "ethics", "new": true}, {"id": 280, "q": "సాతానును ఎదిరించడం ఎలా?", "a": "దేవునికి లోబడి సాతానును ఎదిరిస్తే వాడు పారిపోతాడు (యాకోబు 4:7). దేవుడిచ్చు సర్వాంగ కవచం ధరించాలి (ఎఫెసీ 6:10–18). మెలకువగా ఉండి విశ్వాసంలో స్థిరంగా నిలబడాలి (1 పేతురు 5:8–9).", "refs": "యాకోబు 4:7; ఎఫెసీ 6:10-18; 1 పేతురు 5:8-9", "cat": "demons", "new": true}, {"id": 282, "q": "పరలోకం, నిత్యజీవం గురించి బైబిల్ ఏమి చెబుతుంది?", "a": "యేసు తన శిష్యులకు స్థలం సిద్ధపరచి మళ్ళీ వచ్చి చేర్చుకుంటానన్నాడు (యోహాను 14:1–3). కుమారుని కలిగినవాడు నిత్యజీవం కలిగి ఉన్నాడు (1 యోహాను 5:11–13). కొత్త ఆకాశం, కొత్త భూమి వాగ్దానం చేయబడింది (ప్రకటన 21:1–4).", "refs": "యోహాను 14:1-3; 1 యోహాను 5:11-13; ప్రకటన 21:1-4", "cat": "general", "new": true}, {"id": 283, "q": "యేసుక్రీస్తు \"నన్ను ఆరాధించండి\" అని ఎప్పుడైనా అన్నాడా?", "a": "ఆయన తనను ఆరాధించడాన్ని ఎప్పుడూ ఖండించలేదు, అంగీకరించాడు. తోమా \"నా ప్రభువా, నా దేవా\" అన్నప్పుడు సరిదిద్దలేదు (యోహాను 20:28–29). శిష్యులు ఆయనను ఆరాధించారు (మత్తయి 14:33; 28:9, 17). పేతురు, దేవదూత ఆరాధనను నిరాకరించగా (అపొ.కా. 10:25–26; ప్రకటన 22:8–9) యేసు నిరాకరించలేదు.", "refs": "యోహాను 20:28-29; మత్తయి 14:33; అపొ.కా. 10:25-26; ప్రకటన 22:8-9", "cat": "jesus", "new": true}, {"id": 284, "q": "యేసు శిలువ వేయబడలేదు, ఆయన స్థానంలో వేరొకరిని వేశారు అనేది నిజమా?", "a": "శిలువ మరణానికి చారిత్రక ఆధారాలు ఉన్నాయి: నాలుగు సువార్తలు, యూదు చరిత్రకారుడు జోసిఫస్, రోమా చరిత్రకారుడు టాసిటస్. ప్రత్యక్ష సాక్షి యోహాను సైనికుడు ఈటెతో పొడిచినప్పుడు రక్తం, నీళ్లు కారడం చూశాడు (యోహాను 19:33–35). ఆయన తల్లి, శిష్యులు అక్కడే ఉన్నారు (యోహాను 19:25–27). \"వేరొకరిని వేశారు\" అనే వాదన శతాబ్దాల తరువాత వచ్చింది.", "refs": "యోహాను 19:33-35; యోహాను 19:25-27", "cat": "jesus", "new": true}, {"id": 285, "q": "బైబిల్ లో పరస్పర వైరుధ్యాలు ఉన్నాయా? (ఉదా: యూదా మరణం)", "a": "చాలావరకు ఒకే సంఘటనను వేర్వేరు కోణాల్లో చెప్పడమే. యూదా ఉరి వేసుకున్నాడు (మత్తయి 27:5); తరువాత శరీరం పడి పగిలిపోయింది (అపొ.కా. 1:18) — రెండూ కలిసి సరిపోతాయి. సాక్షులు వివరాలు వేర్వేరుగా చెప్పినా కథ ఒక్కటే. వైరుధ్యం అనిపించినప్పుడు సందర్భం, భాషను చూడాలి.", "refs": "మత్తయి 27:5; అపొ.కా. 1:18", "cat": "general", "new": true}, {"id": 286, "q": "దేవునికి కుమారుడు ఉండడం ఏమిటి? దేవునికి భార్య ఉందా?", "a": "లేదు. \"దేవుని కుమారుడు\" అంటే శారీరక సంబంధం కాదు; తండ్రితో ఉన్న నిత్య స్వభావ సంబంధం (యోహాను 1:14, 18). మరియ పరిశుద్ధాత్మ శక్తి ద్వారా గర్భవతి అయింది (లూకా 1:35). దేవుడు ఆత్మ (యోహాను 4:24).", "refs": "యోహాను 1:14, 18; లూకా 1:35; యోహాను 4:24", "cat": "jesus", "new": true}, {"id": 287, "q": "హిందూ అవతారాలకు, యేసుక్రీస్తు రాకకు తేడా ఏమిటి?", "a": "అవతారాలు అనేకం; యేసు రాక ఒక్కసారే, చరిత్రలో నిర్ణీత కాలంలో, నిర్ణీత స్థలంలో (గలతీ 4:4; హెబ్రీ 9:26–28). ఆయన వచ్చింది పాపం కోసం మరణించడానికి (మార్కు 10:45). ఆయన మరణ పునరుత్థానాలు సాక్షులతో నమోదయ్యాయి (1 కొరింథీ 15:3–8).", "refs": "గలతీ 4:4; హెబ్రీ 9:26-28; మార్కు 10:45", "cat": "jesus", "new": true}, {"id": 288, "q": "అన్ని మతాలు ఒకే దేవుని వైపు వెళ్ళే మార్గాలు కాదా?", "a": "యేసు \"నేనే మార్గమును సత్యమును జీవమును; నా ద్వారానే తప్ప ఎవడును తండ్రి యొద్దకు రాడు\" అన్నాడు (యోహాను 14:6). అపొ.కా. 4:12 — మరి ఎవని వలనను రక్షణ లేదు. దేవునికి మనుష్యులకు మధ్య ఒక్కడే మధ్యవర్తి (1 తిమోతి 2:5). ఇది ఇతరులను చిన్నచూపు చూడడం కాదు, క్రీస్తు చెప్పిన మాట.", "refs": "యోహాను 14:6; అపొ.కా. 4:12; 1 తిమోతి 2:5", "cat": "general", "new": true}, {"id": 289, "q": "పునర్జన్మ, కర్మ సిద్ధాంతం గురించి బైబిల్ ఏమంటుంది?", "a": "మనిషి ఒక్కసారే చనిపోతాడు, తరువాత తీర్పు (హెబ్రీ 9:27). పాపానికి ఫలితం కర్మతో తీర్చుకోవడం కాదు, క్రీస్తు ద్వారా కృప వలన క్షమాపణ (ఎఫెసీ 2:8–9; రోమా 6:23). శిలువపై దొంగకు ఆ రోజే \"నాతో కూడ పరదైసులో ఉందువు\" అని వాగ్దానం చేశాడు (లూకా 23:43).", "refs": "హెబ్రీ 9:27; ఎఫెసీ 2:8-9; లూకా 23:43", "cat": "general", "new": true}, {"id": 290, "q": "దేవుణ్ణి ఎవరు సృష్టించారు?", "a": "దేవుడు సృష్టింపబడినవాడు కాదు; ఆద్యంతాలు లేనివాడు. పర్వతాలు పుట్టకముందే నిత్యము ఆయన దేవుడు (కీర్తన 90:2). ఆయన నిత్యుడైన దేవుడు, భూమి అంచుల సృష్టికర్త (యెషయా 40:28). కారణం అవసరమైనది ప్రారంభం ఉన్న వాటికే.", "refs": "కీర్తన 90:2; యెషయా 40:28", "cat": "god", "new": true}, {"id": 291, "q": "శాస్త్రవిజ్ఞానం, ఆదికాండము 1 — ఏది సరైనది?", "a": "బైబిల్ శాస్త్ర గ్రంథం కాదు; \"ఎవరు, ఎందుకు\" అని చెబుతుంది (ఆది 1:1). \"దినము\" (హీబ్రూలో యోమ్) అనే పదానికి వేర్వేరు అర్థాలు ఉండడం వలన విశ్వాసులలో వేర్వేరు అభిప్రాయాలు ఉన్నాయి. సృష్టి దేవుని మహిమను చాటుతుంది (కీర్తన 19:1; రోమా 1:20).", "refs": "ఆది 1:1; కీర్తన 19:1; రోమా 1:20", "cat": "general", "new": true}, {"id": 292, "q": "అద్భుతాలు అసాధ్యం కాదా?", "a": "దేవుడు ఉన్నాడని ఒప్పుకుంటే అద్భుతాలు అసాధ్యం కావు; ప్రకృతి నియమాలు పెట్టినవాడే ఆయన. యేసు అద్భుతాలు ప్రత్యక్ష సాక్షుల ముందు జరిగాయి (అపొ.కా. 2:22); అవి ఆయన ఎవరో నమ్మడానికి సూచనలు (యోహాను 20:30–31).", "refs": "అపొ.కా. 2:22; యోహాను 20:30-31", "cat": "general", "new": true}, {"id": 293, "q": "నోవహు కాలంలో జలప్రళయం నిజంగా జరిగిందా?", "a": "యేసు, అపొస్తలులు దానిని చారిత్రిక సంఘటనగా ప్రస్తావించారు (మత్తయి 24:37–39; 2 పేతురు 3:5–7). వివరాలు ఆది 6–9 లో ఉన్నాయి. అనేక ప్రాచీన సంస్కృతులలో జలప్రళయ కథలు ఉండడం గమనార్హం. అది ఎంత ప్రాంతాన్ని కప్పింది అనే విషయంలో విశ్వాసులలో భేదాలు ఉన్నాయి.", "refs": "మత్తయి 24:37-39; 2 పేతురు 3:5-7", "cat": "general", "new": true}, {"id": 294, "q": "ప్రార్థనకు జవాబు రాకపోతే దేవుడు లేనట్లేనా?", "a": "జవాబు అవును, ఆగు, లేదు — మూడు రకాలుగా ఉండవచ్చు. దేవుని చిత్తానుసారం అడిగితే ఆలకిస్తాడు (1 యోహాను 5:14); చెడు ఉద్దేశంతో అడిగితే పొందరు (యాకోబు 4:3). ముల్లు తీయమని పౌలు మూడుసార్లు వేడుకొంటే \"నా కృప నీకు చాలును\" అన్నాడు (2 కొరింథీ 12:7–9).", "refs": "1 యోహాను 5:14; యాకోబు 4:3; 2 కొరింథీ 12:7-9", "cat": "general", "new": true}, {"id": 295, "q": "మంచివారు ఏ మతం వారైనా పరలోకం వెళ్ళరా?", "a": "మంచితనం మనల్ని రక్షించదు; \"నీతిమంతుడు లేడు, ఒక్కడును లేడు\" (రోమా 3:10, 23). రక్షణ కృపవలన, క్రీస్తులో విశ్వాసం ద్వారా (ఎఫెసీ 2:8–9). నిజంగా దేవుని వెదికే కొర్నేలి వంటి వారికి దేవుడు సువార్త చేరేలా చేశాడు (అపొ.కా. 10:1–5, 34–35).", "refs": "రోమా 3:10; ఎఫెసీ 2:8-9; అపొ.కా. 10:34-35", "cat": "general", "new": true}, {"id": 296, "q": "సువార్త ఎన్నడూ వినని వారికి ఏమి జరుగుతుంది?", "a": "లోకమంతటికీ న్యాయాధిపతి న్యాయమే చేస్తాడు (ఆది 18:25). సృష్టి, మనస్సాక్షి ద్వారా దేవుడు అందరికీ కొంత తెలియజేశాడు (రోమా 1:19–20; 2:14–16). అందుకే సువార్తను అందరికీ చేరవేయాలని ఆజ్ఞ (మత్తయి 28:19). తుది తీర్పు దేవునిదే; ఆయన పక్షపాతం లేనివాడు (రోమా 2:11).", "refs": "ఆది 18:25; రోమా 1:19-20; రోమా 2:11", "cat": "god", "new": true}, {"id": 297, "q": "క్రైస్తవులలో ఇన్ని సంఘాలు, విభేదాలు ఎందుకు?", "a": "మూల సిద్ధాంతాలలో ఏకత్వం ఉంది: ఒకే ప్రభువు, ఒకే విశ్వాసం, ఒకే బాప్తిస్మం (ఎఫెసీ 4:4–6). ద్వితీయ విషయాలలో భేదాలు ఉన్నాయి; వాటిలో ఒకరినొకరు అంగీకరించాలి (రోమా 14:1). విభేదాలను బైబిల్ ప్రోత్సహించదు (1 కొరింథీ 1:10).", "refs": "ఎఫెసీ 4:4-6; రోమా 14:1; 1 కొరింథీ 1:10", "cat": "other", "new": true}, {"id": 298, "q": "క్రైస్తవ చరిత్రలో జరిగిన క్రూసేడ్లు, హింసల సంగతి ఏమిటి?", "a": "అవి క్రీస్తు బోధకు విరుద్ధం. ఖడ్గం పట్టినవాడు ఖడ్గంతో నశిస్తాడు (మత్తయి 26:52); \"నా రాజ్యము ఈ లోక సంబంధమైనది కాదు\" (యోహాను 18:36). మన ఆయుధాలు శరీర సంబంధమైనవి కావు (2 కొరింథీ 10:4). పేరు కాదు, ఫలం చూసి గుర్తించాలి (మత్తయి 7:16–20).", "refs": "మత్తయి 26:52; యోహాను 18:36; 2 కొరింథీ 10:4", "cat": "ethics", "new": true}, {"id": 299, "q": "క్రైస్తవ మతమార్పిడులు డబ్బు ఆశతోనే జరుగుతున్నాయా?", "a": "డబ్బుతో ఆత్మీయ వరాన్ని కొనాలనుకోవడాన్ని అపొస్తలులు తీవ్రంగా ఖండించారు (అపొ.కా. 8:18–23). సువార్త బలవంతం లేకుండా, సత్యాన్ని స్పష్టంగా చెప్పడం ద్వారా జరగాలి (2 కొరింథీ 4:2). యేసు కూడా వెళ్లిపోవడానికి శిష్యులకు స్వేచ్ఛ ఇచ్చాడు (యోహాను 6:66–67).", "refs": "అపొ.కా. 8:18-23; 2 కొరింథీ 4:2; యోహాను 6:66-67", "cat": "ethics", "new": true}, {"id": 300, "q": "కులం గురించి బైబిల్ ఏమి చెబుతుంది?", "a": "క్రీస్తులో యూదుడు, గ్రీకువాడు, దాసుడు, స్వతంత్రుడు అనే భేదం లేదు (గలతీ 3:28; కొలస్సి 3:11). దేవుడు పక్షపాతం లేనివాడు (అపొ.కా. 10:34). సంఘంలో ధనవంతుడు, పేదవాడు అనే తేడా చూపడం పాపం (యాకోబు 2:1–4).", "refs": "గలతీ 3:28; అపొ.కా. 10:34; యాకోబు 2:1-4", "cat": "ethics", "new": true}, {"id": 301, "q": "జ్యోతిష్యం, జాతకాల గురించి బైబిల్ ఏమంటుంది?", "a": "శకునాలు, జ్యోతిష్యం, మంత్రతంత్రాలను దేవుడు నిషేధించాడు (ద్వితీయోపదేశకాండం 18:10–12; యెషయా 47:13–14). విశ్వాసి భవిష్యత్తు దేవుని చేతిలో ఉంది — \"నా కాలములు నీ చేతిలో ఉన్నవి\" (కీర్తన 31:15). మన నమ్మకం గ్రహాలలో కాదు, సృష్టికర్తలో.", "refs": "ద్వితీయోపదేశకాండం 18:10-12; యెషయా 47:13-14; కీర్తన 31:15", "cat": "ethics", "new": true}, {"id": 302, "q": "బైబిల్ లో బహుభార్యత్వం ఉందే — దేవుడు దానిని అనుమతించాడా?", "a": "వివరించడం అంటే ఆమోదించడం కాదు. ఆరంభం నుండి దేవుని ఏర్పాటు ఒక పురుషుడు, ఒక స్త్రీ (ఆది 2:24; మత్తయి 19:4–8). బహుభార్యత్వం ఉన్న అబ్రాహాము, దావీదు, సొలొమోను ఇండ్లలో కలహాలు, బాధలే వచ్చాయి. రాజు అనేకమంది భార్యలను చేసుకోకూడదని ఆజ్ఞ ఉంది (ద్వితీయోపదేశకాండం 17:17).", "refs": "ఆది 2:24; మత్తయి 19:4-8; ద్వితీయోపదేశకాండం 17:17", "cat": "ethics", "new": true}, {"id": 303, "q": "\"మన స్వరూపమందు\" అని ఆదికాండములో బహువచనం ఎందుకు ఉంది?", "a": "ఆది 1:26 లో దేవుడు \"మన స్వరూపమందు, మన పోలికగా\" అంటాడు. ఒకే దేవునిలో ఉన్న ఐక్యత, వ్యక్తులకు ఇది సూచన అని క్రైస్తవులు చూస్తారు. దేవుడు ఒక్కడే (ద్వితీయోపదేశకాండం 6:4); సృష్టిలో వాక్యం, ఆత్మ పాల్గొన్నారు (ఆది 1:2; యోహాను 1:1–3). ఇది త్రిత్వాన్ని పూర్తిగా వివరించదు, కానీ దానికి సరిపోతుంది.", "refs": "ఆది 1:26; ఆది 1:2; యోహాను 1:1-3", "cat": "trinity", "new": true}, {"id": 304, "q": "దేవుడు సర్వశక్తిమంతుడైతే తాను ఎత్తలేని రాయిని సృష్టించగలడా?", "a": "ఇది అర్థంలేని ప్రశ్న — చతురస్రాకార వృత్తం అడిగినట్లే. సర్వశక్తి అంటే తన స్వభావానికి విరుద్ధమైనది చేయడం కాదు. దేవుడు అబద్ధమాడలేడు (తీతు 1:2), తనను తాను ఎరుగననలేడు (2 తిమోతి 2:13). అసాధ్యమైనది ఆయనకు ఏదీ లేదు (యిర్మీయా 32:17).", "refs": "తీతు 1:2; 2 తిమోతి 2:13; యిర్మీయా 32:17", "cat": "god", "new": true}, {"id": 305, "q": "యేసుక్రీస్తు కేవలం ఒక ప్రవక్తనా?", "a": "ప్రజలు ఆయనను ప్రవక్త అన్నారు (మత్తయి 21:11), కానీ ఆయన ప్రవక్త కంటే గొప్పవాడు. దేవుడు ఇంతకుముందు ప్రవక్తల ద్వారా మాట్లాడాడు, ఈ అంత్యదినాల్లో కుమారుని ద్వారా మాట్లాడాడు; ఆయన దేవుని మహిమ ప్రకాశం, తత్త్వముయొక్క ముద్ర (హెబ్రీ 1:1–3). యోనా కంటే, సొలొమోను కంటే గొప్పవాడు (మత్తయి 12:41–42).", "refs": "మత్తయి 21:11; హెబ్రీ 1:1-3; మత్తయి 12:41-42", "cat": "jesus", "new": true}, {"id": 306, "q": "యేసు ప్రధాన దూత మిఖాయేలా?", "a": "కాదు. కుమారుడు దేవదూతల కంటే ఎంతో ఉన్నతుడు; \"దేవుని దూతలందరు ఆయనను ఆరాధింపవలెను\" (హెబ్రీ 1:4–6). దేవదూతలలో ఎవనితోనైనా \"నీవు నా కుమారుడవు, ఈ దినమున నిన్ను కనియున్నాను\" అని దేవుడు ఎప్పుడూ అనలేదు (హెబ్రీ 1:5, 13).", "refs": "హెబ్రీ 1:4-6; హెబ్రీ 1:13", "cat": "jesus", "new": true}, {"id": 307, "q": "యేసు చనిపోయి మూడు రోజులు సమాధిలో ఉన్నాడా? శుక్రవారం నుండి ఆదివారం వరకు మూడు రోజులు కాదు కదా?", "a": "యూదుల లెక్కలో దినంలో కొంత భాగం కూడా ఒక దినంగా పరిగణిస్తారు (1 సమూయేలు 30:12–13; ఎస్తేరు 4:16 – 5:1). \"మూడు దినములు రాత్రింబగళ్లు\" అనే మాట ఆ లెక్క ప్రకారం చెప్పినది (మత్తయి 12:40). సువార్తలు ఆదివారం ఉదయం సమాధి ఖాళీగా ఉందని ఏకంగా చెబుతాయి (లూకా 24:1–3).", "refs": "మత్తయి 12:40; 1 సమూయేలు 30:12-13; లూకా 24:1-3", "cat": "jesus", "new": true}, {"id": 308, "q": "యేసు ఆలయంలో కొరడా పట్టుకుని వ్యాపారులను తరిమాడు — ఇది హింసా?", "a": "అది దేవుని మందిరం పట్ల నీతియుక్తమైన ఆగ్రహం, ప్రజలపై దాడి కాదు. ఆయన వ్యాపారాన్ని, జంతువులను బయటకు తోలాడు, ధర్మం కోసం మాట్లాడాడు (యోహాను 2:13–17). \"నా తండ్రి మందిరమును వ్యాపార స్థలముగా చేయకుడి\" అన్నాడు. ఎవరినీ గాయపరిచినట్లు నమోదు లేదు; తనను పట్టుకోవడానికి వచ్చినప్పుడు కత్తిని వద్దన్నాడు (మత్తయి 26:52).", "refs": "యోహాను 2:13-17; మత్తయి 26:52", "cat": "jesus", "new": true}, {"id": 309, "q": "\"భూమిమీద సమాధానము కలుగజేయ వచ్చితినని తలంచకుడి; ఖడ్గమునే వేయ వచ్చితిని\" అని యేసు ఎందుకు అన్నాడు?", "a": "ఇది ఆయన లక్ష్యం కాదు, ఫలితం గురించి. ఆయనను అనుసరించేవారికి కుటుంబంలోనే వ్యతిరేకత వస్తుందని హెచ్చరించాడు (మత్తయి 10:34–36). ఖడ్గం అంటే విభజన. ఆయన శిష్యులకు ఖడ్గం వాడవద్దన్నాడు (మత్తయి 26:52); ఆయన \"సమాధాన కర్త\" (యెషయా 9:6; యోహాను 14:27).", "refs": "మత్తయి 10:34-36; యెషయా 9:6; యోహాను 14:27", "cat": "jesus", "new": true}, {"id": 310, "q": "శిష్యుడు కావాలంటే తల్లిదండ్రులను ద్వేషించాలా? (లూకా 14:26)", "a": "కాదు. ఇక్కడ \"ద్వేషించు\" అనే మాట పోల్చే పదం — క్రీస్తును అందరికంటే ఎక్కువగా ప్రేమించాలని. యాకోబు లేయాను \"ద్వేషించాడు\" అంటే రాహేలును ఎక్కువగా ప్రేమించాడని అర్థం (ఆది 29:30–31). మత్తయి 10:37 లో ఇదే మాటను \"నాకంటె ఎక్కువగా ప్రేమించువాడు నాకు పాత్రుడు కాడు\" అని చెప్పాడు. తల్లిదండ్రులను ఘనపరచమని ఆయనే ఆజ్ఞాపించాడు (మార్కు 7:10).", "refs": "లూకా 14:26; ఆది 29:30-31; మత్తయి 10:37; మార్కు 7:10", "cat": "jesus", "new": true}, {"id": 311, "q": "\"ఈ తరము గతింపక మునుపే ఇవన్నీ జరుగును\" అని యేసు అన్నాడు కదా — అయితే రెండవ రాకడ ఎందుకు ఆలస్యం?", "a": "\"ఈ తరము\" అనే మాటకు ఆ సూచనలను చూసే తరం లేదా ఆ జాతి అని వివిధ అర్థాలు ఉన్నాయి (మత్తయి 24:34). ఆయన రాకడ దినం, గడియ ఎవరికీ తెలియదు (మత్తయి 24:36). ప్రభువు నిదానించువాడు కాడు; ఎవడును నశింపకూడదని దీర్ఘశాంతము చూపుతున్నాడు (2 పేతురు 3:8–9).", "refs": "మత్తయి 24:34-36; 2 పేతురు 3:8-9", "cat": "prophecy", "new": true}, {"id": 312, "q": "ఏలీయా వస్తాడన్న ప్రవచనం బాప్తిస్మమిచ్చు యోహాను ద్వారా ఎలా నెరవేరింది? అది పునర్జన్మనా?", "a": "పునర్జన్మ కాదు. ఏలీయా ఆత్మ, శక్తితో వచ్చేవాడని ముందే చెప్పబడింది (లూకా 1:17). యేసు \"యోహానే రాబోవు ఏలీయా\" అన్నాడు (మత్తయి 11:13–14) — అంటే ఆ పాత్రలో. యోహాను స్వయంగా \"నేను ఆయనను కాను\" అన్నాడు (యోహాను 1:21), కాబట్టి అదే వ్యక్తి తిరిగి పుట్టడం అనే అర్థం కాదు. మలాకీ 4:5–6 ప్రవచనం ఇలా నెరవేరింది.", "refs": "లూకా 1:17; మత్తయి 11:13-14; యోహాను 1:21; మలాకీ 4:5-6", "cat": "prophecy", "new": true}, {"id": 313, "q": "సిలువ ఎందుకు? దేవుడు మాటతోనే పాపాన్ని క్షమించలేడా?", "a": "దేవుడు ప్రేమామయుడు, న్యాయమైనవాడు కూడా. పాపాన్ని వదిలేస్తే ఆయన న్యాయం దెబ్బతింటుంది. రక్తము చిందింపకుండా పాపక్షమాపణ లేదు (హెబ్రీ 9:22). క్రీస్తును ప్రాయశ్చిత్తంగా నిలబెట్టి దేవుడు తన నీతిని కాపాడుకుంటూ నమ్మినవారిని నీతిమంతులుగా తీర్చాడు (రోమా 3:25–26).", "refs": "హెబ్రీ 9:22; రోమా 3:25-26", "cat": "sacrifice", "new": true}, {"id": 314, "q": "బాప్తిస్మం లేకుండా రక్షణ లేదా?", "a": "రక్షణ కృపవలన విశ్వాసం ద్వారా; క్రియ వలన కాదు (ఎఫెసీ 2:8–9). బాప్తిస్మం లేకపోయినా శిలువపై దొంగకు ఆ రోజే పరదైసు వాగ్దానం లభించింది (లూకా 23:43). అయినా నమ్మినవారు బాప్తిస్మం పొందాలని యేసు ఆజ్ఞాపించాడు (మత్తయి 28:19; మార్కు 16:16) — అది విధేయత, నమ్మకానికి బహిరంగ ప్రకటన.", "refs": "ఎఫెసీ 2:8-9; లూకా 23:43; మత్తయి 28:19; మార్కు 16:16", "cat": "other", "new": true}, {"id": 315, "q": "\"క్రైస్తవుడు\" అనే పేరు ఎప్పుడు, ఎక్కడ మొదలైంది?", "a": "అంతియొకయలో శిష్యులు మొదటిగా క్రైస్తవులని పిలువబడ్డారు (అపొ.కా. 11:26). అంతకుముందు వారిని \"ఈ మార్గము\" అనేవారు (అపొ.కా. 9:2; 24:14). అంటే క్రీస్తు అనుచరులు అని అర్థం.", "refs": "అపొ.కా. 11:26; అపొ.కా. 9:2; అపొ.కా. 24:14", "cat": "general", "new": true}, {"id": 316, "q": "మనిషి కోతి నుండి వచ్చాడా? బైబిల్ ఏమి చెబుతుంది?", "a": "బైబిల్ ప్రకారం మనిషి దేవుని స్వరూపంలో ప్రత్యేకంగా సృష్టింపబడ్డాడు (ఆది 1:26–27); దేవుడు నేల మంటితో ఆదామును చేసి జీవవాయువు ఊదాడు (ఆది 2:7). సృష్టి జరిగిన పద్ధతి, కాలం గురించి విశ్వాసులలో వేర్వేరు అభిప్రాయాలు ఉన్నాయి; కానీ మనిషికి గౌరవం, విలువ సృష్టికర్త నుండి వచ్చినవని బైబిల్ స్పష్టం (కీర్తన 8:3–6).", "refs": "ఆది 1:26-27; ఆది 2:7; కీర్తన 8:3-6", "cat": "general", "new": true}, {"id": 317, "q": "కనపడని దేవుణ్ణి ఎలా నమ్మాలి?", "a": "మనం గాలిని, ఆకర్షణ శక్తిని చూడం, కాని వాటి ప్రభావాన్ని చూస్తాం; దేవునికీ అదే. సృష్టి ఆయన శక్తిని, దైవత్వాన్ని తెలియజేస్తుంది (రోమా 1:20). విశ్వాసం గ్రుడ్డిది కాదు; అది చూడనివాటి గురించిన నిశ్చయత (హెబ్రీ 11:1, 3). దేవుణ్ణి ఎవడును ఎప్పుడును చూడలేదు; కుమారుడు ఆయనను తెలియజేశాడు (యోహాను 1:18).", "refs": "రోమా 1:20; హెబ్రీ 11:1; యోహాను 1:18", "cat": "god", "new": true}, {"id": 318, "q": "దేవుడు లేకుండా నైతికత సాధ్యమా?", "a": "నాస్తికులు కూడా మంచివారు కావచ్చు; ఎందుకంటే అందరి హృదయంలో దేవుడు నైతిక మనస్సాక్షి ఉంచాడు (రోమా 2:14–15). అయితే \"ఏది మంచి\" అని చెప్పడానికి ఒక ప్రమాణం కావాలి. బైబిల్ ప్రకారం ఆ ప్రమాణం దేవుని స్వభావం. మనమందరం ఆ ప్రమాణానికి తక్కువవాళ్లమే (రోమా 3:23).", "refs": "రోమా 2:14-15; రోమా 3:23", "cat": "ethics", "new": true}, {"id": 319, "q": "క్రైస్తవులు పంది మాంసం ఎందుకు తింటారు? పాత నిబంధనలో నిషేధం ఉంది కదా?", "a": "ఆ నియమాలు ఇశ్రాయేలుకు ఇవ్వబడిన ధర్మశాస్త్రంలో భాగం (లేవీయకాండము 11). యేసు \"సమస్త ఆహారములను పవిత్రముగా\" ప్రకటించాడు (మార్కు 7:18–19). పేతురుకు దర్శనంలో దేవుడు \"దేవుడు పవిత్రపరచినవాటిని నీవు నిషిద్ధమనకు\" అన్నాడు (అపొ.కా. 10:9–15). ఆహారం గురించి ఒకరినొకరు తీర్పు తీర్చకూడదు (కొలస్సి 2:16; 1 తిమోతి 4:3–5).", "refs": "మార్కు 7:18-19; అపొ.కా. 10:9-15; కొలస్సి 2:16; 1 తిమోతి 4:3-5", "cat": "law", "new": true}, {"id": 320, "q": "మరియను దేవుని తల్లి అనవచ్చా? ఆమెను ఆరాధించవచ్చా?", "a": "మరియ ధన్యురాలు; ఆమెను \"ప్రభువు యొక్క తల్లి\" అని ఎలీసబెతు పిలిచింది (లూకా 1:42–43, 48). కానీ ఆరాధన దేవునికే (మత్తయి 4:10; ప్రకటన 22:8–9). దేవునికి మనుష్యులకు మధ్య ఒక్కడే మధ్యవర్తి — క్రీస్తుయేసు (1 తిమోతి 2:5). మరియ \"ఆయన చెప్పినట్లు చేయండి\" అని మాత్రమే అంది (యోహాను 2:5).", "refs": "లూకా 1:42-43; మత్తయి 4:10; 1 తిమోతి 2:5; యోహాను 2:5", "cat": "other", "new": true}, {"id": 321, "q": "చనిపోయినవారి ఆత్మలతో మాట్లాడవచ్చా? చనిపోయినవారి కోసం ప్రార్థన చేయవచ్చా?", "a": "చనిపోయినవారితో సంప్రదించడం బైబిల్ లో నిషేధింపబడింది (ద్వితీయోపదేశకాండం 18:11; యెషయా 8:19). మనుష్యులు ఒక్కసారే చనిపోతారు, తరువాత తీర్పు (హెబ్రీ 9:27); చనిపోయిన తరువాత ఇద్దరి మధ్య గొప్ప అగాధం ఉంది (లూకా 16:26). కాబట్టి జీవించి ఉండగానే క్రీస్తును నమ్మడం ముఖ్యం.", "refs": "ద్వితీయోపదేశకాండం 18:11; హెబ్రీ 9:27; లూకా 16:26", "cat": "demons", "new": true}, {"id": 322, "q": "పేతురు, యాకోబు, పౌలు మధ్య అభిప్రాయభేదాలు ఉండేవా?", "a": "మొదట సున్నతి విషయంలో ప్రశ్న వచ్చింది. యెరూషలేములో అపొస్తలులు, పెద్దలు కలిసి చర్చించి, అన్యులు కృపవలనే రక్షింపబడతారని ఏకగ్రీవంగా తీర్మానించారు (అపొ.కా. 15:6–11, 19). పౌలు తన సువార్తను పేతురు, యాకోబు, యోహానుల ముందు ఉంచినప్పుడు వారు ఆమోదించి సహవాస హస్తం ఇచ్చారు (గలతీ 2:1–10).", "refs": "అపొ.కా. 15:6-11; గలతీ 2:1-10", "cat": "paul", "new": true}, {"id": 323, "q": "యేసు పుట్టినరోజు డిసెంబర్ 25 అని బైబిల్ లో ఉందా?", "a": "లేదు. బైబిల్ ఖచ్చితమైన తేదీ ఇవ్వదు. గొర్రెల కాపరులు పొలంలో ఉన్నారని మాత్రమే ఉంది (లూకా 2:8). ముఖ్యమైనది తేదీ కాదు; ఆయన మనకోసం జన్మించాడు (లూకా 2:10–11). కొందరు క్రైస్తవులు క్రిస్మస్ ను పాటిస్తారు, కొందరు పాటించరు; దినాలను గూర్చి ఒకరినొకరు తీర్పు తీర్చకూడదు (రోమా 14:5–6).", "refs": "లూకా 2:8; లూకా 2:10-11; రోమా 14:5-6", "cat": "other", "new": true}, {"id": 324, "q": "ఇశ్రాయేలీయులకు యెహోవా గురించి తెలిసి కూడా బయలు దేవతలను ఎందుకు పూజించేవారు?", "a": "చుట్టూ ఉన్న కనానీయుల సంస్కృతి, వ్యవసాయ సమృద్ధి కోసం బయలును పూజించాలనే ఆకర్షణ వారిని లాగింది (న్యాయాధిపతులు 2:11–13). దేవుడు ప్రవక్తలను పంపి హెచ్చరించాడు; ఏలీయా కర్మెలు పర్వతంపై \"యెహోవాయే దేవుడు\" అని రుజువు చేశాడు (1 రాజులు 18:21–39). బైబిల్ ఇశ్రాయేలు పాపాలను దాచకుండా నమోదు చేస్తుంది.", "refs": "న్యాయాధిపతులు 2:11-13; 1 రాజులు 18:21-39", "cat": "other", "new": true}, {"id": 325, "q": "అమాలేకీయులతో ఇశ్రాయేలీయులు యుద్ధం చేసింది రాజ్యం సాధించడానికేనా?", "a": "కాదు. అమాలేకీయులే ఇశ్రాయేలు అలసి ఉన్నప్పుడు వెనుక నుండి బలహీనులపై దాడి చేశారు (ద్వితీయోపదేశకాండం 25:17–18; నిర్గమ 17:8). అది రక్షణ కోసం జరిగిన యుద్ధం. విజయం ఇశ్రాయేలు బలం వలన కాదు, దేవుని సహాయం వలన కలిగింది (నిర్గమ 17:11–13).", "refs": "నిర్గమ 17:8-13; ద్వితీయోపదేశకాండం 25:17-18", "cat": "exodus", "new": true}, {"id": 326, "q": "అమాలేకీయులు ఇశ్రాయేలీయులను చంపడానికి వస్తుంటే సర్వశక్తిమంతుడైన యెహోవా వారిని ఎందుకు కాపాడలేదు?", "a": "ఆయన కాపాడాడు. యెహోషువ సేనతో పోరాడగా, మోషే చేతులు పైకెత్తినంతసేపు ఇశ్రాయేలు గెలిచింది; చివరకు యెహోషువ అమాలేకును ఓడించాడు (నిర్గమ 17:9–13). దేవుడు మనుష్యుల ప్రయత్నం, ప్రార్థన ద్వారా తన కార్యాన్ని జరిపిస్తాడు.", "refs": "నిర్గమ 17:9-13", "cat": "exodus", "new": true}, {"id": 327, "q": "తండ్రుల దోషాన్ని పిల్లల మీద వేసి శిక్షించే అన్యాయస్థుడా యెహోవా?", "a": "కాదు. \"తండ్రుల దోషము కొరకు పిల్లలకు మరణశిక్ష విధింపకూడదు; ప్రతివాడు తన పాపానికే మరణ శిక్ష పొందును\" (ద్వితీయోపదేశకాండం 24:16; యెహెజ్కేలు 18:20). నిర్గమ 20:5 లో చెప్పిన \"మూడు నాలుగు తరముల\" ప్రభావం, తండ్రుల పాపపు అలవాట్లను పిల్లలు అనుసరిస్తూ దాని ఫలితం అనుభవించడం గురించి; అయినా వారు మారితే క్షమాపణ ఉంది.", "refs": "ద్వితీయోపదేశకాండం 24:16; యెహెజ్కేలు 18:20; నిర్గమ 20:5", "cat": "attributes", "new": true}, {"id": 328, "q": "అనంత విశ్వాన్ని సృష్టించిన దేవునికి చిన్న భూమిపై ఉన్న మనిషిపై ఇంత ప్రేమ ఎందుకు?", "a": "దావీదు కూడా ఇదే ఆశ్చర్యపడ్డాడు: \"నీ చేతిపనియైన ఆకాశమును చూడగా మనుష్యుడు ఎంతటివాడు?\" (కీర్తన 8:3–4). కానీ దేవుడు మనిషిని తన స్వరూపంలో సృష్టించి మహిమ, ఘనత కిరీటంగా పెట్టాడు (కీర్తన 8:5; ఆది 1:27). ఆయన ప్రేమ మన యోగ్యతను బట్టి కాదు; మనం పాపులుగా ఉండగానే క్రీస్తు మనకోసం మరణించాడు (రోమా 5:8).", "refs": "కీర్తన 8:3-5; రోమా 5:8", "cat": "god", "new": true}, {"id": 329, "q": "ఇశ్రాయేలీయులకు పాపాల శిక్ష ఈ భూమిపైనే పడినప్పుడు, యేసుక్రీస్తు బలి ఎందుకు?", "a": "ఈ లోకంలో కలిగే శిక్షలు పాపం ఎంత గంభీరమో చూపించే హెచ్చరికలు; అవి పాపాన్ని తీసివేయలేవు. ఎద్దుల, మేకల రక్తం పాపాలను తీసివేయడం అసాధ్యం (హెబ్రీ 10:4). పాపక్షమాపణ, నిత్యజీవం కోసం క్రీస్తు ఒక్కసారే అర్పించుకున్నాడు (హెబ్రీ 10:10–14; రోమా 6:23).", "refs": "హెబ్రీ 10:4; హెబ్రీ 10:10-14; రోమా 6:23", "cat": "sacrifice", "new": true}, {"id": 330, "q": "కనానులో చెడ్డవారితో పాటు మంచివారిని కూడా యెహోవా శిక్షించాడా?", "a": "కనానీయుల పాపం పరిపూర్ణం కావడానికి 400 సంవత్సరాల వరకు దేవుడు సమయం ఇచ్చాడు (ఆది 15:16). శిశుబలి వంటి ఘోర ఆచారాలు వారి సమాజంలో ఉండేవి (ద్వితీయోపదేశకాండం 12:31). నమ్మి వచ్చినవారికి రక్షణ లభించింది — రాహాబు, ఆమె కుటుంబం కాపాడబడ్డారు (యెహోషువ 6:25; హెబ్రీ 11:31). అబ్రాహాము అడిగినట్లు \"సర్వలోక న్యాయాధిపతి న్యాయము చేయడా?\" (ఆది 18:25).", "refs": "ఆది 15:16; యెహోషువ 6:25; ఆది 18:25", "cat": "law", "new": true}, {"id": 331, "q": "చెల్లెలి వరుస అయిన శారాను అబ్రాహాము పెళ్లి చేసుకున్నాడు కదా — ఇది ఎలా?", "a": "శారా అబ్రాహాముకు తండ్రివైపు చెల్లెలు (సవతి చెల్లెలు) అని అబ్రాహామే చెప్పాడు (ఆది 20:12). అది ధర్మశాస్త్రం ఇవ్వబడక ముందు కాలం; తరువాత దేవుడు అటువంటి సంబంధాలను స్పష్టంగా నిషేధించాడు (లేవీయకాండము 18:9). బైబిల్ ఒక సంఘటన నమోదు చేసినంత మాత్రాన దానిని ఆమోదించినట్లు కాదు.", "refs": "ఆది 20:12; లేవీయకాండము 18:9", "cat": "law", "new": true}, {"id": 332, "q": "లోతు కూతుళ్లు లోతుతో తప్పు చేయడం — ఇది బైబిల్ ఆమోదమా? లోతు నీతిమంతుడు ఎలా?", "a": "లేదు, బైబిల్ ఈ సంఘటనను ఆమోదంగా కాక నమోదుగా చెబుతుంది. సొదొమ దుష్టత్వం మధ్య పెరిగిన కుటుంబంలోని భయం, ఆలోచనల పాపం ఇది (ఆది 19:30–38). లోతును \"నీతిమంతుడు\" అని పిలవడం అతని పరిపూర్ణతను బట్టి కాదు, దేవునిపై విశ్వాసాన్ని బట్టి (2 పేతురు 2:7–8).", "refs": "ఆది 19:30-38; 2 పేతురు 2:7-8", "cat": "law", "new": true}, {"id": 333, "q": "విదేశీయులకు, స్వదేశీయులకు సమాన హక్కులు, న్యాయవిధులు పెట్టింది యెహోవానేనా?", "a": "అవును. \"మీ మధ్య నివసించు పరదేశి మీ స్వదేశీయుని వలె ఉండవలెను; నిన్నువలె అతనిని ప్రేమింపవలెను\" (లేవీయకాండము 19:34). పరదేశికి, స్వదేశీయునికి ఒకే ధర్మం, ఒకే న్యాయం (సంఖ్యా 15:15–16). పరదేశులను బాధపెట్టకూడదు, ఎందుకంటే ఇశ్రాయేలీయులు కూడా ఐగుప్తులో పరదేశులు (నిర్గమ 22:21).", "refs": "లేవీయకాండము 19:34; సంఖ్యా 15:15-16; నిర్గమ 22:21", "cat": "israel", "new": true}, {"id": 334, "q": "దాసుడికి స్వాతంత్ర్యం ఇవ్వాలని చెప్పలేదా? శాశ్వత దాసత్వం ఇష్టం లేకపోయినా చేయించుకోమన్నాడా?", "a": "దాసుడు ఆరు సంవత్సరాలు సేవ చేసి ఏడవ సంవత్సరం స్వతంత్రుడై వెళ్లాలి (నిర్గమ 21:2; ద్వితీయోపదేశకాండం 15:12–14). యజమానిని, కుటుంబాన్ని ప్రేమించి ఉండాలనుకునే దాసుడు మాత్రమే ఇష్టపూర్వకంగా ఉండిపోతాడు (నిర్గమ 21:5–6). దాసుని కంటి లేదా పన్ను పోయేలా కొట్టినవాడు అతనిని విడిపించాలి (నిర్గమ 21:26–27).", "refs": "నిర్గమ 21:2-6; ద్వితీయోపదేశకాండం 15:12-14; నిర్గమ 21:26-27", "cat": "law", "new": true}, {"id": 335, "q": "బైబిల్ లో దాసులను యెహోవా ఎలా చూసుకోమని చెప్పాడు?", "a": "దాసులను బెదిరించకూడదు; వారికి, మీకు ఒకే యజమాని పరలోకంలో ఉన్నాడు (ఎఫెసీ 6:9). వారికి న్యాయమైనది, సరియైనది చేయాలి (కొలస్సి 4:1). పౌలు ఒనేసిము అనే దాసుని \"దాసునిగా కాక దాసుని కంటె ఎక్కువగా, ప్రియ సహోదరునిగా\" చేర్చుకోమని ఫిలేమోనుకు రాశాడు (ఫిలేమోను 15–16). మనుష్యులను ఎత్తుకుపోయి అమ్మడం మరణశిక్షకు తగినది (నిర్గమ 21:16).", "refs": "ఎఫెసీ 6:9; కొలస్సి 4:1; ఫిలేమోను 15-16; నిర్గమ 21:16", "cat": "law", "new": true}, {"id": 336, "q": "విశ్రాంతి దినం రోజు పుల్లలు ఏరిన వాడిని యెహోవా ఎందుకు చంపమన్నాడు?", "a": "ఇది ఇశ్రాయేలు రాజ్యం దేవుని ప్రత్యక్ష పాలనలో ఉన్న కాలపు ప్రత్యేక శిక్ష. తెలియక చేసిన పాపానికి బలి ఉంది; కానీ \"ఉద్దేశపూర్వకంగా\" దేవుని ఆజ్ఞను తృణీకరించడం తీవ్రంగా పరిగణించబడింది (సంఖ్యా 15:27–31, 32–36). క్రొత్త నిబంధనలో విశ్రాంతిదినం విషయంలో ఇలాంటి శిక్ష లేదు; క్రీస్తు విశ్రాంతికి ప్రభువు (మత్తయి 12:8).", "refs": "సంఖ్యా 15:27-36; మత్తయి 12:8", "cat": "law", "new": true}, {"id": 337, "q": "దావీదు పాపం చేసినా రాజు కాబట్టి యెహోవా అతనికి మరణశిక్ష వేయలేదా? ఏ శిక్షలు వేశాడు?", "a": "దేవుడు రాజును కూడా విడిచిపెట్టలేదు. నాతాను ప్రవక్త ద్వారా దావీదును ఎదుర్కొన్నాడు; దావీదు పశ్చాత్తాపపడగా క్షమించాడు, అయితే పరిణామాలు తప్పలేదు (2 సమూయేలు 12:7–14). కత్తి అతని ఇంటిని విడువలేదు; బిడ్డ చనిపోయాడు; కుటుంబంలో కలహాలు వచ్చాయి. దావీదు పశ్చాత్తాపం కీర్తన 51 లో ఉంది.", "refs": "2 సమూయేలు 12:7-14; కీర్తన 51", "cat": "other", "new": true}, {"id": 338, "q": "అమాయకుడైన బత్షెబ పసిబిడ్డను యెహోవా చంపడం ఏమిటి?", "a": "బిడ్డ పాపం చేయలేదు; దావీదు పాపం ఎంత గంభీరమో, శత్రువులకు దేవుని నామాన్ని దూషించే అవకాశం ఇచ్చినదని నాతాను చెప్పాడు (2 సమూయేలు 12:13–14). బిడ్డ చనిపోయాక దావీదు \"నేను వాని యొద్దకు వెళ్లుదును\" అన్నాడు (2 సమూయేలు 12:23) — బిడ్డ దేవుని దగ్గరకు చేరాడనే నమ్మకం ఇందులో ఉంది. దేవుడు ఇచ్చి తీసుకునేవాడు (యోబు 1:21).", "refs": "2 సమూయేలు 12:13-23; యోబు 1:21", "cat": "other", "new": true}, {"id": 339, "q": "దావీదుకు అనేకమంది కుమారులున్నా బత్షెబ కుమారుడైన సొలొమోనునే దేవుడు రాజుగా ఎందుకు ఎన్నుకున్నాడు?", "a": "దేవుని ఎంపిక కృప వలన; సొలొమోనును ప్రేమించి దేవుడు అతనికి \"యెదీదా\" (యెహోవాకు ప్రియుడు) అని పేరు పెట్టాడు (2 సమూయేలు 12:24–25). ఆలయం కట్టించే శాంతిపురుషుడు ఇతడేనని దావీదుకు ముందే చెప్పబడింది (1 దినవృత్తాంతములు 22:9–10). తప్పు జరిగినా దేవుడు కృపతో కొత్త ఆరంభం ఇచ్చాడని ఇది చూపిస్తుంది.", "refs": "2 సమూయేలు 12:24-25; 1 దినవృత్తాంతములు 22:9-10", "cat": "other", "new": true}, {"id": 340, "q": "యెహోవా మనిషిని చేసినందుకు ఒక చోట సంతోషపడి, మరో చోట బాధపడ్డాడు అంటారు — ఎందుకు?", "a": "దేవుడు తన సృష్టిని సంపూర్ణంగా ఇష్టపడ్డాడు (ఆది 1:31). మనుష్యుల దుష్టత్వం చూసి \"హృదయములో నొచ్చుకొనెను\" (ఆది 6:6) — ఇది మనం అర్థం చేసుకోవడానికి మానవ భాషలో చెప్పిన దుఃఖం, ఆయన ప్రేమకు సూచన. అదే సమయంలో దేవుడు మాటతప్పే మనిషి కాదు, మనసు మార్చుకొనేవాడు కాదు (సంఖ్యా 23:19).", "refs": "ఆది 1:31; ఆది 6:6; సంఖ్యా 23:19", "cat": "god", "new": true}, {"id": 341, "q": "యెహోవా సౌలును రాజుగా చేసినందుకు పశ్చాత్తాపపడ్డాడు అంటే ఆయనకు ముందే తెలియదా?", "a": "\"పశ్చాత్తాపం\" అనే మాట ఇక్కడ దుఃఖం అనే అర్థంలో వాడబడింది (1 సమూయేలు 15:11). అదే అధ్యాయంలో \"ఇశ్రాయేలీయుల మహిమగలవాడు అబద్ధమాడడు, పశ్చాత్తాపపడడు; ఆయన మనుష్యుడు కాడు\" అని కూడా ఉంది (1 సమూయేలు 15:29). అంటే దేవుని నిర్ణయం మారలేదు; సౌలు అవిధేయత వలన కలిగిన దుఃఖమే అది.", "refs": "1 సమూయేలు 15:11; 1 సమూయేలు 15:29", "cat": "god", "new": true}, {"id": 342, "q": "యెహోవా అబ్రాహాముతో తన కుమారుడిని దహనబలిగా ఇమ్మని ఎందుకు అడిగాడు?", "a": "అది అబ్రాహాము విశ్వాసానికి పరీక్ష (ఆది 22:1). దేవుడు మానవ బలిని కోరలేదు, ఆపించాడు; మేకను సిద్ధం చేశాడు (ఆది 22:12–14). \"యెహోవా యీరే\" — యెహోవా చూచుకొనును. అబ్రాహాము దేవుడు మృతులను లేపగలడని నమ్మాడు (హెబ్రీ 11:17–19). ఇది తండ్రి తన ఒక్కగానొక్క కుమారుని మన కోసం ఇచ్చినదానికి సూచన (యోహాను 3:16).", "refs": "ఆది 22:1-14; హెబ్రీ 11:17-19; యోహాను 3:16", "cat": "sacrifice", "new": true}, {"id": 343, "q": "యెఫ్తా తన కుమార్తెను దహనబలిగా యెహోవాకు అర్పించాడా?", "a": "ఇది బైబిల్ లో కష్టమైన భాగం (న్యాయాధిపతులు 11:30–40). యెఫ్తా తొందరపడి మొక్కుబడి చేశాడు; బైబిల్ దీనిని దేవుని ఆజ్ఞగా కాక ఒక మనిషి సంఘటనగా చెబుతుంది. మానవ బలి దేవునికి అసహ్యం (లేవీయకాండము 18:21; యిర్మీయా 7:31). కొందరు ఆమె జీవితాంతం దేవుని సేవకు అంకితం అయిందని, మరికొందరు బలి ఇచ్చారని అర్థం చెబుతారు. ఆ కాలంలో అందరూ తమ ఇష్టప్రకారం చేసేవారు (న్యాయాధిపతులు 21:25).", "refs": "న్యాయాధిపతులు 11:30-40; లేవీయకాండము 18:21; న్యాయాధిపతులు 21:25", "cat": "sacrifice", "new": true}, {"id": 344, "q": "యెహోవా పగతో రివెంజ్ తీసుకుంటాడా?", "a": "దేవుని ప్రతీకారం మనిషి పగ వంటిది కాదు; అది న్యాయం. \"పగ తీర్చుట నా పని; నేనే ప్రతిఫలమిచ్చెదను\" (ద్వితీయోపదేశకాండం 32:35; రోమా 12:19). అందుకే విశ్వాసులు స్వయంగా పగ తీర్చుకోకూడదు; శత్రువును ప్రేమించాలి (రోమా 12:17–21; మత్తయి 5:44). ఆయన ఓర్పు కలవాడు, పశ్చాత్తాపానికి సమయం ఇస్తాడు (2 పేతురు 3:9).", "refs": "ద్వితీయోపదేశకాండం 32:35; రోమా 12:19; మత్తయి 5:44", "cat": "attributes", "new": true}, {"id": 345, "q": "అపోక్రిఫా (రహస్య/రెండో గ్రంథాలు) బైబిల్‌లో ఎందుకు లేవు? వాటిని క్రైస్తవులు దాచి తీసేశారా?", "a": "లేదు. తోబీతు, యూదితు, 1-2 మక్కబీయులు, సొలొమోను జ్ఞానం మొదలైనవి క్రీ.పూ. 3వ శతాబ్దం నుండి క్రీ.శ. 1వ శతాబ్దం మధ్య వ్రాయబడ్డాయి. యూదుల హీబ్రూ కానన్ (ధర్మశాస్త్రం, ప్రవక్తలు, రచనలు)లో వీటికి చోటు ఎప్పుడూ ఇవ్వలేదు. యేసు కాలంలోని యూదులు కూడా వీటిని లేఖనాలుగా ఎంచలేదు. అలాగని అవి నాశనం చేయబడలేదు — నేటికీ మూల భాషల్లో పూర్తిగా అందుబాటులో ఉన్నాయి; కొన్ని చర్చిలు చరిత్ర పఠనంగా చేర్చుకుంటాయి. దాచడం జరగలేదు, గుర్తింపు మాత్రమే ఇవ్వలేదు.", "refs": "లూకా 24:44; రోమా 3:2", "cat": "other", "new": true}, {"id": 346, "q": "క్రీ.శ. 325 నీసియా సభలో యేసుక్రీస్తు దైవత్వాన్ని కల్పించి బైబిల్‌లో చేర్చారా?", "a": "కాదు. నీసియా సభకు ముందే క్రైస్తవులు యేసును దేవుడని ఆరాధించారు. క్రీ.శ. 112లో ప్లినీ (రోమా గవర్నరు) \"క్రీస్తుకు దేవునిగా పాటలు పాడుతారు\" అని చక్రవర్తికి రాశాడు. క్రీ.శ. 110 ప్రాంతంలో ఇగ్నేషియస్ \"మన దేవుడైన యేసుక్రీస్తు\" అని వ్రాశాడు. ఇంకా ముఖ్యంగా — యోహాను 1:1, 20:28; ఫిలిప్పీ 2:6-11; హెబ్రీ 1:8 వంటి వాక్యాలు నీసియాకు రెండు-మూడు శతాబ్దాల ముందే ఉన్న గ్రంథాల్లో ఉన్నాయి. నీసియా సభ కొత్త బోధ చేయలేదు; ఉన్న విశ్వాసాన్ని అరీయస్ అనే ఒక వ్యక్తి బోధకు వ్యతిరేకంగా పదాల్లో రాశారు.", "refs": "యోహాను 1:1; యోహాను 20:28; ఫిలిప్పీ 2:6-11; హెబ్రీ 1:8", "cat": "other", "new": true}, {"id": 347, "q": "కాన్‌స్టంటైను చక్రవర్తి రాజకీయ లాభం కోసం క్రైస్తవ మతాన్ని సృష్టించాడా?", "a": "కాదు. కాన్‌స్టంటైను క్రీ.శ. 313లో మత స్వేచ్ఛ ఇచ్చాడు, కానీ మతాన్ని సృష్టించలేదు. అంతకు ముందే మూడు శతాబ్దాల పాటు క్రైస్తవులు రోమా సామ్రాజ్యంలో హింసించబడుతూ పెరిగారు. దేవాలయాలు, సువార్తలు, అపొస్తలుల లేఖలు అప్పటికే ఉన్నాయి. ఒకవేళ రాజకీయ కల్పన అయితే హింసకు గురై, ప్రాణాలు కోల్పోయి ఎవరు దాన్ని స్వీకరిస్తారు? నిజం — కాన్‌స్టంటైను తర్వాత చర్చిలో లోపాలు, అధికార దుర్వినియోగం జరిగాయి; కానీ అది మూలాన్ని కల్పితం చేయదు.", "refs": "అపొ.కా. 5:38-39; మత్తయి 16:18", "cat": "other", "new": true}, {"id": 348, "q": "\"తండ్రియు వాక్యమును పరిశుద్ధాత్మయు\" అనే 1 యోహాను 5:7 వాక్యం కల్పితం కదా? దానిపైనే త్రిత్వం నిలిచిందా?", "a": "నిజం చెప్పాలంటే — 1 యోహాను 5:7లోని పూర్తి త్రిత్వ వాక్యం పురాతన గ్రీకు ప్రతుల్లో లేదు; తర్వాతి లాటిన్ ప్రతి నుండి చేరింది. దాన్ని నేటి అనువాదాలన్నీ తీసేశాయి (ఇది మోసం కాదు, పారదర్శకత). కానీ త్రిత్వం ఈ ఒక్క వాక్యంపై నిలవదు. మత్తయి 28:19 (\"తండ్రి, కుమారుడు, పరిశుద్ధాత్మ\" పేరున బాప్తిస్మం), 2 కొరింథీ 13:14, యోహాను 1:1 + 14:16-17, అపొ.కా. 5:3-4 (పరిశుద్ధాత్మను దేవుడని పిలవడం) — ఇవన్నీ మూల ప్రతుల్లోనే ఉన్నాయి.", "refs": "మత్తయి 28:19; 2 కొరింథీ 13:14; అపొ.కా. 5:3-4", "cat": "trinity", "new": true}, {"id": 349, "q": "యోహాను 8:1-11 (వ్యభిచారిణి కథ) మూల ప్రతుల్లో లేదు కదా? అది కల్పితమా?", "a": "పురాతన గ్రీకు ప్రతుల్లో కొన్నింటిలో ఆ భాగం లేదు, కొన్నింటిలో ఉంది — పాఠభేదం నిజమే. కానీ దాన్ని ఎవరూ రహస్యంగా చేర్చలేదు: క్రీ.శ. 200 ప్రాంతంలోనే పాపియాస్ దాన్ని ప్రస్తావించాడు; చాలా పురాతన లాటిన్, సిరియాక్ ప్రతుల్లో ఉంది. అంటే ఇది మొదటి శతాబ్దపు సంఘంలో తెలిసిన సంఘటన, కొన్ని ప్రతుల్లో తొలగించబడింది. బైబిల్ అనువాదకులు ఈ భేదాన్ని కుండబడితే కాదు, కనిపించేలా ఉంచుతారు — అదే నిజాయితీకి రుజువు.", "refs": "యోహాను 8:1-11; యోహాను 18:20", "cat": "other", "new": true}, {"id": 350, "q": "బైబిల్ ప్రతుల మధ్య లక్షల పాఠభేదాలు ఉన్నాయని అంటారు కదా — అవి దేవుని వాక్యాన్ని నమ్మదగనిదిగా చేయవా?", "a": "పాఠభేదాలు ఉన్నాయి — సుమారు 5,800 గ్రీకు ప్రతులు, వేలాది భేదాలు. కానీ అవి దాదాపు అన్నీ అక్షర దోషాలు, పునరావృత్తులు, పద క్రమం వంటివి; ఏ బోధా మారదు. సిరియన్, వాటికన్, అలెగ్జాండ్రియన్ ప్రతులను పోల్చినప్పుడు క్రీస్తు దైవత్వం, శిలువ, పునరుత్థానం, రక్షణ వంటి కేంద్ర బోధలు ఒక్క చోటా భేదపడవు. ఏ గ్రంథం మార్చబడితే అది ప్రపంచంలోని అన్ని ఖండాల్లోని ప్రతుల్లో ఒకేలా మారాలి — అది అసాధ్యం. చరిత్రలో ఏ గ్రంథానికీ ఇంత ప్రతుల ఆధారం లేదు.", "refs": "మత్తయి 24:35; యెషయా 40:8; 1 పేతురు 1:25", "cat": "general", "new": true}, {"id": 351, "q": "KJV (కింగ్ జేమ్స్) మాత్రమే నిజమైన బైబిలా? మిగతా అనువాదాలు తప్పా?", "a": "కాదు. KJV కూడా ఒక అనువాదమే — 1611లో ఎరాస్మస్ మొదలైన ప్రతుల ఆధారంగా చేసినది. అప్పటికి ఇంకా కనుగొనబడని పురాతన ప్రతులు (సినాయి, వాటికను మొ.) నేటి అనువాదాలకు ఉపయోగపడుతున్నాయి, అందుకే అవి కొన్ని చోట్ల మరింత కచ్చితమైనవి. KJVలో కూడా తర్వాత మార్పులు జరిగాయి (1611 vs 1769). కేంద్ర విషయం: దేవుని వాక్యం భావం, బోధ; ఒక ప్రచురణ సంస్థ లేదా భాష కాదు. తెలుగులో మంచి అనువాదం చదవడం పాపం కాదు.", "refs": "1 కొరింథీ 14:9; అపొ.కా. 2:6-8", "cat": "other", "new": true}, {"id": 352, "q": "తోమా సువార్త, యూదా సువార్త, మరియ సువార్త లాంటివి బైబిల్ నుండి తీసేశారా?", "a": "అవి ఎప్పుడూ బైబిల్‌లో భాగం కాలేదు. అవి క్రీ.శ. 2-4 శతాబ్దాల్లో గ్నోస్టిక్ బోధకులచే వ్రాయబడ్డాయి — యేసు కాలానికి 100-300 సంవత్సరాల తర్వాత. వాటి బోధ బైబిల్‌కు వ్యతిరేకం: శరీరం చెడు, యేసు నిజంగా శరీరం ధరించలేదు, రహస్య జ్ఞానమే రక్షణ. యోహాను 1:1-14, 1 యోహాను 4:2-3 ఇదే బోధను ఖండిస్తున్నాయి. మొదటి శతాబ్దపు సంఘాలు వాటిని ఎప్పుడూ పరిశుద్ధ లేఖనాలుగా ఉపయోగించలేదు.", "refs": "1 యోహాను 4:2-3; యోహాను 1:14; గలతీ 1:8", "cat": "other", "new": true}, {"id": 353, "q": "హీబ్రూ (మసొరెటిక్) మరియు గ్రీకు (సెప్టువజింట్) పాత నిబంధన ప్రతుల మధ్య భేదాలుంటే ఏది నిజం?", "a": "రెండూ నిజమైన సాక్ష్యాలు. సెప్టువజింట్ (క్రీ.పూ. 3వ శతాబ్దం) పాతది, అపొస్తలులు ఉల్లేఖించినది కూడా అదే. మసొరెటిక్ ప్రతులు (క్రీ.శ. 7-10 శతాబ్దం) హీబ్రూలో కచ్చితమైనవి. భేదాలు ఎక్కువగా సంఖ్యలు, అక్షర క్రమం — బోధను మార్చేవి కావు. అద్భుతం ఏమిటంటే: చనిపోయిన సముద్రపు చావిడి నుండి దొరికిన యెషయా ప్రతి (క్రీ.పూ. 2వ శతాబ్దం) 1000 సంవత్సరాల తర్వాతి మసొరెటిక్ ప్రతితో దాదాపు అక్షరాలా ఒకటే. అంటే ప్రతి చాలా నమ్మకంగా కాపాడబడింది.", "refs": "కీర్తనలు 12:6-7; మత్తయి 5:18", "cat": "general", "new": true}, {"id": 354, "q": "చనిపోయిన సముద్రపు చావిడి గ్రంథాలు బైబిల్‌ను తప్పు అని నిరూపిస్తాయా?", "a": "అలాంటి వాదన ఉన్నా, నిజం దానికి వ్యతిరేకం. చావిడిలో 900+ గ్రంథాలు దొరికాయి — పాత నిబంధన ప్రతులు, అపోక్రిఫా, సంఘ ఆచార గ్రంథాలు. పాత నిబంధన ప్రతులు మనకు ఉన్న హీబ్రూ పాఠాన్ని దాదాపు పూర్తిగా ధృవీకరించాయి. అవి పాత నిబంధనను మార్చలేదు; కొత్త నిబంధనను సమర్థించాయి — అనేక మెస్సీయ ప్రవచనాలు (యెషయా 53, 2 సమూ 7, దానియేలు 7) చావిడి ప్రతుల్లో కూడా యేసుకు ముందే ఉన్నాయి.", "refs": "యెషయా 53:1-12; దానియేలు 7:13-14", "cat": "general", "new": true}, {"id": 355, "q": "బైబిల్‌లో 66 గ్రంథాలే ఎందుకు? ఎవరు నిర్ణయించారు?", "a": "మనుషులు కొత్త సత్యం సృష్టించలేదు; ఉన్నదాన్ని గుర్తించారు. గుర్తింపు ప్రమాణాలు: (1) అపొస్తలుల సంబంధం — ప్రత్యక్ష సాక్షి లేదా వారి సహచరుడు; (2) ప్రాచీనత — మొదటి శతాబ్దం; (3) సత్యబోధ — ఇతర లేఖనాలతో ఏకీభావం; (4) సంఘాల్లో సర్వత్రా ఆమోదం. 2వ-3వ శతాబ్దాల్లోనే మురటోరియన్ ఫ్రాగ్మెంట్, ఒరిజెన్, యూసేబియస్ వీటిని జాబితా చేశారు. 4వ శతాబ్దపు సభలు ఏదీ కొత్తగా సృష్టించలేదు — ఎప్పటినుంచో చదువుతున్న గ్రంథాలను అధికారికంగా ధృవీకరించాయి.", "refs": "2 పేతురు 1:20-21; 2 తిమోతి 3:16; లూకా 1:1-4", "cat": "general", "new": true}, {"id": 356, "q": "\"లూసిఫర్\" అనే పేరు బైబిల్‌లో ఉందా? అది సాతాను పేరా?", "a": "హీబ్రూలో యెషయా 14:12లో ఉన్న పదం \"హేలేల్ బెన్ షాహర్\" — \"తెల్లవారుజాము కుమారుడా, ప్రకాశించేవాడా\" అని అర్థం. లాటిన్ (వుల్గేట్)లో దాన్ని \"లూసిఫర్\" (వెలుగు తెచ్చేవాడు) అని అనువదించారు. ఆ వాక్యం మొదట బబులోను రాజును గురించి; సాతానుకు అన్వయించడం తర్వాతి అన్వయం. అంటే \"లూసిఫర్\" అనేది సాతాను అసలు పేరు కాదు. బైబిల్ సాతానుకు ఇచ్చిన పేర్లు: సాతాను (విరోధి), అపవాది (దోషారోపకుడు), పాత సర్పము, ఈ లోక అధిపతి.", "refs": "యెషయా 14:12-15; ప్రకటన 12:9; యోహాను 12:31", "cat": "demons", "new": true}, {"id": 357, "q": "యేసు పేరు \"యేసు\"యా \"యేశు\"యా \"జీసస్\"యా? ఏ పేరుతో ప్రార్థించాలి?", "a": "మూలం హీబ్రూ \"యేషూఅ\" (యెహోషువ), అరామిక్ \"యేశూ\", గ్రీకు \"ఇయేసూస్\". అన్నీ ఒకే వ్యక్తిని సూచించే భాషా రూపాలు. బైబిల్ ప్రకారం అర్థం ముఖ్యం — \"యెహోవా రక్షిస్తాడు\" (మత్తయి 1:21). పేరు ఉచ్చారణ కంటే ఆయనను ఎవరని నమ్ముతున్నామో అది ముఖ్యం. అపొ.కా. 4:12లో \"వేరే పేరు లేదు\" అన్నది ఉచ్చారణ గురించి కాదు, వ్యక్తి గురించి. తెలుగులో \"యేసు\" అని పిలవడం సరైనదే.", "refs": "మత్తయి 1:21; అపొ.కా. 4:12; ఫిలిప్పీ 2:9-10", "cat": "jesus", "new": true}, {"id": 358, "q": "\"సంఘం\" (చర్చి) అనే పదం బైబిల్‌లో లేదా? అది కల్పితమా?", "a": "గ్రీకు పదం \"ఎక్లేసియా\" — \"పిలిచిన సమాజం\" అని అర్థం. కొత్త నిబంధనలో 114 సార్లు వస్తుంది. \"చర్చి\" అనేది దానికి ఆంగ్ల అనువాదం. అది భవనం కాదు — విశ్వాసుల సమాజం (మత్తయి 18:17; ఎఫెసీ 1:22-23). అలాగే \"బాప్తిస్మం\", \"అపొస్తలుడు\", \"సువార్త\" అనేవి కూడా గ్రీకు పదాల అనువాదాలే.", "refs": "మత్తయి 16:18; ఎఫెసీ 1:22-23; అపొ.కా. 2:47", "cat": "other", "new": true}, {"id": 359, "q": "అన్ని అనువాదాలు ఒకేలా లేకపోతే దేవుని వాక్యాన్ని పాడు చేసినట్లే కదా?", "a": "అనువాదం అంటే భాష మార్పు, సందేశం కాదు. మూల భాషలు హీబ్రూ, అరామిక్, గ్రీకు; ప్రపంచంలో ఏ భాష మాట్లాడేవారికీ అవి తెలియవు. ఒకే భావాన్ని రెండు విధాలుగా అనువదించడం (ఉదా. \"నమ్మకం\" vs \"విశ్వాసం\") లోపం కాదు. ముఖ్యమైన అంశాల్లో — క్రీస్తు దైవత్వం, శిలువ, పునరుత్థానం, పాపక్షమాపణ — అన్ని ముఖ్య అనువాదాలు ఏకీభవిస్తాయి. అనువాద భేదాలను చూపి \"బైబిల్ మారిపోయింది\" అనడం అతిగా చెప్పడం.", "refs": "అపొ.కా. 2:8-11; నెహెమ్యా 8:8", "cat": "general", "new": true}, {"id": 360, "q": "యేసే స్వయంగా పాత నిబంధనను దేవుని వాక్యంగా ధృవీకరించాడా?", "a": "అవును, స్పష్టంగా. మత్తయి 5:17-18 — \"నేను ధర్మశాస్త్రమునైనను ప్రవక్తల లేఖనములనైనను రద్దు చేయుటకు రాలేదు... ఒక అక్షరమైనను గతింపదు.\" యోహాను 10:35 — \"లేఖనములు వ్యర్థపరచబడజాలవు.\" లూకా 24:44 — \"ధర్మశాస్త్రములోను ప్రవక్తల లేఖనములలోను కీర్తనలలోను నా గూర్చి వ్రాయబడినవన్నీ నెరవేరవలెను.\" యేసు పాత నిబంధనను కేవలం మానవ గ్రంథంగా ఎప్పుడూ ఎంచలేదు.", "refs": "మత్తయి 5:17-18; యోహాను 10:35; లూకా 24:44", "cat": "general", "new": true}, {"id": 361, "q": "లూకా 2:1-2లో చెప్పిన గణన (క్విరీనియు) చరిత్రలో లేదు కదా? ఇది తప్పు కాదా?", "a": "ఇది నిజంగా చర్చనీయమైన అంశం — దాన్ని దాచాల్సిన అవసరం లేదు. లూకా \"మొదటి గణన\" అంటున్నాడు, అంటే రెండోది కూడా ఉంది (అది క్రీ.శ. 6లోని ప్రసిద్ధ గణన — అపొ.కా. 5:37). క్విరీనియు ఒకటి కంటే ఎక్కువసార్లు ఆ పదవిలో ఉండి ఉండవచ్చు; ఒక పురాతన శిలాశాసనం అతని మునుపటి అధికారాన్ని సూచిస్తుంది. హేరోదు కాలంలోని గణనలు కూడా తెలిసినవి. ఒక చిన్న వివరం పరిష్కారం కాకపోతే మొత్తం సువార్త అబద్ధం కాదు — లూకా చరిత్ర వివరాల్లో (అధికారుల పేర్లు, స్థలాలు, సామాజిక పద్ధతులు) ఎక్కడా తప్పు నిరూపించబడలేదు.", "refs": "లూకా 2:1-2; అపొ.కా. 5:37", "cat": "jesus", "new": true}, {"id": 362, "q": "హేరోదు క్రీ.పూ. 4లో చనిపోయాడు; క్విరీనియు గణన క్రీ.శ. 6 — మరి యేసు పుట్టుక ఎప్పుడు?", "a": "యేసు పుట్టుక క్రీ.పూ. 6-5 ప్రాంతంలో అని చాలామంది చరిత్రకారులు అంటారు — హేరోదు మరణానికి ముందు (మత్తయి 2:1, 19). \"క్రీ.శ.\" అనే లెక్క 6వ శతాబ్దంలో డయోనిసియస్ చేసిన లెక్కింపు; అందులో కొన్ని సంవత్సరాల తేడా ఉండవచ్చు — బైబిల్ ఆ లెక్కను బోధించదు. దీన్ని \"బైబిల్ తప్పు\" అనడం సరికాదు; అది తర్వాతి కాలపు క్యాలెండర్ లెక్కింపు లోపం. బైబిల్ ఇచ్చిన వివరాలు (హేరోదు, క్విరీనియు, ఆగస్తు) చరిత్రలో ఉన్న వ్యక్తులే.", "refs": "మత్తయి 2:1; మత్తయి 2:19; లూకా 2:1-2", "cat": "jesus", "new": true}, {"id": 363, "q": "యేసు నజరేతువాడా బేత్లెహేమువాడా? సువార్తలు పరస్పరం విరుద్ధం కదా?", "a": "విరుద్ధం కాదు — రెండూ నిజం. యేసు బేత్లెహేములో పుట్టాడు (మత్తయి 2:1; లూకా 2:4-7; మీకా 5:2 ప్రవచనం ప్రకారం), ఆ తర్వాత నజరేతులో పెరిగాడు (మత్తయి 2:23; లూకా 2:39-40; 4:16). \"నజరేయుడు\" అనేది నివాస స్థలం పేరు, పుట్టుక స్థలం కాదు. ఇద్దరు సువార్తికులు వేర్వేరు కోణాలను వివరించడం విరుద్ధం కాదు.", "refs": "మత్తయి 2:1, 23; లూకా 2:4-7; మీకా 5:2", "cat": "jesus", "new": true}, {"id": 364, "q": "యేసు గురించి రోమా లేదా యూదు చరిత్రలో ప్రస్తావన లేదా? బైబిల్ ఒక్కటే ఆధారమా?", "a": "లేదు, బయటి ఆధారాలు ఉన్నాయి. (1) టాసిటస్ (క్రీ.శ. 116) — \"క్రీస్తు అనే వ్యక్తి తిబెరియస్ కాలంలో పిలాతు చేత శిక్షింపబడ్డాడు.\" (2) యోసీఫస్ (క్రీ.శ. 93) — యేసు, ఆయన సోదరుడు యాకోబు గురించి; యాకోబు మరణం గురించి కూడా. (3) ప్లినీ (112) — క్రైస్తవులు క్రీస్తుకు ఆరాధన చేస్తారు. (4) స్వీటోనియస్, లూసియన్, బబులోను తాల్ముద్. (5) పిలాతు శిలాశాసనం (కైసరియా), కైఫా ఎముకల పెట్టె. ఇవి క్రైస్తవ గ్రంథాలు కావు — విరోధుల రచనలు.", "refs": "1 కొరింథీ 15:3-8; లూకా 3:1-2", "cat": "jesus", "new": true}, {"id": 365, "q": "\"నజరేతు పట్టణం ఆ కాలంలో ఉండనే లేదు\" అని విమర్శకులు అంటారు — నిజమా?", "a": "కాదు. నజరేతు ఒక చిన్న, పేద పల్లె — అందుకే పెద్దగా ప్రస్తావన లేదు. కానీ 1962లో కైసరియా దగ్గర దొరికిన శిలాశాసనంలో (క్రీ.శ. 3-4 శతాబ్దం) రోమా యాజకుల పట్టికలో \"నజరేతు\" పేరు ఉంది. 1వ శతాబ్దపు యూదు గ్రామాలు, స్నానపు గుంటలు, సమాధులు అక్కడ కనుగొనబడ్డాయి. అంతేకాదు — నతానయేలు \"నజరేతులో ఏ మంచి పుట్టగలదా?\" అన్న ప్రశ్న (యోహాను 1:46) ఆ పట్టణం అప్పుడు ఉందని, కానీ చిన్నదని సూచిస్తుంది.", "refs": "యోహాను 1:45-46; లూకా 1:26", "cat": "jesus", "new": true}, {"id": 366, "q": "యేసు శిలువ మోసింది ఎవరు? యోహాను \"తానే మోశాడు\" అంటే, లూకా \"సీమోను మోశాడు\" అంటున్నాడు — విరుద్ధమా?", "a": "విరుద్ధం కాదు. యోహాను 19:17 — యేసు తన శిలువను తానే మోసుకుని వెళ్ళాడు. లూకా 23:26; మార్కు 15:21 — దారిలో ఆయన బలహీనపడినప్పుడు సిరేని సీమోనును బలవంతంగా ఆ శిలువ మోయించారు. అంటే మొదట తానే మోశాడు, తర్వాత సీమోను సహాయం చేశాడు. రెండు వృత్తాంతాలు ఒకదానికొకటి పూర్తి చిత్రాన్ని ఇస్తున్నాయి.", "refs": "యోహాను 19:17; లూకా 23:26; మార్కు 15:21", "cat": "jesus", "new": true}, {"id": 367, "q": "సమాధి వద్ద దేవదూత ఒకడా ఇద్దరా? స్త్రీలు ఎంతమంది? విరుద్ధమా?", "a": "మత్తయి 28:2 ఒక దేవదూతను, మార్కు 16:5 ఒక యువకుడిని, లూకా 24:4 ఇద్దరిని, యోహాను 20:12 ఇద్దరిని చెబుతున్నాయి. ఇద్దరు ఉంటే ఒకడిని ప్రధానంగా వివరించడం సాధారణ సంప్రదాయం. స్త్రీల విషయంలో కూడా — మగ్దలేనే మరియ, యాకోబు తల్లి మరియ, సలోమి (మార్కు 16:1); మత్తయి 28:1 ఇద్దరిని పేర్కొంటుంది; యోహాను మగ్దలేనే మరియను ముందుగా చెబుతాడు. ఒకరు మరొకరిని కలిసిన తర్వాత కలిసి వెళ్ళడం, ఒకరు ముందుగా వెళ్ళడం సహజం. కేంద్రం ఒకటే — సమాధి ఖాళీగా ఉంది, యేసు సజీవుడయ్యాడు.", "refs": "మత్తయి 28:1-7; లూకా 24:1-10; యోహాను 20:11-12", "cat": "jesus", "new": true}, {"id": 368, "q": "యేసు ఆలయాన్ని ఒకసారి శుద్ధి చేశాడా రెండుసార్లా? సువార్తలు విరుద్ధమా?", "a": "రెండుసార్లు అని అర్థం చేసుకోవడం సరైనది. యోహాను 2:13-22లో ఆయన పరిచర్య ఆరంభంలో (మొదటి పస్కా) చేశాడు; మత్తయి 21:12-13; మార్కు 11:15-17; లూకా 19:45-46లో పరిచర్య చివరిలో (చివరి పస్కా) చేశాడు. యోహాను మూడు పస్కాలు పేర్కొంటాడు (2:13; 6:4; 11:55) — అంటే పరిచర్య మూడు సంవత్సరాలు. యోహాను సంఘటనలను కాలక్రమంగా కాక బోధ ప్రకారం అమర్చుతాడు; సమాన సువార్తలు కాలక్రమంగా అమర్చుతాయి.", "refs": "యోహాను 2:13-22; మత్తయి 21:12-13", "cat": "jesus", "new": true}, {"id": 369, "q": "యేసు చివరి భోజనం పస్కా రోజునా, ముందు రోజునా? యోహాను మరియు సమాన సువార్తలు భిన్నంగా చెబుతున్నాయా?", "a": "ఇది నిజంగా క్లిష్టమైన అంశం. సమాన సువార్తలు చివరి భోజనాన్ని పస్కా భోజనంగా చెబుతాయి (మత్తయి 26:17-19; లూకా 22:7-15); యోహాను 19:14లో యేసు విచారణ సమయంలో \"పస్కా సిద్ధపాటు\" అని ఉంది. పరిష్కార సూచనలు: (1) ఆ సంవత్సరం రెండు పద్ధతుల్లో పస్కా ఆచరించబడింది (ఫరిసీ, సద్దుకీ క్యాలెండర్ భేదం); (2) యోహాను యేసును \"పస్కా గొర్రెపిల్ల\"గా చూపడానికి ఆ పదాన్ని ఉద్దేశపూర్వకంగా వాడ్డాడు (1 కొరింథీ 5:7). ఏ వివరణ అయినా కేంద్ర సత్యం మారదు — యేసు పస్కా సమయంలో శిలువ వేయబడ్డాడు.", "refs": "మత్తయి 26:17-19; యోహాను 19:14; 1 కొరింథీ 5:7", "cat": "jesus", "new": true}, {"id": 370, "q": "మత్తయి 8:5-13లో శతాధిపతి తానే యేసు దగ్గరకు వచ్చాడు, లూకా 7:1-10లో పెద్దలను పంపాడు — విరుద్ధమా?", "a": "విరుద్ధం కాదు. లూకా \"పెద్దలను పంపాడు\" అని వివరిస్తాడు; మత్తయి సంక్షిప్తంగా \"ఒక శతాధిపతి వచ్చాడు\" అంటాడు — పంపినవారి ద్వారా చేసిన అభ్యర్థనను ఆ వ్యక్తి చేసినట్లే లెక్కిస్తారు. తర్వాత శతాధిపతి తానే కలిసి \"నా ఇంటికి రావద్దు\" అన్నాడు (మత్తయి 8:8; లూకా 7:6-7). ఒకరు వివరాలు, ఒకరు సారాంశం — ఇది విరుద్ధం కాదు, పూరకం.", "refs": "మత్తయి 8:5-13; లూకా 7:1-10", "cat": "jesus", "new": true}, {"id": 371, "q": "మత్తయి 1 మరియు లూకా 3 వంశావళులు ఒకటికొకటి పోలవు — బైబిల్ తప్పు కదా?", "a": "ఇది పరిష్కరించదగిన భేదం. మత్తయి యోసేపు (పెంపుడు తండ్రి) వంశాన్ని అబ్రాహాము నుండి చూపిస్తాడు — యూదా రాజ వంశం (రాజ్య హక్కు). లూకా మరియ వంశాన్ని ఆదాము వరకు చూపిస్తాడు (మరియ తండ్రి హేలి, యోసేపు మామ). మత్తయి రాజ వంశాన్ని మాత్రం చూపడానికి కొందరు తరాలను దాటవేస్తాడు (ఉదా. 1:8లో అహజ్యా, యోవాషు, అమస్యా లేరు). లూకాలో \"కుమారుడు\" అనే పదం అల్లుడు/మనుమడు అర్థంలో కూడా వాడబడుతుంది. రెండూ యేసు దావీదు వంశానికి చెందినవాడని ధృవీకరిస్తాయి.", "refs": "మత్తయి 1:1-17; లూకా 3:23-38", "cat": "jesus", "new": true}, {"id": 372, "q": "మత్తయి 27:9 \"యిర్మీయా ప్రవక్త ద్వారా చెప్పబడినది\" అంటాడు, కానీ ఆ వాక్యం జెకర్యాలో ఉంది — తప్పు కాదా?", "a": "ఆ వాక్యం జెకర్యా 11:12-13 నుండి. మత్తయి యూదు సంప్రదాయంలో ప్రవక్తల గ్రంథాలను మొదటి ప్రవక్త (యిర్మీయా) పేరుతో సూచించేవారు; కొన్ని పురాతన ప్రతుల్లో \"జెకర్యా\" అనే పాఠం కూడా ఉంది. ఇది ఒక చిన్న ఉల్లేఖన శైలి భేదం, కల్పన కాదు. ముఖ్యం — 30 వెండి నాణేలు, కుమ్మరి పొలం అనే వివరాలు జెకర్యాలో అక్షరాలా ఉన్నాయి, అవి యేసు కాలానికి 500 సంవత్సరాల ముందు వ్రాయబడ్డాయి.", "refs": "మత్తయి 27:9-10; జెకర్యా 11:12-13", "cat": "jesus", "new": true}, {"id": 373, "q": "మత్తయి 2:23 \"నజరేయుడు అనబడును\" అని ప్రవచనం చెప్పాడు — అలాంటి వాక్యం పాత నిబంధనలో ఎక్కడా లేదే?", "a": "ఇది ఒక ఉల్లేఖనం కాదు, ఒక భావ సారాంశం. \"నెత్సర్\" (చిగురు) అనే పదం యెషయా 11:1లో మెస్సీయకు వర్తిస్తుంది — \"యెషయి కాండము నుండి ఒక చిగురు (నెత్సర్) పుట్టును.\" అలాగే న్యాయాధిపతులు 13:5లో సంసోను \"నాజీరు\" (ప్రత్యేకించబడినవాడు) అని ఉంది. నజరేతు అనే పేరుతో \"నెత్సర్\" ధ్వని సామ్యం ఉంది. మత్తయి ఈ రెండు భావాలను కలిపి చెబుతున్నాడు — ఇది యూదుల బోధనా శైలి (రెమెజ్), తప్పు కాదు.", "refs": "మత్తయి 2:23; యెషయా 11:1; న్యాయాధిపతులు 13:5", "cat": "jesus", "new": true}, {"id": 374, "q": "1 రాజులు 4:26లో 40,000 గుర్రపు కొట్టాలు, 2 దినవృత్తాంతములు 9:25లో 4,000 — బైబిల్ సంఖ్యలు తప్పా?", "a": "ప్రతి భేదం విరుద్ధం కాదు. ఇక్కడ రెండు వేర్వేరు విషయాలు చెప్పబడుతున్నాయి: 1 రాజులు 4:26లో గుర్రాలకు కొట్టాలు (stalls), 2 దిన 9:25లో రథాలకు సంబంధించిన సంఖ్య — పురాతన ప్రతుల్లో అంకెలు అక్షరాలతో వ్రాయబడేవి (హీబ్రూలో 4,000 మరియు 40,000 మధ్య ఒక అక్షర భేదం). దీన్ని నకిలీ చరిత్ర అనడం కంటే ప్రతి దోషం అనడం సరైనది; బోధ ఏ మారదు.", "refs": "1 రాజులు 4:26; 2 దినవృత్తాంతములు 9:25", "cat": "other", "new": true}, {"id": 375, "q": "సౌలు మరణం మూడు చోట్ల మూడు రకాలుగా ఉంది కదా? (1 సమూ 31, 2 సమూ 1, 2 సమూ 21)", "a": "పరిశీలిస్తే విరుద్ధం లేదు. 1 సమూయేలు 31:4-6 — సౌలు తన కత్తిపై పడి చనిపోయాడు. 2 సమూయేలు 1:6-10 — ఒక అమాలేకీయుడు \"నేను చంపాను\" అని చెబుతాడు; అతను సౌలు బాధను చూసి, తనకు మెప్పు కలిగించాలని అబద్ధం చెప్పాడు (దావీదు అతన్ని అబద్ధికుడని ఎంచి చంపించాడు — 1:16). 2 సమూయేలు 21:12 — గిల్బోవలో సౌలు పడిన సంగతిని గుర్తు చేస్తుంది. అంటే ఒకే సంఘటన, ఒక సాక్షి అబద్ధం.", "refs": "1 సమూయేలు 31:4-6; 2 సమూయేలు 1:6-16; 2 సమూయేలు 21:12", "cat": "other", "new": true}, {"id": 376, "q": "మార్కు 2:26 దావీదు \"అబీయాతారు\" కాలంలో చూపుడు రొట్టె తిన్నాడంటాడు, కానీ 1 సమూయేలు 21లో అది అహీమెలెకు కాలం — తప్పు కాదా?", "a": "రెండూ నిజం. అహీమెలెకు ఆ సమయంలో యాజకుడు; అతని కుమారుడు అబీయాతారు కూడా అప్పుడే యాజకుడిగా సేవ చేస్తున్నాడు (1 సమూ 22:20 నుండి అతను ప్రధాన యాజకుడు). యాజకత్వం ఒక కుటుంబ వ్యవహారం; యేసు ఆ సంఘటనను అబీయాతారు పేరుతో సూచించడం సరైనది, ఎందుకంటే అతను ఆ తర్వాత ప్రసిద్ధుడు. ఇది యూదుల్లో సాధారణ సూచన పద్ధతి.", "refs": "మార్కు 2:25-26; 1 సమూయేలు 21:1-6; 1 సమూయేలు 22:20", "cat": "other", "new": true}, {"id": 377, "q": "యెహోషువ 10:12-14లో \"సూర్యుడు నిలిచెను\" అంటే విజ్ఞాన శాస్త్రం అంగీకరించదు కదా?", "a": "మొదట గమనించాలి — బైబిల్ ఇక్కడ మనుషులు చూసిన విధంగానే (భూమి కదలనట్లు కనిపించే భాషలో) వర్ణిస్తుంది — \"సూర్యుడు నిలిచెను\" అనేది దృశ్య భాష. రెండవది, అది దేవుని అద్భుతం అని వాక్యం స్పష్టంగా చెబుతుంది (10:14). అద్భుతాన్ని సహజ శాస్త్ర నియమంతో కొలవడం అర్థరహితం — అది నియమాన్ని మీరిన సంఘటన అని బైబిల్ చెబుతోంది. భూమి ఆగిపోవడం (భ్రమణం నిలిచిపోవడం) ద్వారా కూడా ఇది సాధ్యమే.", "refs":
