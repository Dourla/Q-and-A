ి చెబుతుంది; (2) \"మెస్సీయ\" అనే పదం రాజకీయ భావాలను రేపింది; (3) బాధ, మరణం, పునరుత్థానం కలిపి చెప్పగలిగింది (8:31; 9:31; 10:33-34). మహా యాజకుని ఎదుట \"మనుష్య కుమారుడు\" అని చెప్పినప్పుడు దైవదూషణ ఆరోపణ వచ్చింది (14:61-64).", "refs": "దానియేలు 7:13-14; మార్కు 8:31; మార్కు 14:61-64", "cat": "jesus", "new": true}, {"id": 842, "q": "యేసు స్త్రీల పట్ల, పిల్లల పట్ల ఎలా ప్రవర్తించాడు?", "a": "స్త్రీల పట్ల — ఆ కాలపు పద్ధతులను మించి: సమరయ స్త్రీతో బహిరంగంగా మాట్లాడాడు (యోహాను 4:9, 27), స్త్రీలను శిష్యులుగా చేర్చుకున్నాడు (లూకా 8:1-3), మగ్దలేనేకు మొదటి దర్శనం ఇచ్చాడు (యోహాను 20:14-18), విడాకుల విషయంలో స్త్రీలకు రక్షణ (మార్కు 10:11-12 — పురుషుడు కూడా తప్పు చేస్తాడని), వ్యభిచారిణిని కాపాడాడు (యోహాను 8:11). పిల్లల పట్ల — \"పిల్లలను నా దగ్గరకు రానివ్వండి, వారిని ఆటంకపరచకండి; దేవుని రాజ్యం అలాంటివారిదే\" (మార్కు 10:14); \"వారిని ఎత్తుకొని, చేతులు వేసి ఆశీర్వదించాడు\" (10:16); \"మీరు మారకపోతే పిల్లల్లా ఉండకపోతే రాజ్యంలో ప్రవేశించలేరు\" (మత్తయి 18:3). ఆయన సమాజంలో అంచున ఉన్నవారిని కేంద్రానికి తెచ్చాడు.", "refs": "యోహాను 4:9, 27; మార్కు 10:13-16; యోహాను 8:11; మత్తయి 18:3", "cat": "jesus", "new": true}, {"id": 843, "q": "యేసు ధనవంతుల పట్ల — ధనవంతుడు రాజ్యంలో ప్రవేశించడం కష్టమా?", "a": "యేసు ధనాన్ని నిషేధించలేదు — కానీ హెచ్చరించాడు: \"ధనవంతులు దేవుని రాజ్యంలో ప్రవేశించడం ఎంత కష్టం! ఒంటె సూది కన్నా దూరం వెళ్ళడం సులభం\" (మార్కు 10:23-25). ఆ యువకుడు \"ఆస్తి విడిచి రమ్ము\" అన్నప్పుడు \"దుఃఖంతో వెళ్ళిపోయాడు, ఎందుకంటే అతనికి ఆస్తి విస్తారం\" (10:22). కారణం — ధనం భద్రత, గుర్తింపు, నియంత్రణ భ్రమ ఇస్తుంది; దేవుడు కాక ధనం ప్రభువు అవుతుంది (మత్తయి 6:24). కానీ \"దేవునికి అసాధ్యమైనది ఏదీ లేదు\" (మార్కు 10:27) — జక్కయ్య (లూకా 19:1-10) ఉదాహరణ. ఆచరణ: ధనాన్ని సేవకు, దానానికి ఉపయోగించడం (1 తిమో 6:17-19); లోభం నుండి దూరం (లూకా 12:15).", "refs": "మార్కు 10:21-27; మత్తయి 6:24; లూకా 19:1-10; 1 తిమోతి 6:17-19", "cat": "jesus", "new": true}, {"id": 844, "q": "దేవుని న్యాయం, కరుణ ఒకేసారి ఎలా ఉంటాయి? (ఒకటి మరొకదానికి వ్యతిరేకం కాదా?)", "a": "బైబిల్ దేవుని న్యాయం, కరుణ రెండూ ఒకే స్వభావంలో ఉన్నాయని చెబుతుంది — \"యెహోవా, కరుణాళువు, కృపాళువు, దీర్ఘశాంతుడు... న్యాయాన్ని విడిచిపెట్టడు\" (నిర్గమ 34:6-7 ఒకే వాక్యంలో రెండూ). అవి వ్యతిరేకం కావు — కరుణ న్యాయాన్ని తీసేయదు, న్యాయం కరుణను ఆపదు. కీలకం — శిలువ: \"ఆయన తన నీతిని చూపించడానికి, తానే న్యాయవంతుడై, విశ్వసించేవారిని నీతిమంతులుగా ఎంచేవాడై\" (రోమా 3:25-26). అంటే దేవుడు పాపాన్ని పట్టించుకోకుండా క్షమించడు — ఆ శిక్షను తానే భరించాడు; మరియు క్షమాపణను ఉచితంగా ఇస్తాడు. \"కరుణ, సత్యం ఒకదానినొకటి కలుసుకున్నాయి; నీతి, సమాధానం ఒకదానినొకటి ముద్దాడుకున్నాయి\" (కీర్తనలు 85:10).", "refs": "నిర్గమకాండము 34:6-7; రోమా 3:25-26; కీర్తనలు 85:10; యాకోబు 2:13", "cat": "god", "new": true}, {"id": 845, "q": "దేవుని సంకల్పం (will) — ఒకటేనా, రకాలు ఉన్నాయా?", "a": "బైబిల్ దేవుని చిత్తాన్ని వేరు కోణాల్లో చూపుతుంది: (1) నిర్ణయాత్మక చిత్తం (decretive) — ఆయన నిర్ణయించినది, ఏదీ ఆపలేదు (ఎఫెసీ 1:11; దానియేలు 4:35; యెషయా 46:10); (2) నైతిక/ఆదేశ చిత్తం (preceptive) — ఆయన మనలను ఏమి చేయమని ఆదేశిస్తాడు (1 థెస్స 4:3 \"దేవుని చిత్తం మీ పరిశుద్ధత\"; ద్వితీ 30:19) — దీన్ని మనం మీరవచ్చు; (3) అనుమతి చిత్తం — చెడును అనుమతించడం (యోబు 1:12). భేదం ముఖ్యం — \"దేవుడు దీన్ని కోరాడు\" అని ప్రతి సంఘటనకు చెప్పకూడదు; మరియు మన పాపానికి దేవుణ్ణి నిందించలేము (యాకోబు 1:13). \"రహస్యమైనవి మన దేవుడైన యెహోవావి, బయలుపరచినవి మనవి\" (ద్వితీ 29:29).", "refs": "ఎఫెసీ 1:11; 1 థెస్సలొనీక 4:3; యోబు 1:12; ద్వితీయోపదేశకాండము 29:29", "cat": "god", "new": true}, {"id": 846, "q": "దేవుని నామాలు (యెహోవా జిరే, రాఫా, షాలోమ్) — అర్థం ఏమిటి?", "a": "బైబిల్‌లో దేవుని నామాలు ఆయన స్వభావాన్ని, అనుభవాన్ని తెలియజేస్తాయి: (1) యెహోవా జిరే — \"యెహోవా సిద్ధపరచును\" (ఆది 22:14 — ఇస్సాకు స్థానంలో గొర్రెపిల్ల); (2) యెహోవా రాఫా — \"నీ రోగాలను నయం చేసేవాడు\" (నిర్గమ 15:26); (3) యెహోవా నిస్సి — \"నా జెండా\" (17:15 — విజయం); (4) యెహోవా షాలోమ్ — \"సమాధానం\" (న్యాయాధిపతులు 6:24); (5) యెహోవా రోయి — \"నా కాపరి\" (కీర్తనలు 23:1); (6) యెహోవా షమ్మా — \"అక్కడ ఉన్నాడు\" (యెహెజ్కేలు 48:35); (7) యెహోవా సేనల ప్రభువు (1 సమూ 1:3). ఇవి వేరు దేవుళ్ళు కాదు — ఒకే దేవుడు, ఆయన ప్రజల అనుభవంలో తెలిసిన విధాలు. యేసులో అన్నీ నెరవేరాయి (యోహాను 8:58; ఫిలిప్పీ 2:9-11).", "refs": "ఆదికాండము 22:14; నిర్గమకాండము 15:26; న్యాయాధిపతులు 6:24; కీర్తనలు 23:1", "cat": "god", "new": true}, {"id": 847, "q": "\"సేనల ప్రభువు\" (Lord of Hosts) అంటే ఏమిటి? యుద్ధ దేవుడా?", "a": "\"సేనల ప్రభువు\" (హీబ్రూ: యెహోవా సెబావోత్) — \"సేనలు\" అంటే పరలోక దూతల సేనలు (కీర్తనలు 103:20-21; 148:2), ఇశ్రాయేలు సేనలు, లేదా సృష్టి శక్తులు. అర్థం — దేవుడు సమస్త ఆధ్యాత్మిక, భౌతిక శక్తులకు ప్రభువు (యెషయా 6:3-5; 1 సమూ 17:45 — దావీదు గొల్యాతు ఎదుట). అంటే ఆయన కేవలం యుద్ధ దేవుడు కాదు — సర్వశక్తిమంతుడు, సర్వసైన్యాధిపతి; ప్రతి శక్తి ఆయన క్రింద ఉంది (ఎఫెసీ 1:20-22; కొలస్సి 2:15). ఆచరణ: భయం లేదు — \"మా పక్షంగా ఉన్నవారు వారితో ఉన్నవారి కంటే ఎక్కువ\" (2 రాజులు 6:16-17); మరియు గొల్యాతు ఎదుట దావీదు లాగా — \"యుద్ధం యెహోవాది\" (1 సమూ 17:47).", "refs": "1 సమూయేలు 17:45-47; యెషయా 6:3-5; 2 రాజులు 6:16-17; ఎఫెసీ 1:20-22", "cat": "god", "new": true}, {"id": 848, "q": "దేవుని మహిమ అంటే ఏమిటి? మనం దాన్ని ఎలా ఇవ్వగలం?", "a": "\"మహిమ\" (హీబ్రూ: కాబోద్ = బరువు, గౌరవం; గ్రీకు: డాక్సా) అంటే దేవుని స్వభావపు ప్రకాశం, గౌరవం, గొప్పతనం — ఆయన ఎవరో బయటపడటం (నిర్గమ 33:18-23; యెషయా 6:3). మనం దేవునికి మహిమ \"ఇవ్వడం\" అంటే ఆయనకు అది జోడించడం కాదు — ఆయన గొప్పతనాన్ని గుర్తించి, ప్రకటించి, జీవితంతో చూపడం (కీర్తనలు 96:7-8). ఆచరణ: \"మీరు తిన్నా, త్రాగినా, ఏది చేసినా దేవుని మహిమకే చేయండి\" (1 కొరింథీ 10:31); మంచి క్రియలు (మత్తయి 5:16); స్తుతి (రోమా 15:6); ఓర్పు (యోహాను 21:19). మరియు మనం ఆయన మహిమను చూస్తాము — \"వాక్యము శరీరధారియై, కృపతోను సత్యముతోను నిండినవాడై, మన మధ్య నివసించెను; ఆయన మహిమను చూశాము\" (యోహాను 1:14).", "refs": "నిర్గమకాండము 33:18-23; యెషయా 6:3; 1 కొరింథీ 10:31; యోహాను 1:14", "cat": "god", "new": true}, {"id": 849, "q": "దేవుని రాజ్యం — ఇప్పుడు ఉందా, రాబోతుందా?", "a": "రెండూ — \"ఇప్పటికే, ఇంకా కాదు\" (already/not yet). యేసు \"దేవుని రాజ్యం సమీపించింది\" అన్నాడు (మార్కు 1:15); \"దేవుని రాజ్యం మీ మధ్య ఉంది\" (లూకా 17:21); కానీ \"నీ రాజ్యం రావాలి\" అని ప్రార్థించమన్నాడు (మత్తయి 6:10) — అంటే పూర్తిగా రావాలి. ఇప్పుడు — క్రీస్తు పరిపాలన, ఆత్మ శక్తి, విశ్వాసుల హృదయాల్లో (రోమా 14:17; కొలస్సి 1:13). రాబోయేది — క్రీస్తు రెండో రాకలో పూర్తి (ప్రకటన 11:15; 1 కొరింథీ 15:24-26). ఆచరణ: రాజ్య పౌరులు ఇప్పుడే — నీతి, సమాధానం, సంతోషం (రోమా 14:17); మరియు నిరీక్షణతో ఎదురుచూడటం (తీతు 2:13).", "refs": "మార్కు 1:15; లూకా 17:20-21; రోమా 14:17; ప్రకటన 11:15", "cat": "god", "new": true}, {"id": 850, "q": "దేవుడు శోధిస్తాడా, పరీక్షిస్తాడా? భేదం ఏమిటి?", "a": "బైబిల్ భేదం చెబుతుంది: దేవుడు \"పరీక్షిస్తాడు\" (test) — విశ్వాసాన్ని శుద్ధి చేయడానికి (ఆది 22:1 \"దేవుడు అబ్రాహామును పరీక్షించాడు\"; యాకోబు 1:2-4; 1 పేతురు 1:6-7). కానీ \"శోధించడు\" (tempt) — చెడుకు ప్రేరేపించడు: \"దేవుడు చెడు విషయాలతో శోధింపబడడు, ఆయన ఎవరినీ శోధించడు\" (యాకోబు 1:13). శోధన మూలం — మన కోరికలు (1:14-15), సాతాను (మత్తయి 4:1), లోకం (1 యోహాను 2:16). భేదం ఉద్దేశంలో: పరీక్ష విశ్వాసాన్ని బలపరుస్తుంది, శోధన పాపంలోకి లాగుతుంది. యేసు కూడా పరీక్షింపబడ్డాడు — \"మన బలహీనతలను గూర్చి సహానుభూతి చూపగలవాడు\" (హెబ్రీ 4:15).", "refs": "ఆదికాండము 22:1; యాకోబు 1:2-4, 13-15; హెబ్రీ 4:15; 1 పేతురు 1:6-7", "cat": "god", "new": true}, {"id": 851, "q": "దేవుని మౌనం — 400 సంవత్సరాల మౌనం ఎందుకు? ఈ రోజు కూడా మౌనమా?", "a": "మలాకీ తర్వాత మత్తయి వరకు సుమారు 400 సంవత్సరాలు ప్రవక్తలు లేరు — \"ప్రవచన ఆత్మ ఆగిపోయింది\" అని సంప్రదాయం. కానీ ఆ కాలంలో దేవుడు నిష్క్రియుడు కాదు — సెప్టువజింట్ అనువాదం, సినగాగ్ వ్యవస్థ, మక్కబీయుల విముక్తి, రోమా మార్గాలు, గ్రీకు భాష — అన్నీ సువార్తకు సిద్ధత (గలతీ 4:4 \"కాలం నిండినప్పుడు దేవుడు తన కుమారుణ్ణి పంపాడు\"). మౌనం అనేది వదిలిపెట్టడం కాదు — సిద్ధపరచడం. ఈ రోజు దేవుడు మాట్లాడతాడు — తన వాక్యం ద్వారా (హెబ్రీ 1:1-2), ఆత్మ ద్వారా (యోహాను 16:13), సంఘం ద్వారా. \"మౌనం\" అనిపించినప్పుడు — ఆయన పని ఆపలేదు, మనం వినడం నేర్చుకుంటున్నాం (కీర్తనలు 62:1-5).", "refs": "మలాకీ 4:5-6; గలతీ 4:4; హెబ్రీ 1:1-2; కీర్తనలు 62:1-5", "cat": "god", "new": true}, {"id": 852, "q": "దేవుడు ఈ రోజు తన ప్రజలను శిక్షిస్తాడా? (వ్యాధి, ప్రమాదం — శిక్షా?)", "a": "క్రైస్తవుల్లో భేదం ఉన్న అంశం — కానీ బైబిల్ సూత్రాలు: (1) క్రీస్తులో \"ఇక శిక్షార్హత లేదు\" (రోమా 8:1) — నరకానికి సంబంధించిన శిక్ష తీరింది; (2) కానీ తండ్రి క్రమశిక్షణ ఉంది — \"ప్రభువు ప్రేమించేవారిని శిక్షిస్తాడు\" (హెబ్రీ 12:6), ఉద్దేశం సరిదిద్దడం (12:10-11); (3) ప్రతి బాధ శిక్ష కాదు — యోహాను 9:2-3లో యేసు ఆ ఆలోచనను ఖండించాడు; యోబు నీతిమంతుడు కానీ బాధపడ్డాడు; (4) కొరింథీ సంఘంలో కొందరు \"శిక్షింపబడ్డారు\" (1 కొరింథీ 11:30-32). ఆచరణ: ప్రతి కష్టాన్ని శిక్షగా భావించి నిందలో మునగకూడదు; పరిశీలించడం, పశ్చాత్తాపం, దేవునిపై నమ్మకం (రోమా 8:28).", "refs": "రోమా 8:1, 28; హెబ్రీ 12:6-11; యోహాను 9:2-3; 1 కొరింథీ 11:30-32", "cat": "god", "new": true}, {"id": 853, "q": "\"దేవునికి భయపడటం\" అంటే ఏమిటి? ప్రేమ దేవుడిని భయపడాలా?", "a": "బైబిల్ భయాన్ని ప్రేమతో కలుపుతుంది — \"యెహోవాకు భయపడుట జ్ఞానానికి మూలం\" (సామెతలు 1:7); \"ఆయన ప్రజలను భయపడుతూ ప్రేమిస్తాడు\" (కీర్తనలు 103:11-13 తండ్రి ఉదాహరణ). దేవుని భయం అంటే: (1) గౌరవం, విస్మయం — ఆయన ఎవరో తెలుసుకోవడం; (2) ఆయనను అగౌరవపరచకపోవడం, పాపాన్ని తేలికగా తీసుకోకపోవడం (మత్తయి 10:28); (3) ఆయనను నిరాశపరచాలనే భయం — బిడ్డ తండ్రిని నొప్పించాలని భయపడటం లాంటిది. \"పరిపూర్ణమైన ప్రేమ భయాన్ని తొలగిస్తుంది\" (1 యోహాను 4:18) — అంటే శిక్షా భయం, దూరం చేసే భయం; కానీ గౌరవ భయం, ప్రేమతో కలిసి ఉంటుంది (హెబ్రీ 12:28-29).", "refs": "సామెతలు 1:7; కీర్తనలు 103:11-13; మత్తయి 10:28; 1 యోహాను 4:18", "cat": "god", "new": true}, {"id": 854, "q": "దేవుడు మనలను ఎందుకు సృష్టించాడు? ఆయనకు అవసరం ఉందా?", "a": "దేవునికి మనం అవసరం లేదు — \"ఆయనకు ఏదీ అవసరం లేదు\" (అపొ.కా. 17:25); సృష్టి ఆయనను పూర్తి చేయదు (కీర్తనలు 50:10-12). కానీ ఆయన సృష్టించాడు: (1) తన మహిమ కోసం — \"నా మహిమ కొరకు సృష్టించాను\" (యెషయా 43:7); (2) తన ప్రేమను పంచుకోవడానికి — ఆయన నిత్య సంబంధంలో (త్రిత్వం) ఉన్నాడు, ప్రేమ ఇవ్వడానికి వ్యక్తులు కావాలి; (3) సంబంధం కోసం — \"మన స్వరూపంలో మనిషిని చేయుదాం\" (ఆది 1:26); (4) ఆయన మహిమను, కృపను చూపడానికి (ఎఫెసీ 1:6, 12; 2:7). అంటే మనం ప్రమాదవశాత్తు పుట్టినవారం కాదు — ఉద్దేశంతో, ప్రేమతో సృష్టించబడ్డాము (కీర్తనలు 139:13-16; యిర్మీయా 29:11).", "refs": "అపొ.కా. 17:25; యెషయా 43:7; ఆదికాండము 1:26; ఎఫెసీ 1:6, 12", "cat": "god", "new": true}, {"id": 855, "q": "\"క్రైస్తవం బలహీనులకు ఊతం (opium of the masses)\" అనే మార్క్స్ విమర్శకు జవాబు?", "a": "మార్క్స్ ఆరోపణ — మతం బాధను మరచిపోయే మత్తు, నిజమైన మార్పును ఆపుతుంది. కానీ చరిత్ర వేరు చెబుతుంది: క్రైస్తవ విశ్వాసం నుండి న్యాయం, విద్య, ఆరోగ్యం, దాస్య నిర్మూలనకు ఉద్యమాలు పుట్టాయి — విల్బర్‌ఫోర్స్, మార్టిన్ లూథర్ కింగ్, భారతదేశంలో మిషనరీ విద్యా సంస్థలు, పేదలకు సేవ. బైబిల్ \"ఊపిరి ఆపే\" బోధ కాదు — ప్రవక్తలు అన్యాయాన్ని ఖండించారు (ఆమోసు 5:24; మీకా 6:8); యాకోబు \"పేదలను చూసుకోవడం నిజమైన భక్తి\" అన్నాడు (1:27). అదే సమయంలో క్రైస్తవం ఈ లోకం మొత్తం కాదని చెబుతుంది — కానీ దాని ఆశ మనలను నిష్క్రియులుగా కాదు, సేవకులుగా చేస్తుంది (1 కొరింథీ 15:58).", "refs": "ఆమోసు 5:24; మీకా 6:8; యాకోబు 1:27; 1 కొరింథీ 15:58", "cat": "objections", "new": true}, {"id": 856, "q": "\"బైబిల్ నైతికత బానిస నైతికత\" (నీత్షే విమర్శ) — సరైనదా?", "a": "నీత్షే ఆరోపణ — క్రైస్తవ నైతికత బలహీనులను, బానిసల మనోభావాన్ని కీర్తిస్తుంది, బలమైనవారిని అణచివేస్తుంది. జవాబు: (1) క్రైస్తవం బలాన్ని ఖండించదు — ప్రేమతో కలిసిన బలం, స్వీయ నియంత్రణ, ధైర్యం కోరుతుంది (2 తిమో 1:7; 1 కొరింథీ 16:13); (2) క్షమాపణ, వినయం బలహీనత కాదు — అవి గొప్ప ఆత్మబలం (మత్తయి 5:5; ఫిలిప్పీ 2:3-8); (3) బైబిల్ బలవంతులను హెచ్చరిస్తుంది, బలహీనులను రక్షిస్తుంది — ఇది బానిస నైతికత కాదు, న్యాయం (యెషయా 1:17; సామెతలు 31:8-9); (4) క్రీస్తు స్వయంగా \"బలహీనుడు\" కాదు — ఆయన అధికారంతో, ప్రేమతో తనను అప్పగించుకున్నాడు (యోహాను 10:18). నీత్షే తానే స్వీయ శక్తిని కీర్తించాడు — కానీ దాని ఫలితం చరిత్రలో కనిపించింది.", "refs": "2 తిమోతి 1:7; మత్తయి 5:5; ఫిలిప్పీ 2:3-8; యోహాను 10:18", "cat": "objections", "new": true}, {"id": 857, "q": "\"మీరు పాపులని చెప్పి నిందిస్తారు\" — పాప బోధ మానసిక ఒత్తిడి కలిగిస్తుందా?", "a": "పాప బోధను దుర్వినియోగించి నిందించడం తప్పు — యేసు ఎప్పుడూ అలా చేయలేదు; ఆయన సత్యం చెప్పి, క్షమాపణ ఇచ్చాడు (యోహాను 8:11; 4:10). బైబిల్ పాపాన్ని వ్యాధిగా చూపుతుంది — వ్యాధిని చెప్పడం క్రూరత్వం కాదు, చికిత్సకు మొదటి అడుగు (మార్కు 2:17 \"రోగులకే వైద్యుడు కావాలి\"). అలాగే — పాప భావన అణచివేత కాదు, నిజమైన మానసిక ఆరోగ్యానికి సహాయం: క్షమాపణ పొందినవాడు అపరాధం నుండి విడుదల పొందుతాడు (కీర్తనలు 32:1-5; రోమా 8:1). ప్రమాదం — పాపాన్ని మాత్రమే బోధించి, కృపను చెప్పకపోవడం; అది సువార్త కాదు (1 యోహాను 1:9). నిందించే బోధను విమర్శించడం సరైనదే — కానీ పాపం నిజమని చెప్పడాన్ని కాదు.", "refs": "మార్కు 2:17; యోహాను 8:11; కీర్తనలు 32:1-5; రోమా 8:1", "cat": "objections", "new": true}, {"id": 858, "q": "\"అన్ని జవాబులూ ఇవ్వలేరు కదా?\" — సందేహాలకు సమాధానం ఉండకపోతే విశ్వాసం బలహీనమా?", "a": "లేదు. బైబిల్ కొన్ని విషయాలు మన బుద్ధికి మించినవని చెబుతుంది — \"మనం ఇప్పుడు అద్దంలో చూసినట్లు మసకగా చూస్తున్నాం\" (1 కొరింథీ 13:12); \"ఆయన వివేచనలు పరిశోధించలేనివి\" (రోమా 11:33); \"రహస్యమైనవి యెహోవావి\" (ద్వితీ 29:29). అంటే విశ్వాసం అనేది అన్ని ప్రశ్నలకు సమాధానం ఉండటంపై ఆధారపడదు — ఆధారాలు, క్రీస్తుపై నమ్మకంపై ఆధారపడుతుంది (హెబ్రీ 11:1). అదే సమయంలో సందేహాన్ని దాచకూడదు — వెతకడం, అడగడం, అధ్యయనం చేయడం బైబిల్ పద్ధతి (అపొ.కా. 17:11; లూకా 1:3-4). \"నాకు తెలియదు, కానీ నేను వెతుకుతున్నాను\" — ఇది నిజాయితీ, విశ్వాసం రెండూ.", "refs": "1 కొరింథీ 13:12; రోమా 11:33; ద్వితీయోపదేశకాండము 29:29; అపొ.కా. 17:11", "cat": "objections", "new": true}, {"id": 859, "q": "\"ఒకే దేవుడు ఉంటే ఇన్ని మతాలు ఎందుకు?\" (సత్యం ఒకటే అయితే విభేదాలు ఎందుకు?)", "a": "ఈ ప్రశ్న మంచిది. కారణాలు: (1) మనుషుల భౌగోళిక, సాంస్కృతిక చరిత్ర — వేరు వేరు ప్రాంతాల్లో వేరు వేరు బోధలు పెరిగాయి; (2) సత్యాన్ని తిరస్కరించడం, మర్చిపోవడం — రోమా 1:21-23 (దేవుణ్ణి ఎరిగి మహిమపరచలేదు); (3) మానవ స్వార్థం, అధికారం — మతాన్ని వాడుకోవడం; (4) నిజమైన ఆధ్యాత్మిక అన్వేషణ — అనేక మతాలు సత్యం కోసం వెతుకుతున్నాయి. కానీ భేదాలు ఉన్నాయని సత్యం లేదని అర్థం కాదు — అనేక వైద్య సిద్ధాంతాలు ఉన్నాయని ఒకటి సరైనది కాదని కాదు. క్రైస్తవం ఆధారాలు ఇస్తుంది: క్రీస్తు పునరుత్థానం (1 కొరింథీ 15:3-8), ప్రవచనాలు, చరిత్ర — పరీక్షించమని ఆహ్వానిస్తుంది (1 థెస్స 5:21).", "refs": "రోమా 1:21-23; 1 కొరింథీ 15:3-8; 1 థెస్సలొనీక 5:21; యోహాను 14:6", "cat": "objections", "new": true}, {"id": 860, "q": "\"దేవుడు అహంకారి — తనను పొగడుకోమంటాడు\" అనే విమర్శకు జవాబు?", "a": "దేవుడు తన మహిమను కోరడం అహంకారం కాదు — ఎందుకంటే ఆయన నిజంగా అత్యున్నతుడు; అహంకారం అనేది ఉన్న దానికంటే ఎక్కువ చెప్పుకోవడం, ఇతరులను తక్కువ చేయడం (రోమా 12:3). దేవుడు తనను గురించి నిజం చెబుతాడు — మనం ఏమీ కాదు, ఆయన సమస్తం (యెషయా 45:5; కీర్తనలు 8:3-4). మరియు ఆయన మహిమ కోరడం మన ప్రయోజనం కోసమే — మనం దేవునికి దూరమై, పరిమితమైన వాటికి మహిమ ఇచ్చినప్పుడు మనం నశిస్తాము (రోమా 1:23, 25); ఆయనను మహిమపరచినప్పుడు మనం సరైన స్థానంలో నిలుస్తాము. అదే సమయంలో ఆయన స్తుతిని కోరినా దాన్ని పొందడానికి అవసరం పడడు (అపొ.కా. 17:25) — ఆయన మనలను ప్రేమించి, తనతో సంబంధానికి పిలుస్తాడు.", "refs": "రోమా 12:3; యెషయా 45:5; కీర్తనలు 8:3-4; అపొ.కా. 17:25", "cat": "objections", "new": true}, {"id": 861, "q": "\"క్రైస్తవం భారతీయ సంస్కృతిని నాశనం చేస్తుంది\" అనే ఆరోపణ — నిజమా?", "a": "క్రైస్తవం సంస్కృతిని నాశనం చేయదు — ఆరాధనను మార్చి, సంస్కృతిని పవిత్రం చేస్తుంది. సాక్ష్యం: క్రైస్తవులు భారతీయ భాషల్లో (తమిళం, తెలుగు, మలయాళం, హిందీ) సాహిత్యాన్ని, పాటలను, కీర్తనలను సృష్టించారు; సంగీతంలో స్థానిక వాయిద్యాలు; విద్య, ఆరోగ్యం, అంటరానితనం నిర్మూలనలో పాత్ర. అదే సమయంలో — చరిత్రలో కొందరు మిషనరీలు సంస్కృతిని తక్కువ చేసిన దోషం ఉంది, అది నిజం; కానీ క్రీస్తు బోధ సంస్కృతి గురించి కాదు — హృదయం గురించి (గలతీ 3:28). బైబిల్ ప్రకారం ప్రతి సంస్కృతి దేవుని సృష్టి, పరిశుద్ధాత్మ ప్రతి జాతిని స్వీకరిస్తాడు (ప్రకటన 7:9) — ఆరాధన ఒక సంస్కృతి శైలికి పరిమితం కాదు (యోహాను 4:23-24).", "refs": "గలతీ 3:28; ప్రకటన 7:9; యోహాను 4:23-24; 1 కొరింథీ 9:19-23", "cat": "objections", "new": true}, {"id": 862, "q": "\"ప్రార్థనలో నా మనస్సే నాకు సమాధానం చెబుతోంది\" — మానసిక ఉత్పత్తి, దేవుని స్వరం మధ్య భేదం?", "a": "ఇది నిజమైన ప్రశ్న. భేదం చేయడానికి ప్రమాణాలు: (1) వాక్యానుకూలత — దేవుడు తన వాక్యానికి వ్యతిరేకంగా మాట్లాడడు (యెషయా 8:20; గలతీ 1:8); (2) క్రీస్తు ఘనత (యోహాను 16:14); (3) ఫలం — దాని ఫలితం ప్రేమ, పరిశుద్ధత, సమాధానం (గలతీ 5:22-23); (4) ధృవీకరణ — స్వతంత్ర సలహా (సామెతలు 11:14); (5) కాలం — నిజమైన మాట నిలుస్తుంది (మత్తయి 24:35); (6) దేవుని స్వభావం — ఆయన భయం, గందరగోళం కలిగించడు (1 కొరింథీ 14:33). ఆచరణ: \"దేవుడు నాకు చెప్పాడు\" అనే మాటను జాగ్రత్తగా వాడడం — \"నాకు ఇలా అనిపిస్తోంది\" అని చెప్పడం నిజాయితీ; మరియు ప్రధాన నిర్ణయాలకు వాక్యం, సలహా అవసరం (1 థెస్స 5:21).", "refs": "యెషయా 8:20; యోహాను 16:14; గలతీ 5:22-23; 1 కొరింథీ 14:33", "cat": "objections", "new": true}, {"id": 863, "q": "\"బైబిల్ పాత గ్రంథం, ఆధునిక యుగానికి సరిపోదు\" — ఇది సరైనదా?", "a": "బైబిల్ పాతది — కానీ పాతకాలం కాదు. అది మనుషుల స్వభావం, పాపం, భయం, ప్రేమ, మరణం గురించి మాట్లాడుతుంది — అవి మారలేదు (ప్రసంగి 1:9). ఆధునిక సవాళ్లకు (టెక్నాలజీ, మానసిక ఆరోగ్యం, సంబంధాలు, డబ్బు) సూత్రాలు వర్తిస్తాయి — ఉదా. 1 కొరింథీ 6:12 (వ్యసనం), ఫిలిప్పీ 4:6-8 (ఆందోళన, మనస్సు), ఎఫెసీ 4:25 (నిజాయితీ). అలాగే బైబిల్ కాలాలు, సంస్కృతులను దాటి మాట్లాడుతుంది — అది దేవుని వాక్యం (హెబ్రీ 4:12). \"ఆకాశం, భూమి గతించినా నా మాటలు గతింపవు\" (మత్తయి 24:35). ప్రమాణం — వాక్యం వర్తించే సూత్రాన్ని గుర్తించడం (2 తిమో 2:15).", "refs": "ప్రసంగి 1:9; హెబ్రీ 4:12; మత్తయి 24:35; 2 తిమోతి 2:15", "cat": "objections", "new": true}, {"id": 864, "q": "క్రైస్తవుడు సైన్యంలో చేరవచ్చా? యుద్ధం చేయవచ్చా?", "a": "క్రైస్తవుల్లో భేదం ఉన్న అంశం — కానీ బైబిల్ సూత్రాలు: (1) పాలకులకు న్యాయాన్ని కాపాడే బాధ్యత ఇవ్వబడింది — \"అధికారి దుష్టులకు శిక్ష, మంచివారికి మెప్పు\" (రోమా 13:3-4); (2) యోహాను బాప్తిస్ముడు సైనికులను \"మానుకో\" అనలేదు — \"బలవంతం చేయకండి, అబద్ధ ఆరోపణ చేయకండి, మీ జీతంతో తృప్తిపడండి\" (లూకా 3:14); (3) యేసు శతాధిపతి విశ్వాసాన్ని మెచ్చుకున్నాడు (మత్తయి 8:10); (4) కానీ వ్యక్తిగత ప్రతీకారం, హింస తప్పు (మత్తయి 5:38-39; 26:52). కాబట్టి న్యాయం, రక్షణ కోసం సేవ అనుమతి — కానీ హింస, దోపిడీ, అన్యాయ యుద్ధంలో పాల్గొనడం తప్పు. మనస్సాక్షి, ప్రార్థన, సలహా అవసరం.", "refs": "రోమా 13:3-4; లూకా 3:14; మత్తయి 8:10; మత్తయి 26:52", "cat": "ethics", "new": true}, {"id": 865, "q": "పరువు హత్యలు (honour killings) — బైబిల్ సమర్థిస్తుందా?", "a": "ఎప్పుడూ కాదు. బైబిల్ హత్యను స్పష్టంగా నిషేధిస్తుంది — \"నరహత్య చేయకూడదు\" (నిర్గమ 20:13); \"మనుష్యుని రక్తాన్ని చిందించువాడు... తన రక్తాన్ని చిందించబడతాడు\" (ఆది 9:6); \"కత్తి పట్టుకున్నవారందరూ కత్తితో నశిస్తారు\" (మత్తయి 26:52). \"పరువు\" పేరుతో కుటుంబ సభ్యులను చంపడం — అది పాపం, దేవుని నింద. బైబిల్ కుటుంబ గౌరవం గురించి మాట్లాడుతుంది (నిర్గమ 20:12) — కానీ హత్యతో కాదు; ప్రేమ, సత్యం, క్షమాపణతో (ఎఫెసీ 4:32; రోమా 12:17-21). క్రైస్తవ సమాజం బాధితులను కాపాడాలి, చట్టానికి సహకరించాలి, కుటుంబాల్లో దయ నేర్పాలి — సంస్కృతి పేరుతో హింసను సమర్థించకూడదు (మార్కు 7:9-13 — సంప్రదాయం దేవుని ఆదేశాన్ని రద్దు చేయకూడదు).", "refs": "నిర్గమకాండము 20:13; ఆదికాండము 9:6; మత్తయి 26:52; మార్కు 7:9-13", "cat": "ethics", "new": true}, {"id": 866, "q": "బాల కార్మికులు, పిల్లల హక్కులు — బైబిల్ ఏమంటుంది?", "a": "బైబిల్ పిల్లలను దేవుని బహుమతిగా, రక్షణ పొందాల్సినవారిగా చూపుతుంది — \"పిల్లలు యెహోవా ఇచ్చిన సంతానం\" (కీర్తనలు 127:3); యేసు \"పిల్లలను నా దగ్గరకు రానివ్వండి\" అన్నాడు (మార్కు 10:14); \"వారి దూతలు పరలోకంలో తండ్రి ముఖాన్ని చూస్తారు\" (మత్తయి 18:10); పిల్లలను దెబ్బతీయడం గురించి తీవ్ర హెచ్చరిక (18:6). అలాగే కార్మికులకు న్యాయం — \"కూలీ వేతనం మొర్రపెట్టుచున్నది\" (యాకోబు 5:4); \"అనాథులకు న్యాయం\" (యెషయా 1:17). కాబట్టి పిల్లలను చౌక కూలీగా, వారి బాల్యాన్ని దోచుకోవడం బైబిల్ సూత్రాలకు వ్యతిరేకం; విద్య, రక్షణ, గౌరవం ఇవ్వడం విశ్వాసి బాధ్యత (సామెతలు 31:8-9).", "refs": "కీర్తనలు 127:3; మార్కు 10:14; యాకోబు 5:4; యెషయా 1:17", "cat": "ethics", "new": true}, {"id": 867, "q": "మద్యం విక్రయించడం, మద్యశాల నడపడం క్రైస్తవుడికి సరైనదా?", "a": "బైబిల్ మద్యాన్ని పూర్తిగా నిషేధించదు (యోహాను 2:1-11; 1 తిమో 5:23) — కానీ మత్తుకు, ఇతరుల హానికి వ్యతిరేకం (ఎఫెసీ 5:18; 1 కొరింథీ 6:10; గలతీ 5:21). విక్రయం విషయంలో ప్రశ్నలు: (1) ఇతరుల పతనానికి సహకరించడం — \"మీ స్వాతంత్ర్యం బలహీనులకు అడ్డం కాకూడదు\" (1 కొరింథీ 8:9-13); (2) కుటుంబాలను నాశనం చేసే వ్యాపారం నుండి లాభం — \"ఇతరుల హాని నుండి లాభం\" ప్రేమకు వ్యతిరేకం (రోమా 13:10); (3) స్థానిక సాక్ష్యం — \"మంచిది కాని దేనినీ చేయకండి\" (రోమా 14:21); (4) లైసెన్స్, చట్టం. ఇది స్పష్టమైన \"అవును/కాదు\" కాదు — కానీ క్రైస్తవుడు ప్రేమ, సాక్ష్యం, ఇతరుల హాని ఆధారంగా ఆలోచించాలి.", "refs": "ఎఫెసీ 5:18; 1 కొరింథీ 8:9-13; రోమా 14:21; రోమా 13:10", "cat": "ethics", "new": true}, {"id": 868, "q": "వేతన అసమానత, కార్మిక హక్కులు — బైబిల్ ఏమంటుంది?", "a": "బైబిల్ కార్మికులకు న్యాయమైన వేతనాన్ని స్పష్టంగా ఆదేశిస్తుంది — \"కూలీకి అతని జీతం ఆ రోజే ఇవ్వాలి, సూర్యుడు అస్తమించక ముందే\" (ద్వితీ 24:15); \"ఇదిగో కోత కోసిన కూలీల వేతనం, మీరు ఆపివేసినది మొర్రపెట్టుచున్నది\" (యాకోబు 5:4); \"నూర్పిడి చేసే ఎద్దు నోరు మూయకుము\" (ద్వితీ 25:4; 1 తిమో 5:18). అసమానత విషయంలో — బైబిల్ ప్రతిభ, బాధ్యత ప్రకారం వేరు వేతనాన్ని తిరస్కరించదు (మత్తయి 20:1-15), కానీ దోపిడీని, భేదభావాన్ని ఖండిస్తుంది (యాకోబు 5:1-6; కొలస్సి 4:1). ఆచరణ: నిజాయితీ, న్యాయం, కార్మికుల గౌరవం — లాభం మాత్రమే లక్ష్యం కాదు (మీకా 6:8).", "refs": "ద్వితీయోపదేశకాండము 24:15; యాకోబు 5:1-6; కొలస్సి 4:1; మీకా 6:8", "cat": "ethics", "new": true}, {"id": 869, "q": "వేశ్యావృత్తి, లైంగిక దోపిడీ — బైబిల్ దృష్టి?", "a": "బైబిల్ వేశ్యావృత్తిని స్పష్టంగా ఖండిస్తుంది (లేవీ 19:29; ద్వితీ 23:17; 1 కొరింథీ 6:15-16; సామెతలు 23:27-28) — మరియు దాని వెనుక ఉన్న దోపిడీని, బలవంతాన్ని, పేదరికాన్ని కూడా చూస్తుంది. మనిషి దేవుని స్వరూపం, ఆస్తి కాదు (ఆది 1:27); \"మనుష్యులను అపహరించేవారు\" ధర్మశాస్త్రానికి వ్యతిరేకులు (1 తిమో 1:10). యేసు స్త్రీలను గౌరవించాడు, కాపాడాడు (యోహాను 4; 8:1-11). ఆచరణ: బాధితులకు సహాయం, ఆశ్రయం, చట్టపరమైన సహకారం, నిందించకపోవడం; మరియు డిమాండ్ వైపు (కొనేవారు) కూడా పాపం — బైబిల్ రెండు వైపులా మాట్లాడుతుంది (సామెతలు 6:26; మత్తయి 5:28). సంఘం నిజమైన ప్రేమతో, ఆచరణ సహాయంతో నిలబడాలి (యాకోబు 1:27).", "refs": "లేవీయకాండము 19:29; 1 కొరింథీ 6:15-16; 1 తిమోతి 1:10; యాకోబు 1:27", "cat": "ethics", "new": true}, {"id": 870, "q": "డ్రగ్స్, మత్తు పదార్థాలు — \"సరదాగా\" తీసుకోవచ్చా?", "a": "బైబిల్ స్పష్టంగా మత్తుకు వ్యతిరేకం — \"మద్యముతో మత్తులై ఉండకండి, అది అపవిత్రత; ఆత్మతో నిండుడి\" (ఎఫెసీ 5:18); \"మత్తు పదార్థాలను ఉపయోగించేవారు దేవుని రాజ్యానికి వారసులు కారు\" (గలతీ 5:21); \"మీ శరీరం దేవుని ఆలయం\" (1 కొరింథీ 6:19-20). కారణాలు: (1) మనస్సు, వివేచన కోల్పోవడం — దేవుడు మనకు \"స్వస్థబుద్ధి\" ఇచ్చాడు (2 తిమో 1:7); (2) బానిసత్వం — \"ఏ దానికీ నేను లోబడను\" (1 కొరింథీ 6:12); (3) ఆరోగ్యం, కుటుంబం, ఇతరులకు హాని; (4) చట్టం — \"అధికారులకు లోబడండి\" (రోమా 13:1). \"సరదా\" అనేది పాపాన్ని సమర్థించే కారణం కాదు. సహాయం: కౌన్సెలింగ్, సంఘ మద్దతు, వ్యసన నిపుణుడు — నింద కాదు, పునరుద్ధరణ.", "refs": "ఎఫెసీ 5:18; గలతీ 5:21; 1 కొరింథీ 6:12, 19-20; 2 తిమోతి 1:7", "cat": "ethics", "new": true}, {"id": 871, "q": "ఈ రోజు జంతు బలులు అవసరమా? క్రైస్తవులు చేయాలా?", "a": "లేదు. పాత నిబంధన బలులు క్రీస్తుకు చాయారూపాలు (హెబ్రీ 10:1) — క్రీస్తు \"పాపములకు నిత్యమైన బలిగా తనను తాను అర్పించుకున్నాడు\" (10:12), ఆ తర్వాత \"పాపములకు బలి అవసరం లేదు\" (10:18). దేవాలయం కూడా క్రీ.శ. 70లో నాశనం కావడంతో బలి వ్యవస్థ ఆగిపోయింది. అదే సమయంలో క్రైస్తవులు ఇప్పుడు అర్పించేవి: \"మీ శరీరాలను జీవముగల బలిగా\" (రోమా 12:1); \"స్తుతి అనే బలి\" (హెబ్రీ 13:15); \"దానం, సహాయం అనే బలులు\" (13:16). కాబట్టి ఈ రోజు జంతు బలి అవసరం లేదు, అది క్రీస్తు పనిని తిరస్కరించినట్లు అవుతుంది (గలతీ 2:21). కానీ క్రైస్తవులు ఇతర మతాల ఆచారాలను బలవంతంగా ఆపకూడదు — సాక్ష్యం, ప్రేమ మార్గం.", "refs": "హెబ్రీ 10:1-18; రోమా 12:1; హెబ్రీ 13:15-16; గలతీ 2:21", "cat": "ethics", "new": true}, {"id": 872, "q": "మతం పేరుతో డబ్బు సేకరణ (fundraising) — బైబిల్ సూత్రాలు?", "a": "బైబిల్ దానాన్ని ప్రోత్సహిస్తుంది — కానీ నిజాయితీ, పారదర్శకత, ప్రేమతో. సూత్రాలు: (1) స్వచ్ఛందం — \"ఉల్లాసముగా ఇచ్చువానిని దేవుడు ప్రేమించును\" (2 కొరింథీ 9:7); బలవంతం కాదు; (2) ఉద్దేశం స్పష్టం — సంఘ సేవ, పేదలు, మిషన్ (2 కొరింథీ 8:13-14; గలతీ 2:10); (3) పారదర్శకత — \"మేము నిందపడకుండా జాగ్రత్తపడుతున్నాం\" (2 కొరింథీ 8:20-21); (4) లోభం కాదు — \"అపవిత్ర లాభం కోరకూడదు\" (తీతు 1:7; 1 పేతురు 5:2); (5) భయపెట్టడం, \"దేవుడు నిన్ను ఆశీర్వదిస్తాడు అంటే ఇవ్వు\" అనే లావాదేవీ కాదు (2 కొరింథీ 9:6-7). సంఘం డబ్బు లెక్కలను తెరిచి ఉంచాలి, సభ్యులు అడగగలగాలి.", "refs": "2 కొరింథీ 9:6-7; 2 కొరింథీ 8:20-21; తీతు 1:7; 1 పేతురు 5:2", "cat": "ethics", "new": true}, {"id": 873, "q": "సంఘంలో కుల వివక్ష ఉంటే — విశ్వాసి ఏమి చేయాలి?", "a": "బైబిల్ కుల వివక్షను స్పష్టంగా ఖండిస్తుంది — \"మీ విశ్వాసం మనుష్యుల పట్ల పక్షపాతం చూపుతోందా?\" (యాకోబు 2:1-4); \"క్రీస్తులో భేదం లేదు\" (గలతీ 3:28; కొలస్సి 3:11); పేతురు \"దేవుడు పక్షపాతం చూపడు\" అన్నాడు (అపొ.కా. 10:34). ఆచరణ: (1) వ్యక్తిగతంగా స్పష్టంగా నిలబడటం — స్వయంగా వివక్ష చేయకపోవడం, గౌరవించడం; (2) ప్రేమతో, నేరుగా మాట్లాడటం (మత్తయి 18:15); (3) పెద్దలతో — స్పష్టమైన ఆధారాలతో; (4) బోధలో, ఆరాధనలో, వివాహాల్లో, సహభోజనంలో సమానత్వం; (5) నిరంతర వివక్ష ఉంటే — సంఘాన్ని మార్చడానికి ప్రయత్నించడం, అది జరగకపోతే ప్రార్థనతో, సలహాతో నిర్ణయం. కులం సువార్తకు వ్యతిరేకం — నిజమైన సంఘం అందరికీ ఇల్లు (ఎఫెసీ 2:14-18).", "refs": "యాకోబు 2:1-4; గలతీ 3:28; అపొ.కా. 10:34; ఎఫెసీ 2:14-18", "cat": "ethics", "new": true}, {"id": 874, "q": "క్రైస్తవుడు వలస కార్మికుల పట్ల, పేద పొరుగువారి పట్ల ఏమి చేయాలి?", "a": "బైబిల్ పేదల పట్ల, పరదేశుల పట్ల స్పష్టమైన ఆదేశం ఇస్తుంది — \"పేదవాడు మీ మధ్య ఎప్పుడూ ఉంటాడు, కాబట్టి మీ చేతులు తెరిచి ఉంచండి\" (ద్వితీ 15:11); \"పరదేశిని స్వదేశీయునిలా ప్రేమించుము\" (లేవీ 19:34); \"నగ్నులకు బట్టలు, ఆకలివారికి ఆహారం\" (మత్తయి 25:35-40); \"మతం ఏమిటంటే అనాథలను, విధవరాండ్రను చూసుకోవడం\" (యాకోబు 1:27). ఆచరణ: (1) వ్యక్తిగత సహాయం — ఆహారం, డబ్బు, సమయం; (2) న్యాయం — వేతనం, హక్కులు, గౌరవం; (3) ఉద్యోగం, నైపుణ్య శిక్షణ; (4) స్థానిక సంఘం ద్వారా క్రమమైన సేవ; (5) సంబంధం — \"మీ ఇంటికి ఆహ్వానించండి\" (హెబ్రీ 13:2). దానం మాత్రమే కాదు — గౌరవం, సంబంధం ముఖ్యం (రోమా 12:13).", "refs": "ద్వితీయోపదేశకాండము 15:11; లేవీయకాండము 19:34; మత్తయి 25:35-40; యాకోబు 1:27", "cat": "ethics", "new": true}], "groups": [{"id": "bible", "name": "బైబిల్ & అధ్యయనం", "name_en": "The Bible", "icon": "📖"}, {"id": "godhead", "name": "దేవుడు & క్రీస్తు", "name_en": "God & Christ", "icon": "✝️"}, {"id": "salvation", "name": "రక్షణ & కృప", "name_en": "Salvation", "icon": "🩸"}, {"id": "story", "name": "కథ & నేపథ్యం", "name_en": "Story & Background", "icon": "🏺"}, {"id": "faith", "name": "నమ్మకం & సవాళ్లు", "name_en": "Faith & Challenges", "icon": "🛡️"}, {"id": "life", "name": "రోజువారీ జీవితం", "name_en": "Daily Life", "icon": "🌱"}, {"id": "church", "name": "సంఘం & సమాజం", "name_en": "Church & Society", "icon": "⛪"}, {"id": "more", "name": "ఇతరములు", "name_en": "More", "icon": "📌"}]}</script>

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}};

let tt;function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

const cat=id=>D.categories.find(c=>c.id===id)||{id:'other',name:'ఇతరములు',name_en:'Other',icon:'📌',grp:'more'};

function parts(e){return{title:e.q.replace(/\*\*.+?\*\*/g,'').trim()||e.q,
  notes:[...e.q.matchAll(/\*\*(.+?)\*\*/g)].map(m=>m[1].trim())}}

/* ---------- search engine ---------- */
function refBooks(e){
  if(!e.refs)return [];
  return e.refs.split(/[;；]/).map(r=>r.trim()).filter(Boolean).map(r=>{
    const p=parseRef(r); return p?p.book:null;
  }).filter(Boolean);
}
function tokens(){
  const q=S.q.trim();
  if(!q)return [];
  if(S.phrase)return [q.toLowerCase()];
  return q.toLowerCase().split(/\s+/).filter(Boolean);
}
function score(e,T){
  const p=parts(e),t=p.title.toLowerCase(),a=(e.a||'').toLowerCase(),r=(e.refs||'').toLowerCase();
  let s=0;
  for(const w of T){
    let hit=false;
    if(S.inQ&&t.includes(w)){s+=6;hit=true}
    if(S.inR&&r.includes(w)){s+=3;hit=true}
    if(S.inA&&a.includes(w)){s+=1;hit=true}
    if(!hit)return 0;                     // every word must match somewhere
  }
  return s;
}
function filtered(){
  const T=tokens();
  let L=D.entries.filter(e=>{
    if(S.grp!=='all'&&cat(e.cat).grp!==S.grp)return false;
    if(S.cat!=='all'&&e.cat!==S.cat)return false;
    if(S.scope==='saved'&&!U.fav.includes(e.id))return false;
    if(S.scope==='done'&&!U.done.includes(e.id))return false;
    if(S.scope==='todo'&&U.done.includes(e.id))return false;
    if(S.scope==='new'&&!e.new)return false;
    if(S.book&&!refBooks(e).includes(S.book))return false;
    if(T.length){const sc=score(e,T);if(!sc)return false;e.__sc=sc}
    return true;
  });
  const by={relevance:(a,b)=>(b.__sc||0)-(a.__sc||0)||a.id-b.id,
            newest:(a,b)=>b.id-a.id,oldest:(a,b)=>a.id-b.id,
            az:(a,b)=>parts(a).title.localeCompare(parts(b).title,'te')};
  L.sort(by[S.sort]||by.relevance);
  if(S.sort!=='relevance')L.forEach(e=>delete e.__sc);
  return L;
}
function hl(s){
  s=esc(s);const T=tokens();if(!T.length)return s;
  let out=s;
  T.forEach(w=>{try{
    const re=new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,'<mark>$1</mark>');
  }catch(e){}});
  return out;
}
function snippet(e,T){
  if(!T.length)return '';
  const a=e.a||'';const low=a.toLowerCase();
  let i=-1;for(const w of T){const k=low.indexOf(w);if(k>=0&&(i<0||k<i))i=k}
  if(i<0)return '';
  const from=Math.max(0,i-40),to=Math.min(a.length,i+120);
  return (from>0?'…':'')+a.slice(from,to)+(to<a.length?'…':'');
}
function activeFilters(){
  let n=0;
  if(S.grp!=='all')n++; if(S.cat!=='all')n++; if(S.book)n++;
  if(S.scope!=='all')n++; if(S.sort!=='relevance')n++;
  if(!S.inQ||!S.inA||!S.inR)n++; if(S.phrase)n++;
  return n;
}

    if(D.groups.some(g=>g.id===arg)){S.grp=arg;S.cat='all'}

    n.map(([k,l,i])=>`<button class="nav" ${cur===k?'aria-current="page"':''} onclick="go('${k}')"><span class="ni">${i}</span>${l}</button>`).join('');
}

   <h1 lang="te" style="margin-top:.7rem">${esc(p.title)}</h1>
   ${p.notes.map(n=>`<div class="series" lang="te">${esc(n)}</div>`).join('')}
   <div class="ans" lang="te">${esc(e.a)}</div>
   ${refChips(e.refs)}
   <div class="acts">
     <button class="btn" aria-pressed="${U.fav.includes(e.id)}" onclick="tog('fav',${e.id})">★ Save</button>
     <button class="btn" aria-pressed="${U.done.includes(e.id)}" onclick="tog('done',${e.id})">✓ Studied</button>
     <button class="btn" onclick="copyQ(${e.id})">Copy</button>
     <button class="btn" onclick="shareQ(${e.id})">Share</button>
     <button class="btn" onclick="edit(${e.id})">Edit</button>
   </div>
   <h3 class="h3">My notes</h3>
   <textarea id="note" placeholder="Write what you learned or want to ask…" oninput="U.notes[${e.id}]=this.value;clearTimeout(window.nt);window.nt=setTimeout(save,500)">${esc(U.notes[e.id]||'')}</textarea>
   <div class="acts">
     <button class="btn" ${i>0?'':'disabled'} onclick="openQ(${L[i-1]?L[i-1].id:0})">← Previous</button>
     <button class="btn" ${i>=0&&i<L.length-1?'':'disabled'} onclick="openQ(${L[i+1]?L[i+1].id:0})">Next →</button>
   </div>
   ${rel.length?`<h3 class="h3">More in ${esc(c.name_en)}</h3><div class="related">${rel.map(x=>`<button lang="te" onclick="openQ(${x.id})">${esc(parts(x).title)}</button>`).join('')}</div>`:''}
   ${sameBook.length?`<h3 class="h3">Also uses these verses</h3><div class="related">${sameBook.map(x=>`<button lang="te" onclick="openQ(${x.id})">${esc(parts(x).title)}</button>`).join('')}</div>`:''}`;
  R.scrollTop=0;
}
function tog(k,id){
  const a=U[k],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save();renderList();renderReader();
  toast(k==='fav'?(i<0?'Saved':'Removed from saved'):(i<0?'Marked as studied':'Marked as not studied'));
}
const txt=e=>{const p=parts(e);return p.title+'\n\n'+e.a+(e.refs?'\n\n'+e.refs:'')};
function copyQ(id){
  const t=txt(byId(id));
  navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy failed')):toast('Copy is not available here');
}
function shareQ(id){
  const t=txt(byId(id));
  navigator.share?navigator.share({title:'Bible Answers',text:t}).catch(()=>{}):copyQ(id);
}

/* ---------- verses ---------- */
const bcache={};
function parseRef(ref){
  const m=ref.trim().match(/^(.+?)\s+(\d+)(?:\s*:\s*(\d+)(?:\s*[-–—]\s*(\d+))?)?\s*$/);
  if(!m)return null;
  const raw=m[1].trim().replace(/\.$/,''),k=raw.toLowerCase();
  let eng=BOOK_MAP[raw]||BOOK_MAP[k];
  if(!eng)for(const[a,b]of Object.entries(BOOK_MAP)){if(k.startsWith(a.toLowerCase())||a.toLowerCase().startsWith(k)){eng=b;break}}
  if(!eng)return null;
  return {book:eng,ch:+m[2],v:m[3]?+m[3]:null,ve:m[4]?+m[4]:(m[3]?+m[3]:null)};
}
async function teluguChapter(book,ch){
  const key=book+':'+ch;if(bcache[key])return bcache[key];
  const r=await fetch('https://raw.githubusercontent.com/aruljohn/Bible-telugu/main/'+encodeURIComponent(book)+'.json');
  if(!r.ok)throw 0;
  const j=await r.json();
  const c=(j.chapters||[]).find(x=>String(x.chapter)===String(ch));if(!c)throw 0;
  return bcache[key]=c.verses.map(v=>({n:+v.verse,t:v.text}));
}
function openSheet(h){$('#sheet').innerHTML=h;$('#scrim').classList.add('show');document.body.style.overflow='hidden'}
function closeSheet(){$('#scrim').classList.remove('show');document.body.style.overflow=''}
document.addEventListener('DOMContentLoaded',()=>{
  const sc=$('#scrim');if(sc)sc.addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
});
async function verse(ref){
  const p=parseRef(ref);
  if(!p){
    openSheet(`<h3 lang="te">${esc(ref)}</h3><p class="sub" style="margin:.7rem 0">This reference has no chapter and verse to look up.</p>
      <div class="links"><a class="btn" target="_blank" rel="noopener" href="https://www.wordproject.org/bibles/te/index.htm">Telugu Bible</a>
      <button class="btn" onclick="closeSheet()">Close</button></div>`);return;
  }
  const slug=p.book==='Song of Songs'?'songs':p.book.toLowerCase().replace(/ /g,'_');
  const pass=p.book+' '+p.ch+(p.v?':'+p.v+(p.ve>p.v?'-'+p.ve:''):'');
  const links=`<div class="links">
    <a class="btn" target="_blank" rel="noopener" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(pass)}&version=NIV">English (NIV)</a>
    <a class="btn" target="_blank" rel="noopener" href="https://biblehub.com/interlinear/${slug}/${p.ch}-${p.v||1}.htm">Greek / Hebrew</a>
    <a class="btn" target="_blank" rel="noopener" href="https://biblehub.com/commentaries/${slug}/${p.ch}-${p.v||1}.htm">Commentaries</a>
    <button class="btn" onclick="closeSheet()">Close</button></div>`;
  openSheet(`<h3 lang="te">${esc(ref)}</h3><p class="sub">${esc(pass)}</p>
    <div class="vtext" id="vt" lang="te">Loading Telugu text…</div>${links}`);
  try{
    const all=await teluguChapter(p.book,p.ch);
    const a=p.v||1,b=p.v?p.ve:Math.min(a+11,all.length);
    const sel=all.filter(x=>x.n>=a&&x.n<=b);
    $('#vt').innerHTML=sel.length?sel.map(x=>`<sup>${x.n}</sup>${esc(x.t)} `).join('')+
      (!p.v&&b<all.length?'<p class="sub">Showing the first verses — open the links for the full chapter.</p>':''):'Verse not found.';
  }catch(e){
    $('#vt').innerHTML='<span class="sub">Couldn’t load the Telugu text — check your internet connection, or use the links below.</span>';
  }
}

/* ---------- settings ---------- */
function vMore(){
  const st={studied:U.done.length,saved:U.fav.length,notes:Object.values(U.notes||{}).filter(v=>v&&v.trim()).length};
  return `<div class="page"><h1 style="font-size:1.5rem">Settings</h1>
  <div class="statrow">
    <div class="stat"><b>${D.entries.length}</b><small>questions</small></div>
    <div class="stat"><b>${st.studied}</b><small>studied</small></div>
    <div class="stat"><b>${st.saved}</b><small>saved</small></div>
    <div class="stat"><b>${st.notes}</b><small>notes</small></div>
  </div>
  <h2>Install</h2>
  <p class="sub">Add Bible Answers to your home screen and open it like an app — it works offline once installed.</p>
  <div class="acts"><button class="btn pri" onclick="doInstall()">📲 Install app</button>
    <button class="btn" onclick="installHelp()">How to install</button></div>
  <h2>Reading</h2>
  <label class="sub">Answer text size: ${U.fs}px</label>
  <input type="range" min="14" max="24" value="${U.fs}" oninput="U.fs=+this.value;save();document.documentElement.style.setProperty('--fs',U.fs+'px');this.previousElementSibling.textContent='Answer text size: '+U.fs+'px'">
  <label class="sub" style="display:block;margin-top:.8rem">Theme</label>
  <select onchange="U.theme=this.value;save();applyTheme()">
    <option value="auto" ${U.theme==='auto'?'selected':''}>Match my device</option>
    <option value="light" ${U.theme==='light'?'selected':''}>Light</option>
    <option value="dark" ${U.theme==='dark'?'selected':''}>Dark</option>
  </select>
  <h2>Your questions</h2>
  <div class="acts"><button class="btn pri" onclick="edit(0)">Add a question</button></div>
  <h2>Backup</h2>
  <p class="sub">Saves your edits, saved list, studied marks and notes to one file.</p>
  <div class="acts"><button class="btn pri" onclick="backup()">Download backup</button>
    <label class="btn" style="cursor:pointer">Restore from file<input type="file" accept=".json" hidden onchange="restore(event)"></label>
    <button class="btn danger" onclick="resetAll()">Reset to original</button></div>
  <h2>Shortcuts</h2>
  <p class="sub">/ search · j / k next and previous · Esc close · Enter open</p>
  <h2>About</h2>
  <p class="sub">Bible Answers — ${D.entries.length} questions in ${D.categories.length} themes across ${D.groups.length} groups. Telugu answers with Bible references; tap any reference to read the verses. Scripture links open Bible Gateway and BibleHub.</p>
  </div>`;
}
function applyTheme(){
  if(U.theme==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',U.theme);
}
function edit(id){
  const e=id?byId(id):{q:'',a:'',refs:'',cat:'general'};
  const opts=D.groups.map(g=>`<optgroup label="${esc(g.name_en)}">`+
    catsIn(g.id).map(c=>`<option value="${c.id}" ${c.id===e.cat?'selected':''}>${c.icon} ${esc(c.name_en)}</option>`).join('')+`</optgroup>`).join('');
  openSheet(`<h3>${id?'Edit question':'Add a question'}</h3>
   <label>Question</label><textarea id="eq" lang="te">${esc(e.q)}</textarea>
   <label>Answer</label><textarea id="ea" lang="te" style="min-height:140px">${esc(e.a)}</textarea>
   <label>References (separate with ;)</label><input id="er" lang="te" value="${esc(e.refs||'')}">
   <label>Theme</label><select id="ec">${opts}</select>
   <div class="acts"><button class="btn pri" onclick="saveE(${id})">Save</button>
   <button class="btn" onclick="closeSheet()">Cancel</button>
   ${id?`<button class="btn danger" onclick="delE(${id})">Delete</button>`:''}</div>`);
}
function saveE(id){
  const q=$('#eq').value.trim();if(!q){toast('Add a question first');return}
  const v={q,a:$('#ea').value.trim(),refs:$('#er').value.trim(),cat:$('#ec').value};
  if(id)Object.assign(byId(id),v);
  else{v.id=Math.max(0,...D.entries.map(x=>x.id))+1;D.entries.push(v);id=v.id}
  save();closeSheet();
  if(S.view!=='q'){S.view='q';S.cat='all';S.grp='all';S.scope='all'}
  S.id=id;render();toast('Saved');
}
function delE(id){
  if(!confirm('Delete this question?'))return;
  D.entries=D.entries.filter(x=>x.id!==id);
  U.fav=U.fav.filter(x=>x!==id);U.done=U.done.filter(x=>x!==id);
  save();closeSheet();S.id=null;render();
}
function backup(){
  const b=new Blob([JSON.stringify({D,U},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='bible-answers-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded');
}
function restore(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),d=j.D||j;
      if(!d.entries||!d.categories)throw 0;
      if(!confirm('Replace current data with '+d.entries.length+' questions from this file?'))return;
      D=d;if(!D.groups||!D.groups.length)D.groups=[{id:'more',name:'ఇతరములు',name_en:'More',icon:'📌'}];
      D.categories.forEach(c=>{if(!c.grp)c.grp='more'});
      if(j.U)U=Object.assign(U,j.U);
      save();applyTheme();S.view='home';render();toast('Restored');
    }catch(e){toast('That file is not a valid backup')}
  };
  r.readAsText(f);ev.target.value='';
}
function resetAll(){
  if(!confirm('Reset questions, saved list, studied marks and notes to the original?'))return;
  ['ba3_data','ba3_user','ba2_data','ba2_user','ba_data_v3'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
  load();applyTheme();S.view='home';render();toast('Reset');
}

/* ---------- install / PWA ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
window.addEventListener('appinstalled',()=>{U.installed=true;save();toast('Installed — open it from your home screen');render();});
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
}
async function doInstall(){
  if(isStandalone()){toast('Already installed');return}
  if(deferredPrompt){
    deferredPrompt.prompt();
    const c=await deferredPrompt.userChoice.catch(()=>({outcome:'dismissed'}));
    deferredPrompt=null;
    if(c.outcome==='accepted')toast('Installing…');
    return;
  }
  installHelp();
}
function installHelp(){
  const ua=navigator.userAgent||'';
  const ios=/iPhone|iPad|iPod/i.test(ua);
  const android=/Android/i.test(ua);
  let steps;
  if(ios){
    steps=`<ol class="steps"><li>Open this page in <b>Safari</b>.</li>
      <li>Tap the <b>Share</b> button (square with an arrow).</li>
      <li>Scroll and tap <b>Add to Home Screen</b>.</li>
      <li>Tap <b>Add</b> — the Q&amp;A Bible icon appears on your home screen.</li></ol>`;
  }else if(android){
    steps=`<ol class="steps"><li>Open this page in <b>Chrome</b>.</li>
      <li>Tap the <b>⋮</b> menu at the top right.</li>
      <li>Tap <b>Install app</b> (or “Add to Home screen”).</li>
      <li>Confirm — the app icon is added to your home screen.</li></ol>`;
  }else{
    steps=`<ol class="steps"><li>In <b>Chrome or Edge</b>, click the install icon in the address bar — or the <b>⋮</b> menu → <b>Install</b>.</li>
      <li>In <b>Safari on Mac</b>: <b>File → Add to Dock</b>.</li>
      <li>On a phone: open the menu and choose <b>Add to Home screen</b>.</li></ol>`;
  }
  openSheet(`<h3>📲 Install Bible Answers</h3>
    <p class="sub" style="margin:.5rem 0 .8rem">Installing gives you a home-screen icon, a full-screen app window and offline access to all ${D.entries.length} questions.</p>
    ${steps}
    <p class="sub" style="margin:.8rem 0">If you opened this file directly from storage (file://), installing may not be offered — host the included folder on any web address (or use “Add to Home Screen” in your browser menu).</p>
    <div class="acts"><button class="btn" onclick="closeSheet()">Got it</button></div>`);
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

/* ---------- keys ---------- */
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(e.key==='Escape'){if($('#scrim').classList.contains('show'))closeSheet();else if(S.id!=null)closeQ();return}
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  if(e.key==='/'&&S.view==='q'){e.preventDefault();const b=$('#sbox');if(b)b.focus()}
  if((e.key==='j'||e.key==='k')&&S.view==='q'){
    const L=filtered(),i=L.findIndex(x=>x.id===S.id);
    const n=L[e.key==='j'?i+1:Math.max(i-1,0)];if(n)openQ(n.id);
  }
  if(e.key==='f'&&S.view==='q'){S.adv=!S.adv;render()}
});

load();applyTheme();render();

</script>
